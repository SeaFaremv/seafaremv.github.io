// --- Signup email verification (email OTP) ----------------------------------
// Redraws just the small area under the email field -- "Send Verification
// Code" button, then a code-entry box once sent, then a checkmark once
// verified -- without touching the rest of the form. Also re-runs on every
// keystroke in the email field itself: editing the address after a
// previous send/verify naturally falls back to the "Send Code" state,
// since neither state.signupEmailOtpSentTo nor signupEmailOtpVerifiedEmail
// match the new value anymore.
// (The older mobile SMS OTP functions below this -- sendSignupOtp,
// submitVerifySignupOtp, etc. -- are left in place but no longer wired
// into the form; verification switched to email since it's free via the
// Gmail SMTP already configured, while SMS/WhatsApp cost money per
// message. They could be re-enabled later if wanted.)
let _suEmailOtpCooldownTimer = null;
function renderSuEmailVerifyArea(){
  const area = document.getElementById('su-email-verify-area');
  if(!area) return;
  const emailVal = (document.getElementById('su-gmail')?.value || '').trim().toLowerCase();
  if(state.signupEmailOtpUnavailable){
    area.innerHTML = `<div class="tag-meta">${t('Email verification is currently unavailable \u2014 you can continue without it.')}</div>`;
    return;
  }
  if(state.signupEmailOtpVerifiedEmail && state.signupEmailOtpVerifiedEmail === emailVal){
    area.innerHTML = `<div class="tag-meta" style="color:var(--teal);">\u2713 ${t('Email address verified')}</div>`;
    return;
  }
  if(state.signupEmailOtpSentTo && state.signupEmailOtpSentTo === emailVal && emailVal){
    const cooldownRemaining = Math.max(0, Math.ceil((state.signupEmailOtpCooldownUntil - Date.now()) / 1000));
    area.innerHTML = `
      <div class="tag-meta" style="margin-bottom:6px;">${t('Code sent to')} ${escapeHtml(emailVal)}. ${t('Enter it below.')}</div>
      <div style="display:flex;gap:8px;">
        <input type="text" id="su-email-otp-code" inputmode="numeric" maxlength="6" placeholder="${t('6-digit code')}" style="flex:1;">
        <button type="button" class="btn btn-primary" id="su-email-verify-code-btn" style="flex:none;">${t('Verify')}</button>
      </div>
      <div class="pin-error" id="su-email-otp-error"></div>
      <button type="button" class="btn btn-ghost" id="su-email-resend-code-btn" style="width:100%;margin-top:6px;" ${cooldownRemaining>0?'disabled':''}>${cooldownRemaining>0 ? `${t('Resend code')} (${cooldownRemaining}s)` : t('Resend code')}</button>
    `;
    document.getElementById('su-email-verify-code-btn').addEventListener('click', submitVerifySignupEmailOtp);
    document.getElementById('su-email-otp-code').addEventListener('keydown', e => { if(e.key === 'Enter') submitVerifySignupEmailOtp(); });
    document.getElementById('su-email-otp-code').focus();
    document.getElementById('su-email-resend-code-btn').addEventListener('click', sendSignupEmailOtp);
    if(cooldownRemaining > 0) startSuEmailOtpCooldownTicker();
  } else {
    area.innerHTML = `<button type="button" class="btn btn-ghost" id="su-email-send-code-btn" style="width:100%;">${t('Send Verification Code')}</button><div class="pin-error" id="su-email-otp-error"></div>`;
    document.getElementById('su-email-send-code-btn').addEventListener('click', sendSignupEmailOtp);
  }
}
function startSuEmailOtpCooldownTicker(){
  if(_suEmailOtpCooldownTimer) clearInterval(_suEmailOtpCooldownTimer);
  _suEmailOtpCooldownTimer = setInterval(() => {
    const btn = document.getElementById('su-email-resend-code-btn');
    if(!btn){ clearInterval(_suEmailOtpCooldownTimer); _suEmailOtpCooldownTimer = null; return; }
    const remaining = Math.max(0, Math.ceil((state.signupEmailOtpCooldownUntil - Date.now()) / 1000));
    if(remaining <= 0){
      btn.disabled = false; btn.textContent = t('Resend code');
      clearInterval(_suEmailOtpCooldownTimer); _suEmailOtpCooldownTimer = null;
    } else {
      btn.textContent = `${t('Resend code')} (${remaining}s)`;
    }
  }, 1000);
}
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim()); }
async function sendSignupEmailOtp(){
  const emailEl = document.getElementById('su-gmail');
  const email = (emailEl.value || '').trim();
  if(!isValidEmail(email)){
    clearFieldErrors(['su-gmail']);
    markFieldError('su-gmail', false);
    const mainError = document.getElementById('su-error');
    if(mainError) mainError.textContent = t('Invalid email address.');
    return;
  }
  const btn = document.getElementById('su-email-send-code-btn') || document.getElementById('su-email-resend-code-btn');
  const errorEl = document.getElementById('su-email-otp-error');
  if(btn){ btn.disabled = true; btn.textContent = t('Sending\u2026'); }
  try{
    const res = await fetch(`${API_BASE}/api/signup/send-email-code`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok || !data.ok){
      if(res.status === 503){
        // Email sending isn't configured on this deployment -- fall back
        // to letting signup proceed unverified rather than blocking
        // everyone on an optional feature that isn't set up yet.
        state.signupEmailOtpUnavailable = true;
        renderSuEmailVerifyArea();
        return;
      }
      if(errorEl) errorEl.textContent = (data && data.error) || 'Could not send a code. Try again.';
      if(btn){ btn.disabled = false; btn.textContent = t(btn.id === 'su-email-resend-code-btn' ? 'Resend code' : 'Send Verification Code'); }
      return;
    }
    state.signupEmailOtpSentTo = email.trim().toLowerCase();
    state.signupEmailOtpVerifiedEmail = null;
    state.signupEmailOtpCooldownUntil = Date.now() + 45000;
    renderSuEmailVerifyArea();
  }catch(e){
    console.error('sendSignupEmailOtp failed', e);
    if(errorEl) errorEl.textContent = 'Something went wrong. Try again.';
    if(btn){ btn.disabled = false; btn.textContent = t('Send Verification Code'); }
  }
}
async function submitVerifySignupEmailOtp(){
  const email = (document.getElementById('su-gmail').value || '').trim();
  const code = (document.getElementById('su-email-otp-code').value || '').trim();
  const errorEl = document.getElementById('su-email-otp-error');
  const btn = document.getElementById('su-email-verify-code-btn');
  if(!code){ if(errorEl) errorEl.textContent = t('Enter the code sent to your email.'); return; }
  if(btn){ btn.disabled = true; btn.textContent = t('Verifying\u2026'); }
  try{
    const res = await fetch(`${API_BASE}/api/signup/verify-email-code`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, code }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok || !data.ok){
      if(errorEl) errorEl.textContent = (data && data.error) || t('Incorrect code.');
      if(btn){ btn.disabled = false; btn.textContent = t('Verify'); }
      return;
    }
    state.signupEmailOtpVerifiedEmail = email.trim().toLowerCase();
    renderSuEmailVerifyArea();
  }catch(e){
    console.error('submitVerifySignupEmailOtp failed', e);
    if(errorEl) errorEl.textContent = 'Something went wrong. Try again.';
    if(btn){ btn.disabled = false; btn.textContent = t('Verify'); }
  }
}

const SIGNUP_FIELD_IDS = ['su-boat-name','su-owner-name','su-mobile','su-passkey'];
function clearFieldErrors(ids){ ids.forEach(id => document.getElementById(id)?.classList.remove('field-error')); }
function markFieldError(id, clearValue){
  const el = document.getElementById(id);
  if(!el) return;
  el.classList.add('field-error');
  if(clearValue) el.value = '';
}

async function submitSignup(){
  const val = (id) => (document.getElementById(id).value || '').trim();
  const errorEl = document.getElementById('su-error');
  const btn = document.getElementById('su-submit-btn');
  clearFieldErrors(SIGNUP_FIELD_IDS);

  const extras = state.signupExtras || defaultSignupExtras();
  const body = {
    boatName: val('su-boat-name'),
    ownerName: val('su-owner-name'),
    contactNumber: extras.contactNumber,
    mobile: val('su-mobile'),
    gmail: extras.gmail,
    bankAccountName: extras.bankAccountName,
    bankAccountNumber: extras.bankAccountNumber,
    routes: extras.routes.split('\n').map(s=>s.trim()).filter(Boolean),
    trackingLink: extras.trackingLink,
    viberLink: extras.viberLink,
    socialLinks: extras.socialLinks.split('\n').map(s=>s.trim()).filter(Boolean),
    passkey: val('su-passkey'),
  };

  const requiredMap = { boatName:'su-boat-name', ownerName:'su-owner-name', mobile:'su-mobile', passkey:'su-passkey' };
  const missing = Object.keys(requiredMap).filter(k => !body[k]);
  if(missing.length){
    missing.forEach(k => markFieldError(requiredMap[k], false));
    errorEl.textContent = 'Please fill in all fields marked *.';
    return;
  }
  if(body.passkey.length < 6){
    markFieldError('su-passkey', true);
    errorEl.textContent = 'PIN must be at least 6 characters.';
    return;
  }
  if(!isValidMaldivesMobile(body.mobile)){
    markFieldError('su-mobile', false);
    errorEl.textContent = 'Invalid mobile number \u2014 must start with 7 or 9 and have 7 digits.';
    return;
  }
  if(body.gmail && !isValidEmail(body.gmail)){
    errorEl.textContent = t('Invalid email address.');
    return;
  }

  errorEl.textContent = '';
  btn.disabled = true; btn.textContent = 'Creating\u2026';
  try{
    const res = await fetch(`${API_BASE}/api/signup`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    btn.disabled = false; btn.textContent = t('Sign Up');
    if(res.ok && data.ok){
      state.orgSignupTotpSecret = data.totpSecret;
      state.orgAuthed = true;
      state.showPlanChoice = true;
      state.orgPasskey = body.passkey;
      state.orgData = {
        id: data.organizationId, boatName: body.boatName, ownerName: body.ownerName,
        contactNumber: body.contactNumber || body.mobile, gmail: body.gmail, mobile: body.mobile,
        bankAccountName: body.bankAccountName, bankAccountNumber: body.bankAccountNumber,
        trackingLink: body.trackingLink, viberLink: body.viberLink,
        socialLinks: body.socialLinks, routes: body.routes,
      };
      state.orgBoats = [{ id: data.boatId, name: body.boatName, is_primary: true, status: 'active' }];
      CURRENT_BOAT_ID = data.boatId;
      renderOrgArea();
    } else if(data && data.blocked){
      errorEl.textContent = '';
      openBlockedNumberPopup(data);
    } else {
      const msg = (data && data.error) || 'Could not create your account.';
      errorEl.textContent = msg;
      if(/boat name/i.test(msg)) markFieldError('su-boat-name', true);
      if(/mobile number is already in use/i.test(msg)) markFieldError('su-mobile', false);
    }
  }catch(e){
    console.error('signup failed', e);
    btn.disabled = false; btn.textContent = t('Sign Up');
    errorEl.textContent = 'Something went wrong. Try again.';
  }
}

async function renderBlockedDuePaymentBody(organizationId){
  const area = document.getElementById('blocked-payment-area');
  if(!area) return;
  area.innerHTML = `<div class="note">${t('Generating a payment link\u2026')}</div>`;
  try{
    const res = await fetch(`${API_BASE}/api/blocked-numbers/due-payment-link`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ organizationId }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok || !data.ok || !data.paymentUrl){
      area.innerHTML = `<div class="note" style="border-color:var(--red);color:var(--ink-soft);">${t('Could not create a payment link right now. Try again in a moment.')}</div>`;
      return;
    }
    _blockedDuePaymentRef = data.swipePaymentId;
    area.innerHTML = `
      <a href="${escapeHtml(data.paymentUrl)}" target="_blank" rel="noopener" class="btn btn-primary" style="width:100%;display:block;text-align:center;text-decoration:none;">${t('Open Payment Link')}</a>

      <div id="blocked-payment-status" class="tag-meta" style="margin-top:8px;">${t('Status')}: ${escapeHtml(data.status || 'PENDING')}</div>
    `;
    document.getElementById('blocked-payment-check-btn').addEventListener('click', () => checkBlockedDuePaymentStatus(false));
  }catch(e){
    console.error('renderBlockedDuePaymentBody failed', e);
    area.innerHTML = `<div class="note" style="border-color:var(--red);color:var(--ink-soft);">${t('Could not create a payment link right now. Try again in a moment.')}</div>`;
  }
}
async function checkBlockedDuePaymentStatus(isAutoPoll){
  if(!_blockedDuePaymentRef) return;
  const btn = document.getElementById('blocked-payment-check-btn');
  const statusEl = document.getElementById('blocked-payment-status');
  if(!isAutoPoll && btn){ btn.disabled = true; btn.textContent = t('Checking\u2026'); }
  try{
    const res = await fetch(`${API_BASE}/api/blocked-numbers/due-payment-link/${encodeURIComponent(_blockedDuePaymentRef)}/status`);
    const data = await res.json().catch(() => ({}));
    if(data.ok && data.status === 'COMPLETED'){
      renderBlockedDuePaymentChoice();
      return;
    }
    if(statusEl) statusEl.textContent = `${t('Status')}: ${data.status || 'PENDING'}`;
  }catch(e){ console.error('checkBlockedDuePaymentStatus failed', e); }
  if(!isAutoPoll && btn){ btn.disabled = false; btn.textContent = t('Check Now'); }
}
function renderBlockedDuePaymentChoice(){
  const area = document.getElementById('blocked-payment-area');
  if(!area) return;
  area.innerHTML = `
    <div class="note" style="border-color:var(--green);margin-bottom:10px;">${t('Payment confirmed. What would you like to do?')}</div>
    <button class="btn btn-primary" id="blocked-resolve-existing-btn" style="width:100%;margin-bottom:8px;">${t('Continue with my previous account')}</button>
    <button class="btn btn-ghost" id="blocked-resolve-new-btn" style="width:100%;">${t('Start a new account instead')}</button>
    <p class="sub" style="margin-top:8px;">${t('A new account starts on the free plan, not Pro.')}</p>
  `;
  document.getElementById('blocked-resolve-existing-btn').addEventListener('click', () => submitBlockedDuePaymentResolve('existing'));
  document.getElementById('blocked-resolve-new-btn').addEventListener('click', () => submitBlockedDuePaymentResolve('new'));
}
async function submitBlockedDuePaymentResolve(choice){
  const area = document.getElementById('blocked-payment-area');
  if(area) area.innerHTML = `<div class="note">${t('Working\u2026')}</div>`;
  try{
    const res = await fetch(`${API_BASE}/api/blocked-numbers/resolve`, {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ reference: _blockedDuePaymentRef, choice }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok || !data.ok){
      if(area) area.innerHTML = `<div class="note" style="border-color:var(--red);color:var(--ink-soft);">${(data && data.error) || t('Something went wrong. Try again.')}</div>`;
      return;
    }
    closeBlockedNumberPopup();
    if(choice === 'existing'){
      state.orgScreen = 'login';
      state.orgError = '';
      renderOrgArea();
      alert(t("Your account is reactivated. Log in with your mobile number and PIN."));
    } else {
      alert(t("You're clear to sign up with these numbers now. Please submit the form again."));
    }
  }catch(e){
    console.error('submitBlockedDuePaymentResolve failed', e);
    if(area) area.innerHTML = `<div class="note" style="border-color:var(--red);color:var(--ink-soft);">${t('Something went wrong. Try again.')}</div>`;
  }
}

function renderOrgLogin(){
  const area = document.getElementById('gate-area');
  area.innerHTML = `
    <div class="gate-wrap">
      <div class="pin-box">
        <div class="rname">Owner Login</div>
        <label style="text-align:left;display:block;margin-bottom:4px;">Username (your mobile number)</label>
        <input type="tel" id="ol-mobile" style="text-align:left;letter-spacing:normal;font-family:inherit;font-size:calc(16px * var(--en-scale));">
        <label style="text-align:left;display:block;margin:10px 0 4px;">${t("Password")}</label>
        <input type="password" id="ol-passkey" style="text-align:left;letter-spacing:normal;font-family:inherit;font-size:calc(16px * var(--en-scale));">
        <div style="text-align:left;margin:-4px 0 4px;"><a href="javascript:void(0)" id="ol-forgot-link" style="text-decoration:underline;color:var(--navy-deep);font-size:calc(13px * var(--en-scale));">Forgot password?</a></div>
        <div class="pin-error" id="ol-error">${escapeHtml(state.orgError || '')}</div>
        <div id="ol-wait-note" style="display:none;font-size:calc(12px * var(--en-scale));color:var(--ink-soft);text-align:left;margin:-2px 0 8px;">This can take up to a minute if the server has been idle.</div>
        <button class="btn btn-primary" id="ol-submit-btn" style="width:100%;margin:10px 0;">${t("Log In")}</button>
        <button class="btn btn-ghost" id="ol-signup-instead-btn" style="width:100%;margin-bottom:8px;">${t("New here? Register")}</button>
        <button class="btn btn-ghost" id="ol-back-btn" style="width:100%;">${t("Back")}</button>
      </div>
    </div>
  `;
  document.getElementById('ol-mobile').focus();
  autoBlurOnAutofill(document.getElementById('ol-mobile'));
  autoBlurOnAutofill(document.getElementById('ol-passkey'));
  document.getElementById('ol-forgot-link').addEventListener('click', () => {
    state.orgForgotMobile = document.getElementById('ol-mobile').value.trim();
    renderOrgForgotPassword();
  });
  const submit = async () => {
    const errorEl = document.getElementById('ol-error');
    const waitNote = document.getElementById('ol-wait-note');
    const btn = document.getElementById('ol-submit-btn');
    clearFieldErrors(['ol-mobile','ol-passkey']);
    const mobile = document.getElementById('ol-mobile').value.trim();
    const passkey = document.getElementById('ol-passkey').value;
    if(!mobile) markFieldError('ol-mobile', false);
    if(!passkey) markFieldError('ol-passkey', false);
    if(!mobile || !passkey){ errorEl.textContent = 'Enter your username and password.'; return; }
    errorEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Logging in\u2026';
    // The backend sleeps when idle and can take up to ~50s to wake back
    // up on its first request -- surfacing that expectation up front
    // (rather than leaving "Logging in..." sitting there with zero
    // explanation) is what stops a genuinely-still-working request from
    // reading as a stuck/broken button. Also a hard cutoff via
    // AbortController so a request that's actually gone nowhere (bad
    // connection, server down) doesn't leave the button disabled
    // forever with no way to tell the difference or retry.
    const waitNoteTimer = setTimeout(() => { waitNote.style.display = 'block'; }, 4000);
    const controller = new AbortController();
    const timeoutTimer = setTimeout(() => controller.abort(), 55000);
    try{
      const res = await fetch(`${API_BASE}/api/org-login`, {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mobile, passkey }),
        signal: controller.signal
      });
      const data = await res.json().catch(() => ({}));
      clearTimeout(waitNoteTimer); clearTimeout(timeoutTimer);
      waitNote.style.display = 'none';
      btn.disabled = false; btn.textContent = t('Log In');
      if(res.ok && data.ok){
        state.orgAuthed = true; state.orgPasskey = passkey;
        state.orgData = data.organization; state.orgBoats = data.boats || [];
        renderOrgArea();
      } else {
        if(res.status === 403){
          errorEl.textContent = '';
          const warning = suspensionDeleteWarning(data && data.suspendedAt);
          const parts = [(data && data.error) || 'This account has been suspended.'];
          if(data && data.note) parts.push(`Reason given: "${data.note}"`);
          if(warning) parts.push(warning);
          showMessageBox('Account Suspended', parts.join('\n\n'));
        } else {
          errorEl.textContent = (data && data.error) || 'Login failed.';
        }
        markFieldError('ol-mobile', false);
        markFieldError('ol-passkey', true);
      }
    }catch(e){
      console.error('org login failed', e);
      clearTimeout(waitNoteTimer); clearTimeout(timeoutTimer);
      waitNote.style.display = 'none';
      btn.disabled = false; btn.textContent = t('Log In');
      errorEl.textContent = e.name === 'AbortError'
        ? 'Taking too long to respond. Check your connection and try again.'
        : 'Something went wrong. Try again.';
    }
  };
  document.getElementById('ol-submit-btn').addEventListener('click', submit);
  document.getElementById('ol-passkey').addEventListener('keydown', (e) => { if(e.key==='Enter') submit(); });
  document.getElementById('ol-signup-instead-btn').addEventListener('click', () => { state.orgScreen = 'signup'; state.orgError=''; renderOrgArea(); });
  document.getElementById('ol-back-btn').addEventListener('click', orgBackToStart);
}

// Light-blue tint/border pairs cycled across the "Your Boats" rows (see
// renderOrgDashboard) so multiple boats visually read as distinct tabs
// rather than a uniform stack -- all still within the app's navy/teal
// palette, just varied shades of it.
const BOAT_TAB_COLORS = [
  { bg: 'rgba(28,143,224,0.10)',  border: 'rgba(28,143,224,0.38)' },
  { bg: 'rgba(0,191,165,0.12)',   border: 'rgba(0,191,165,0.38)' },
  { bg: 'rgba(91,140,220,0.13)',  border: 'rgba(91,140,220,0.42)' },
  { bg: 'rgba(120,170,235,0.13)', border: 'rgba(120,170,235,0.42)' },
  { bg: 'rgba(0,150,199,0.11)',   border: 'rgba(0,150,199,0.38)' },
];
// Even a Pro organization can only run this many boats -- unlimited
// additional boats was never really the intent of Pro, just "more than
// one." Enforced both where the request form would otherwise open (so
// it's never shown at all once the cap is hit) and again right before
// actually submitting a request, in case the boat count changed in
// between (another tab, a stale render, etc).
// Even a Pro organization can only run this many boats -- matches the
// server's own boatCapReached() limit (see server.js) exactly, so the
// client blocks the request form before it ever opens instead of letting
// it through only to be rejected server-side with a different, plainer
// error message once submitted.
const MAX_BOATS_PER_ORG = 15;
// Warning popup for hitting that cap -- same frosted-glass wave-pattern
// treatment as the app's other themed panels, just in a translucent red
// instead of navy, since this is a hard stop rather than a normal action.

  lockBodyScroll();

  const close = () => { overlay.remove(); unlockBodyScroll(); };
  document.getElementById('max-boats-popup-close-btn').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
}

        <div class="settings-block">

          <div class="tag-meta">Owner Mobile: ${org.mobile ? telLink(org.mobile) : '\u2014'}</div>
          <div class="tag-meta">Gmail: ${escapeHtml(org.gmail||'\u2014')}</div>
          <div class="tag-meta">Bank: ${escapeHtml(org.bankAccountName||'\u2014')} ${org.bankAccountNumber ? '\u00b7 '+escapeHtml(org.bankAccountNumber) : ''}</div>
          <div class="tag-meta">Tracking link: ${renderTruncatableLink('acct-tracking-link', org.trackingLink)}</div>
          <div class="tag-meta">Viber: ${renderTruncatableLink('acct-viber-link', org.viberLink)}</div>

  `;

  wireTruncatableLinks(['acct-tracking-link', 'acct-viber-link']);
  document.getElementById('org-logout-btn').addEventListener('click', () => {
    state.orgAuthed = false; state.orgData = null; state.orgBoats = null; state.orgPasskey = '';
    state.orgSignupTotpSecret = null; state.boatRequestOpen = false; state.orgScreen = 'login'; state.showPlanChoice = false;
    state.lang = 'en';
    applyLangDirection();
    applyStaticTranslations();
    state.darkTheme = false;
    applyTheme();
    renderOrgArea();
  });
  document.querySelectorAll('[data-open-dispatch]').forEach(b => b.addEventListener('click', async () => {
    const boatId = b.dataset.openDispatch;
    CURRENT_BOAT_ID = boatId;
    await refreshData();
    state.entryMode = 'internal';
    state.gateRole = 'owner';
    state.role = 'owner';
    state.staffName = null;
    state.tab = DEFAULT_TAB.owner;
    saveSession('owner', 'owner', null, boatId);
    history.replaceState(null, '', '#' + OWNER_HASH + '/' + boatId);
    render();
    startPolling();
  }));
  document.querySelectorAll('[data-view-suspend-reason]').forEach(b => b.addEventListener('click', () => {
    const boat = boats.find(x => x.id === b.dataset.viewSuspendReason);
    if(boat) renderBoatSuspendedPage(boat);
  }));
  // Non-primary boats are Pro-gated: once Pro lapses (or was never active),
  // only the free primary boat stays reachable from this list -- tapping
  // any other boat sends the owner straight to the Upgrade to Pro popup
  // instead of opening its dispatch app. Same "use the primary boat's ID
  // for the payment link" pattern as Request Additional Boat below, since
  // the popup's Payment Link tab needs a real, currently-open boat ID.
  document.querySelectorAll('[data-open-pro-required]').forEach(b => b.addEventListener('click', () => {
    const orgBoats = state.orgBoats || [];
    const primaryBoat = orgBoats.find(x => x.is_primary) || orgBoats[0];
    if(primaryBoat) CURRENT_BOAT_ID = primaryBoat.id;
    openProFeatureRequiredPopup(t('Managing more than one boat is a Pro feature. Upgrade to Pro to access this boat.'));
  }));
  document.getElementById('request-boat-toggle-btn')?.addEventListener('click', () => {
    // Free orgs can't add extra boats at all anymore -- point them at
    // Upgrade to Pro and stop there. The name/contact number form must
    // never expand for a non-Pro org, so this returns before touching
    // state.boatRequestOpen.
    if(!isOrgPro()){
      // The org dashboard doesn't set CURRENT_BOAT_ID until a specific
      // boat's dispatch app is opened -- but the popup's Payment Link tab
      // needs a real boat ID right now to create the Swipe payment for.
      // Use this org's primary boat (falling back to the first one) so
      // that request isn't sent against whatever CURRENT_BOAT_ID happened
      // to be left over from page load.
      const orgBoats = state.orgBoats || [];
      const primaryBoat = orgBoats.find(b => b.is_primary) || orgBoats[0];
      if(primaryBoat) CURRENT_BOAT_ID = primaryBoat.id;
      openProFeatureRequiredPopup(t('Managing more than one boat is a Pro feature. Upgrade to Pro to add another boat.'));
      return;
    }
    // Hard cap still applies to Pro orgs -- check this before anything
    // else so the request form (name/contact fields) never even opens
    // once the org is already at the limit.
    if(!state.boatRequestOpen && boats.length >= MAX_BOATS_PER_ORG){
      showMaxBoatsPopup();
      return;
    }
    const opening = !state.boatRequestOpen;
    state.boatRequestOpen = opening; state.orgError = '';
    if(opening) _boatRequestOpenedAt = Date.now();
    renderOrgDashboard();
  });
  document.getElementById('first-boat-submit-btn')?.addEventListener('click', async () => {
    const errorEl = document.getElementById('first-boat-error');
    const btn = document.getElementById('first-boat-submit-btn');
    clearFieldErrors(['first-boat-name']);
    const boatName = document.getElementById('first-boat-name').value.trim();
    const contactNumber = document.getElementById('first-boat-contact').value.trim();
    if(!boatName){ markFieldError('first-boat-name', false); errorEl.textContent = 'Enter a name for your boat.'; return; }
    if(!contactNumber){ errorEl.textContent = 'Enter a contact number for this boat.'; return; }
    // This org's first boat, so there's nothing to collide with yet --
    // but the check stays here (rather than only in the additional-boat
    // handler below) so this form behaves identically if it's ever
    // reached with existing boats already on record.
    if(boats.some(b => b.name.trim().toLowerCase() === boatName.toLowerCase())){
      markFieldError('first-boat-name', false);
      errorEl.textContent = t('You already have a boat with this name — use a different name.');
      return;
    }
    errorEl.textContent = '';
    btn.disabled = true; btn.textContent = 'Adding\u2026';
    try{
      const res = await fetch(`${API_BASE}/api/boats/first-free`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ organizationId: org.id, passkey: state.orgPasskey, boatName, contactNumber })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok && data.ok){
        const refreshed = await fetch(`${API_BASE}/api/org-login`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ mobile: org.mobile, passkey: state.orgPasskey })
        }).then(r => r.json()).catch(() => null);
        if(refreshed && refreshed.ok) state.orgBoats = refreshed.boats || [];
        renderOrgDashboard();
      } else {
        btn.disabled = false; btn.textContent = t('+ Add Your Free Boat');
        errorEl.textContent = (data && data.error) || 'Could not add your boat.';
        markFieldError('first-boat-name', false);
      }
    }catch(e){
      console.error('first-free boat failed', e);
      btn.disabled = false; btn.textContent = t('+ Add Your Free Boat');
      errorEl.textContent = 'Something went wrong. Try again.';
    }
  });
  document.getElementById('req-boat-submit-btn')?.addEventListener('click', async () => {
    const errorEl = document.getElementById('req-boat-error');
    const btn = document.getElementById('req-boat-submit-btn');
    const submitLabel = isOrgPro() ? 'Add Boat' : 'Submit Request';
    clearFieldErrors(['req-boat-name']);
    const name = document.getElementById('req-boat-name').value.trim();
    const contactNumber = document.getElementById('req-boat-contact').value.trim();
    // The screenshot field doesn't exist at all for a Pro org (see the
    // markup above) -- optional chaining so this doesn't throw there.
    const file = document.getElementById('req-boat-screenshot')?.files[0];
    if(!name){ markFieldError('req-boat-name', false); errorEl.textContent = 'Enter a name for the new boat.'; return; }
    if(!contactNumber){ errorEl.textContent = 'Enter a contact number for this boat.'; return; }
    // Re-checked here as a safety net in case the boat count changed
    // since the toggle button's own check above (stale render, another
    // tab open, etc) -- this is the check that actually blocks the
    // request from being sent, not just from being opened.
    if(boats.length >= MAX_BOATS_PER_ORG){
      showMaxBoatsPopup();
      return;
    }
    // No two boats under the same organization can share a name -- boat
    // names are just labels now (login is by mobile number), but two
    // identically-named boats would still be a confusing, ambiguous list.
    if(boats.some(b => b.name.trim().toLowerCase() === name.toLowerCase())){
      markFieldError('req-boat-name', false);
      errorEl.textContent = t('You already have a boat with this name — use a different name.');
      return;
    }
    if(!isOrgPro()){
      // Pro orgs skip payment entirely (see the markup above -- no
      // screenshot field is even rendered for them), so the slip check
      // only applies to the paid path.
      if(!file){ errorEl.textContent = 'Attach a screenshot of the transfer.'; return; }
      errorEl.textContent = '';
      btn.disabled = true; btn.textContent = t('Checking slip\u2026');
      if(!_proBankAccounts) _proBankAccounts = await fetchProBankAccounts();
      const check = await checkTransferSlipAnyBank(file, {
        bmlAccountNumber: _proBankAccounts.bml ? _proBankAccounts.bml.number : '',
        mibAccountNumber: _proBankAccounts.mib ? _proBankAccounts.mib.number : '',
        expectedAmount: SWIPE_PRO_DISPLAY_AMOUNT,
        referenceTime: _boatRequestOpenedAt || Date.now(),
        windowMinutes: 15
      });
      if(!check.valid){
        btn.disabled = false; btn.textContent = t(submitLabel);
        showTransferSlipErrorPopup(check.reason, () => {
          const screenshotInput = document.getElementById('req-boat-screenshot');
          if(screenshotInput) screenshotInput.value = '';
        });
        return;
      }
    }
    errorEl.textContent = '';
    btn.disabled = true; btn.textContent = isOrgPro() ? 'Adding\u2026' : 'Submitting\u2026';
    try{
      let screenshot = null;
      if(file) screenshot = await compressImageToDataUrl(file, 800, 0.55);
      const res = await fetch(`${API_BASE}/api/boat-requests`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ organizationId: org.id, passkey: state.orgPasskey, requestedBoatName: name, contactNumber, paymentScreenshot: screenshot })
      });
      const data = await res.json().catch(() => ({}));
      if(res.ok && data.ok){
        state.boatRequestOpen = false;
        if(data.autoApproved){
          // The boat already exists server-side -- refresh the boat list
          // (same pattern as the free-first-boat flow) so it shows up
          // immediately instead of the org having to log out/in.
          const refreshed = await fetch(`${API_BASE}/api/org-login`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ mobile: org.mobile, passkey: state.orgPasskey })
          }).then(r => r.json()).catch(() => null);
          if(refreshed && refreshed.ok) state.orgBoats = refreshed.boats || [];
          alert(t('Boat added.'));
        } else {
          alert(t('Request submitted. It will be reviewed once your payment is confirmed.'));
        }
        renderOrgDashboard();
      } else {
        btn.disabled = false; btn.textContent = t(submitLabel);
        errorEl.textContent = (data && data.error) || 'Could not submit your request.';
        markFieldError('req-boat-name', false);
      }
    }catch(e){
      console.error('boat request failed', e);
      btn.disabled = false; btn.textContent = t(submitLabel);
      errorEl.textContent = 'Something went wrong. Try again.';
    }
  });
}

/* ---------------- Routing ---------------- */
function handleHash(){
  renderLangToggle();
  applyStaticTranslations();
  const h = (location.hash || '').replace('#','');
  applyHomeScreenBranding(h);

  if(h === 'admin' || h.startsWith('admin/')){
    state.entryMode = 'admin';
    if(state.lang !== 'en'){
      state.lang = 'en';
      applyLangDirection();
      applyStaticTranslations();
    }
    if(state.darkTheme){
      state.darkTheme = false;
      applyTheme();
    }
    renderAdmin();
    return;
  }

  if(h === 'signup'){
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'signup';
    renderOrgArea();
    return;
  }
  if(h === 'org' || h.startsWith('org/')){
    state.entryMode = 'org';
    if(!state.orgAuthed) state.orgScreen = 'login';
    renderOrgArea();
    return;
  }

  if(h.startsWith('reset-pin/')){
    const token = decodeURIComponent(h.slice('reset-pin/'.length));
    state.entryMode = 'internal'; state.gateRole = 'owner'; state.role = null;
    state.gateStage = 'reset-confirm'; state.resetToken = token;
    state.resetMsg = ''; state.resetError = '';
    render();
    return;
  }

  if(h === OWNER_HASH || h.startsWith(OWNER_HASH + '/')){
    // The numeric Owner PIN gate is retired -- Owners authenticate
    // exclusively through #org (boat name + passkey) now, which is real
    // authentication rather than a light PIN gate. Any #owner link just
    // sends them to the real login screen.
    location.hash = 'org';
    return;
  }
  if(h === INTERNAL_HASH || h.startsWith(INTERNAL_HASH + '/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This staff link is missing a boat reference. Ask your boat owner for the correct sign-in link from their Settings.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    if(switchingBoat || !(state.role === 'staff')){
      state.entryMode = 'internal'; state.gateRole = 'staff'; state.role = null; state.gateStage = 'pick'; state.gateMode = 'signin';
      if(switchingBoat) clearSession('staff');
    }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }
  if(h === MANAGER_HASH || h.startsWith(MANAGER_HASH + '/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This manager link is missing a boat reference. Ask your boat owner for the correct sign-in link from their Settings.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    if(switchingBoat || !(state.role === 'manager')){
      state.entryMode = 'internal'; state.gateRole = 'manager'; state.role = null; state.gateStage = 'pick';
      if(switchingBoat) clearSession('manager');
    }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }

  // Customer entry (senders/receivers) is boat-scoped via #c/<boatId>, same
  // as owner/staff links -- each boat needs its own QR code / shared link
  // now that this is a multi-boat platform.
  if(h === 'c' || h.startsWith('c/')){
    const boatId = h.includes('/') ? h.split('/')[1] : null;
    if(!boatId){
      renderInvalidLinkScreen('This link is missing a boat reference. Ask the boat owner for the correct customer check-in link.');
      return;
    }
    const switchingBoat = boatId !== CURRENT_BOAT_ID;
    CURRENT_BOAT_ID = boatId;
    state.entryMode = 'customer';
    if(!state.role || switchingBoat){ state.role = 'sender'; state.tab = 'checkin'; }
    if(switchingBoat){ refreshData().then(render); return; }
    render();
    return;
  }

  if(state.entryMode === 'internal' && INTERNAL_ROLES.includes(state.role)){
    if(getRoleTabs()[state.role].some(t => t.id === h)) state.tab = h;
    render();
    return;
  }
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    render();
    return;
  }

  // Continuing navigation within an already-active customer session (tab
  // clicks, mode toggle, etc all just set location.hash to a plain tab id).
  if(state.entryMode === 'customer' && state.role){
    if(getRoleTabs()[state.role].some(t => t.id === h)) state.tab = h;
    render();
    return;
  }

  // Anything else unrecognized -- including the bare URL -- shows the
  // landing page rather than guessing at a boat to drop the visitor into.
  renderLandingPage();
}

// Tap-to-copy for every link box shown anywhere in the app (Owner Links,
// Staff Links, Manager Links, Customer Check-In Link, etc) -- one delegated
// listener covers all of them regardless of which screen renders them.
document.body.addEventListener('click', (e) => {
  const box = e.target.closest('.url-box');
  if(!box) return;
  const linkEl = box.querySelector('.u');
  if(!linkEl) return;
  const text = linkEl.textContent;
  const showCopied = () => {
    const label = box.querySelector('.tag-label');
    if(!label) return;
    const original = label.dataset.originalText || label.textContent;
    label.dataset.originalText = original;
    label.textContent = t('Copied!');
    label.style.color = 'var(--teal)';
    setTimeout(() => { label.textContent = original; label.style.color = ''; }, 1200);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); showCopied(); }catch(err){}
      ta.remove();
    });
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showCopied(); }catch(err){}
    ta.remove();
  }
});

// Polling is the main data cost on a slow connection -- shipments carry
// embedded loading photos, so re-fetching them every few seconds on 3G
// both burns data and, worse, can queue up requests faster than 3G can
// finish them, which is what actually made the app feel broken rather
// than just slow. This: (1) skips starting a new poll while one is still
// in flight, (2) backs off the interval on a detected slow connection,
// and (3) skips entirely while offline instead of firing a doomed request.
//
// startPolling() is safe to call from any entry point that lands someone
// in the dispatch view, not just the bottom of init() -- it's idempotent
// (a second call is a no-op), which matters because several entry points
// (a returning owner's session resumed directly, and the org dashboard's
// "Open Dispatch" button that every freshly-signed-up boat goes through)
// used to skip polling setup entirely, leaving those sessions with no
// live updates from other devices until a manual reload.
let pollInFlight = false;
let pollingStarted = false;
let pollCycleCount = 0;
function currentPollIntervalMs(){
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const type = conn && conn.effectiveType;
  if(type === 'slow-2g' || type === '2g') return 45000;
  if(type === '3g') return 20000;
  return 8000;
}
async function pollCycle(){
  if(pollInFlight || !navigator.onLine){ scheduleNextPoll(); return; }
  pollInFlight = true;
  pollCycleCount++;
  try{
    // Settings (routes, staff PINs, bank details, social links) change far
    // less often than shipments do -- checking it on every single poll
    // wastes a request almost every time for data that's usually
    // identical to what's already known. Only check every 5th cycle
    // (roughly every 40s on a fast connection, up to a few minutes on a
    // slow one) -- shipments still poll every cycle unchanged, since that
    // data genuinely does change often during active dispatch.
    const shouldCheckSettings = pollCycleCount % 5 === 1;
    const [liteShipments, freshSettings] = await Promise.all([
      loadShipmentsLite(),
      shouldCheckSettings ? loadSettings() : Promise.resolve(state.settings)
    ]);
    // The lite fetch deliberately omits photos -- merge in whatever
    // we already have locally before comparing/adopting, otherwise
    // every shipment would look "changed" purely because its photo
    // field is missing, not because anything real changed. The
    // tradeoff: if someone retakes a photo on another device, this
    // device won't pick up the new one via polling alone -- only a
    // full reload or an action that specifically re-fetches that
    // shipment will. Acceptable given how rarely photos get retaken
    // versus how often polling runs.
    const localPhotosById = {};
    state.shipments.forEach(s => { if(s.photo) localPhotosById[s.id] = s.photo; });
    const freshShipments = liteShipments.map(s => localPhotosById[s.id] ? Object.assign({}, s, { photo: localPhotosById[s.id] }) : s);
    const shipmentsChanged = JSON.stringify(freshShipments) !== JSON.stringify(state.shipments);
    const settingsChanged = shouldCheckSettings && JSON.stringify(freshSettings) !== JSON.stringify(state.settings);
    if(shipmentsChanged) state.shipments = freshShipments;
    if(settingsChanged) state.settings = freshSettings;
    if(shipmentsChanged || settingsChanged){
      const typingInField = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName) && document.getElementById('panel').contains(document.activeElement);
      const hasOpenForm = typingInField || state.addCustomerOpen;
      if(settingsChanged) updateHeaderProBadge();
      if(state.role && !hasOpenForm && (state.tab === 'dashboard' || state.tab === 'track' || state.tab === 'settings')){ render(); }
      else if(state.role){ renderTabs(); }
    }
    // Roughly every 20th poll cycle (a few minutes, not every single poll
    // -- checking timestamps doesn't need to happen that often for a
    // 3-hour threshold) check whether any delivered shipment's photo
    // retention window has passed.
    if(INTERNAL_ROLES.includes(state.role) && pollCycleCount % 20 === 3){
      cleanupExpiredDeliveryPhotos().catch(e => console.error('photo cleanup failed', e));
    }
    // Same idea, offset to a different cycle so the two don't both fire at
    // once -- checks whether any delivered+paid shipment has passed its
    // 12-hour retention window and folds/removes it if so.
    if(INTERNAL_ROLES.includes(state.role) && pollCycleCount % 20 === 13){
      cleanupCompletedShipments().catch(e => console.error('completed-shipment cleanup failed', e));
    }
  } finally {
    pollInFlight = false;
    scheduleNextPoll();
  }
}
function scheduleNextPoll(){
  setTimeout(pollCycle, currentPollIntervalMs());
}
function startPolling(){
  if(pollingStarted) return;
  pollingStarted = true;
  scheduleNextPoll();
}

async function init(){
  // In-app browsers (Viber, WhatsApp, Messenger, etc. opening a shared
  // link) run their own embedded webview with its own toolbar chrome,
  // which behaves differently from Safari/Chrome and can leave the page
  // scrolled to a stale position on first load, or settle its own chrome
  // height a moment after the page first paints. Both get corrected here.
  window.scrollTo(0, 0);

  // Which role, if any, does the current hash itself name? Direct role
  // links only ever resume from that same role's own saved session --
  // never another role's, even if one happens to be saved on this device.
  // A hash that doesn't name a role at all (e.g. #dashboard/#settings,
  // which only occur mid-session -- reaching one on a fresh load means a
  // refresh happened while an internal tab was open) falls back to
  // whichever role was last active, since there's nothing else to go on.
  const rawHash = (location.hash || '').replace('#','');
  let hashRole = null;
  if(rawHash === OWNER_HASH || rawHash.startsWith(OWNER_HASH + '/')) hashRole = 'owner';
  else if(rawHash === INTERNAL_HASH || rawHash.startsWith(INTERNAL_HASH + '/')) hashRole = 'staff';
  else if(rawHash === MANAGER_HASH || rawHash.startsWith(MANAGER_HASH + '/')) hashRole = 'manager';
  const resumeRole = hashRole || loadLastActiveRole();
  const session = resumeRole ? loadSession(resumeRole) : null;
  applyHomeScreenBranding(rawHash);

  // Figure out which boat's data to load BEFORE fetching anything -- from

  let boatIdFromHash = null;
  if(rawHash.startsWith(OWNER_HASH + '/')) boatIdFromHash = rawHash.slice(OWNER_HASH.length + 1);
  else if(rawHash.startsWith(INTERNAL_HASH + '/')) boatIdFromHash = rawHash.slice(INTERNAL_HASH.length + 1);
  else if(rawHash.startsWith(MANAGER_HASH + '/')) boatIdFromHash = rawHash.slice(MANAGER_HASH.length + 1);
  else if(rawHash.startsWith('c/')) boatIdFromHash = rawHash.slice(2);

  hideStartupLoading();
  resumeGpsTrackingIfAny();

    state.lang = 'en';

    applyStaticTranslations();

    applyTheme();

  // org login/landing screen but a valid owner session already exists for
  // a specific boat, resume straight into that boat's app instead. Always
  // checks the OWNER session specifically here (never staff/manager) --
  // this is the org login screen, so only an owner session is relevant.
  const ownerSessionForOrgResume = (initialHash === 'org' || initialHash === '') ? loadSession('owner') : null;
  if(ownerSessionForOrgResume && ownerSessionForOrgResume.boatId){
    state.entryMode = 'internal';
    state.gateRole = 'owner';
    state.role = 'owner';
    state.staffName = null;
    state.tab = DEFAULT_TAB.owner;
    history.replaceState(null,'','#'+OWNER_HASH+'/'+ownerSessionForOrgResume.boatId);
    render();
    tickClock();
    setInterval(tickClock, 30000);
    startPolling();
    return;
  }

  if(initialHash === 'signup' || initialHash === 'org' || initialHash.startsWith('org/')){
    state.entryMode = 'org';
    state.orgScreen = initialHash === 'signup' ? 'signup' : 'login';
    renderOrgArea();
    tickClock();
    setInterval(tickClock, 30000);
    return;
  }

  const isResetLink = rawHash.startsWith('reset-pin/');
  const isCustomerLink = rawHash === 'c' || rawHash.startsWith('c/');
  // A stored session must only auto-log-in if it's for the SAME boat being
  // requested -- otherwise clicking someone else's #owner/<boatId> link
  // while already signed into a different boat would silently grant owner
  // access to that other boat without ever checking its PIN. An explicit
  // #c/<boatId> customer link must always win regardless of any saved
  // internal session too -- otherwise testing your own customer check-in
  // link while logged in as Owner on the same browser silently redirects
  // straight to the Owner Dashboard instead of the customer form.
  const sessionMatchesRequestedBoat = !boatIdFromHash || (session && session.boatId === boatIdFromHash);
  if(!isResetLink && !isCustomerLink && session && (session.role === 'owner' || session.role === 'staff' || session.role === 'manager') && sessionMatchesRequestedBoat){
    // Re-check the session still makes sense (e.g. a staff/manager PIN
    // could have been removed from another device while this one stayed
    // logged in).
    const stillValid = session.role === 'owner'
      ? true
      : session.role === 'manager'
        ? !session.staffName || (state.settings.managerUsers||[]).some(u => u.name === session.staffName)
        : !session.staffName || (state.settings.staffUsers||[]).some(u => u.name === session.staffName);
    if(stillValid){
      state.entryMode = 'internal';
      state.gateRole = session.gateRole || session.role;
      state.role = session.role;
      state.staffName = session.staffName;
      const h = rawHash;
      const tabs = getRoleTabs()[state.role].map(t => t.id);
      state.tab = tabs.includes(h) ? h : DEFAULT_TAB[state.role];
      if(('#'+state.tab) !== location.hash) history.replaceState(null,'','#'+state.tab);
      render();
    } else {
      clearSession(resumeRole);
      handleHash();
    }
  } else {
    if(!sessionMatchesRequestedBoat) clearSession(resumeRole);
    handleHash();
  }

  startPolling();
}
// iOS Safari's address bar/toolbar showing or hiding changes the actual

// don't always track correctly, which is what caused the app shell to
// leave a blank gap above the bottom tab bar. Computing it directly and
// keeping it updated is the reliable fix. window.innerHeight alone isn't
// enough, though -- on iOS Safari it often doesn't change at all when the
// on-screen keyboard opens or closes (only the *visual* viewport does),
// which is exactly the moment that left vertically-centered screens like
// the login/gate forms looking shifted after typing. visualViewport

// Most save actions (logging items, marking delivered, adding a customer,
// etc.) don't have their own try/catch around withFreshShipments/
// withFreshTrips -- on a total connection failure (after apiSet's own
// retries are exhausted) they'd fail completely silently: no error, no
// indication anything went wrong, the tap just seems to do nothing. This

// spots that already catch their own errors (like the off-island delivery

// Every <select> in the app opens this themed bottom-sheet list instead of
// the browser's own native picker popup (which can't be restyled to match
// the app -- that's an OS-drawn overlay, not something CSS reaches). This
// is wired once globally via event delegation on document, rather than
// per-element, since selects get torn down and recreated by innerHTML on
// every re-render -- delegation means new ones are covered automatically
// with no re-wiring needed anywhere else in the app.
// Shared by every dropdown in the app (both the plain <select> menus below
// and the island search popup further down): scrolls whichever field was
// tapped up to the top of the scrollable area first -- so there's room
// for the list (and, for text fields, the keyboard) underneath it -- then
// pins the dropdown directly below that field at the same width, sized to
// fit in whatever space is actually left above the keyboard/screen edge.
function scrollFieldToTop(field){
  const scrollable = document.getElementById('panel') || document.getElementById('gate-area');
  if(!scrollable) return;
  const fieldRect = field.getBoundingClientRect();
  const scrollableRect = scrollable.getBoundingClientRect();
  const offset = fieldRect.top - scrollableRect.top - 14;
  if(Math.abs(offset) > 2) scrollable.scrollTop += offset;
}
let _anchoredDropdownMenu = null;
let _anchoredDropdownField = null;
function positionAnchoredDropdown(menu, field){
  const r = field.getBoundingClientRect();

  menu.style.left = Math.max(8, r.left) + 'px';
  menu.style.width = r.width + 'px';
  menu.style.top = (r.bottom + 6) + 'px';
  menu.style.maxHeight = Math.max(120, vh - (r.bottom + 6) - 10) + 'px';

// Locking here (rather than in each individual open function) covers
// every dropdown that goes through this shared anchoring -- plain
// <select> menus and the island search popup alike -- in one place.
// unlockBodyScroll is only called when a dropdown was actually open
// (see the guard below), so the many defensive "close before opening a
// new one" calls elsewhere don't unbalance the shared lock count.
function setAnchoredDropdown(menu, field){

  _anchoredDropdownField = field;
  lockBodyScroll();
}
function clearAnchoredDropdown(){
  if(_anchoredDropdownMenu) unlockBodyScroll();
  _anchoredDropdownMenu = null;
  _anchoredDropdownField = null;
}

// how much room is actually available below the field -- re-run the same
// positioning whenever that happens so the dropdown never ends up
// stranded behind the keyboard or cut off. Repositioning on scroll of the
// card itself is handled separately, together with the date/time pickers,
// by repositionOpenPickers further down.
function repositionAnchoredDropdown(){

}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', repositionAnchoredDropdown);
}

  if(sel){ e.preventDefault(); openCustomSelectMenu(sel); return; }
  const dateInput = isEnhanceableDateInput(e.target);
  if(dateInput){ e.preventDefault(); openDatePicker(dateInput); return; }
  const timeInput = isEnhanceableTimeInput(e.target);
  if(timeInput){ e.preventDefault(); openTimePicker(timeInput); return; }
}, { passive: false, capture: true });
// mousedown covers non-touch input (desktop browser, trackpad, mouse) --
// touch devices won't also fire this once touchstart above has already
// preventDefault-ed the gesture, so the two don't double-open the menu.
document.addEventListener('mousedown', (e) => {
  const sel = isEnhanceableSelect(e.target);
  if(sel){ e.preventDefault(); openCustomSelectMenu(sel); return; }
  const dateInput = isEnhanceableDateInput(e.target);
  if(dateInput){ e.preventDefault(); openDatePicker(dateInput); return; }
  const timeInput = isEnhanceableTimeInput(e.target);
  if(timeInput){ e.preventDefault(); openTimePicker(timeInput); return; }
}, true);

// Themed popup for the two "type to search & add an island" fields (New
// Trip's origin and destinations). Same anchored, field-width look as the
// <select> dropdowns above. With nothing typed it browses the full island
// list grouped by atoll (tap an atoll to expand its islands); typing
// anything switches to a flat, filtered list of matching islands across
// all atolls.
function flatIslandList(){
  return Object.keys(MALDIVES_ATOLLS).flatMap(atoll => MALDIVES_ATOLLS[atoll].map(island => ({ island, atoll })));
}
let _islandSearchExpandedAtoll = null;
function openIslandSearchPopup(input, onPick, opts){
  closeIslandSearchPopup();
  const closeOnPick = !opts || opts.closeOnPick !== false;
  scrollFieldToTop(input);
  const overlay = document.createElement('div');
  overlay.className = 'custom-select-overlay';
  overlay.id = 'island-search-popup-overlay';
  const menu = document.createElement('div');
  menu.className = 'custom-select-menu';
  overlay.appendChild(menu);
  document.body.appendChild(overlay);
  positionAnchoredDropdown(menu, input);
  setAnchoredDropdown(menu, input);
  overlay.addEventListener('mousedown', (e) => {
    if(e.target !== overlay) return;
    e.preventDefault();
    input.blur();
    closeIslandSearchPopup();
  });

  const redraw = () => {
    const q = input.value.trim().toLowerCase();
    if(q){
      const matches = flatIslandList().filter(x => x.island.toLowerCase().includes(q));
      menu.innerHTML = matches.length ? matches.slice(0, 60).map(x => `
        <button type="button" class="custom-select-option" data-pick-island="${escapeHtml(x.island)}">
          <span>${escapeHtml(x.island)}</span><span style="color:rgba(244,249,255,0.55);font-size:calc(12.5px * var(--en-scale));">${escapeHtml(x.atoll)}</span>
        </button>
      `).join('') : `<div class="custom-select-title" style="padding:16px 22px 20px;">No matching island \u2014 whatever you've typed will be used as-is.</div>`;
    } else {
      menu.innerHTML = Object.keys(MALDIVES_ATOLLS).map(atoll => {
        const open = _islandSearchExpandedAtoll === atoll;
        return `
          <button type="button" class="custom-select-option" data-toggle-atoll="${escapeHtml(atoll)}">
            <span>${escapeHtml(atoll)}</span>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.15s ease;transform:rotate(${open ? '180deg' : '0deg'});"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          ${open ? MALDIVES_ATOLLS[atoll].map(island => `
            <button type="button" class="custom-select-option" data-pick-island="${escapeHtml(island)}" style="padding-left:40px;background:rgba(255,255,255,0.06);color:rgba(244,249,255,0.88);">
              <span>${escapeHtml(island)}</span>
            </button>
          `).join('') : ''}
        `;
      }).join('');
    }
    menu.querySelectorAll('[data-pick-island]').forEach(b => b.addEventListener('mousedown', (e) => {
      e.preventDefault(); // keep focus/blur ordering predictable on tap
      onPick(b.dataset.pickIsland);
      if(closeOnPick){ input.blur(); closeIslandSearchPopup(); }
      else { redraw(); }
    }));
    menu.querySelectorAll('[data-toggle-atoll]').forEach(b => b.addEventListener('mousedown', (e) => {
      e.preventDefault();
      const atoll = b.dataset.toggleAtoll;
      _islandSearchExpandedAtoll = _islandSearchExpandedAtoll === atoll ? null : atoll;
      redraw();
    }));
  };
  redraw();
  input._islandSearchRedraw = redraw;

  // Scrolling to browse the list means the keyboard's just in the way now
  // -- dismiss it so the list gets the room, matching how scrolling
  // elsewhere in the app already closes the keyboard. This blur is only
  // to drop the keyboard, though -- the list itself should stay put right
  // where it is, not close along with it, so a flag on the input tells
  // the blur handler in wireIslandSearchDropdown to skip its usual
  // close-the-popup behavior just this once. Once the keyboard actually
  // closes, the visualViewport resize listener above re-runs the anchored
  // positioning, which grows the list into the room the keyboard freed up.
  const dismissKeyboardOnly = () => { input._islandSearchScrollBlur = true; input.blur(); };
  let touchStartY = null;
  menu.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, { passive: true });
  menu.addEventListener('touchmove', (e) => {
    if(touchStartY === null) return;
    if(Math.abs(e.touches[0].clientY - touchStartY) > 8){ dismissKeyboardOnly(); touchStartY = null; }
  }, { passive: true });
  menu.addEventListener('wheel', dismissKeyboardOnly, { passive: true });
}
function closeIslandSearchPopup(){
  document.getElementById('island-search-popup-overlay')?.remove();
  _islandSearchExpandedAtoll = null;
  clearAnchoredDropdown();
}

// Every themed dropdown/popup above (select menus, island search, the
// date picker, the time picker) is `position:fixed` and anchored to its
// field's on-screen coordinates only at the moment it opens. That's fine
// for keyboard/viewport changes (already handled via each one's resize
// listener), but scrolling the page itself -- e.g. the Home screen's
// trip-summary panel, which is taller than the screen -- moves the field
// out from under a popup that stays put, since nothing re-runs the
// positioning on scroll. Re-running all of them together on every scroll
// of the app's actual scroll container(s) keeps whichever popup is open
// pinned directly under its field the whole time, same as it looks the
// moment it opens.
function repositionOpenPickers(){
  repositionAnchoredDropdown();
  if(_datePickerResizeHandler) _datePickerResizeHandler();
  if(_timePickerResizeHandler) _timePickerResizeHandler();
}
document.getElementById('panel')?.addEventListener('scroll', repositionOpenPickers, { passive: true });
document.getElementById('gate-area')?.addEventListener('scroll', repositionOpenPickers, { passive: true });
window.addEventListener('scroll', repositionOpenPickers, { passive: true });

// iOS Safari's elastic bounce/rubber-band effect can still visually pan
// the whole viewport on a touch-drag even with overflow:hidden set on
// html/body/.shell (see the mobile media query above) -- that bounce is
// a viewport-level effect the OS applies, not something purely governed
// by CSS overflow, so it needed its own guard. This lets a drag that
// starts inside any genuinely scrollable element (.panel, #gate-area, or
// any open popup/dropdown menu with its own overflow-y:auto and content
// taller than its box) scroll normally, and blocks everything else --
// a drag starting on the header, the bottom nav, or plain background --
// which is what used to read as "the background is still scrollable".
// This also has to recognize HORIZONTALLY-scrollable rows (overflow-x,
// e.g. .filter-scroll-row's "Awaiting load / Loaded / In Transit / ..."
// chips on the dashboard) -- it originally only ever checked overflow-y,
// so a sideways drag on that row matched nothing in the loop below and
// fell through to the final preventDefault(), silently swallowing the
// gesture. That happened on every role's dashboard (owner, manager,
// staff alike, since they all share this one listener and the same
// dashboard markup) -- it just tended to get noticed on the staff end
// first, since Dashboard/that chip row is staff's main (often only)
// screen. Checking both axes here fixes it everywhere at once.
document.addEventListener('touchmove', (e) => {
  let el = e.target;
  while(el && el !== document.body){
    const style = window.getComputedStyle(el);
    const scrollsY = (style.overflowY === 'auto' || style.overflowY === 'scroll') && el.scrollHeight > el.clientHeight;
    const scrollsX = (style.overflowX === 'auto' || style.overflowX === 'scroll') && el.scrollWidth > el.clientWidth;
    if(scrollsY || scrollsX){
      return;
    }
    el = el.parentElement;
  }
  e.preventDefault();
}, { passive: false });

applyLangDirection();
applyStaticTranslations();

init();
</script>
</body>
