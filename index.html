// View & Copy Announcement popup -- shows the auto-generated announcement
// in an editable textarea (themed like the other popups) so it can be
// tweaked before copying, e.g. a last-minute note or a corrected number.
// Edits are optional: they're saved onto the trip as `announcementText`
// and reused next time this popup opens, but the popup always offers a
// "Reset to Auto-Generated" escape hatch back to buildAnnouncement(t).
function openAnnouncementPopup(tripId){
  const t = (state.trips||[]).find(x => x.id === tripId);
  if(!t) return;
  closeAnnouncementPopup();
  lockBodyScroll();
  const currentText = (typeof t.announcementText === 'string' && t.announcementText.length) ? t.announcementText : buildAnnouncement(t);
  const overlay = document.createElement('div');
  overlay.id = 'announcement-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="announcement-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
        <h3 style="margin-bottom:2px;">Announcement</h3>
        <button type="button" class="btn btn-ghost" id="announcement-popup-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <p class="sub" style="margin-bottom:10px;">Edit if needed, then copy. Changes are saved to this trip.</p>
      <textarea id="announcement-popup-textarea" rows="12" style="font-family:'JetBrains Mono',monospace;font-size:calc(12.5px * var(--en-scale));">${escapeHtml(currentText)}</textarea>
      <div class="tag-actions" style="margin-top:12px;">
        <button class="btn btn-primary" id="announcement-copy-btn">Copy</button>
        <button class="btn btn-amber" id="announcement-save-btn">Save</button>
        <button class="btn btn-ghost" id="announcement-reset-btn">Reset to Auto-Generated</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeAnnouncementPopup(); });
  document.body.appendChild(overlay);
  document.getElementById('announcement-popup-close-btn').addEventListener('click', closeAnnouncementPopup);

  const textarea = document.getElementById('announcement-popup-textarea');

  const persist = (text) => {
    const localTrip = (state.trips || []).find(x => x.id === tripId);
    if(localTrip) localTrip.announcementText = text;
    return withFreshTrips(l => {
      const ft = l.find(x => x.id === tripId);
      if(ft) ft.announcementText = text;
    });
  };

  document.getElementById('announcement-copy-btn').addEventListener('click', () => {
    const text = textarea.value;
    const copyBtn = document.getElementById('announcement-copy-btn');
    const finish = () => {
      const original = copyBtn.textContent;
      copyBtn.textContent = t('Copied!');
      setTimeout(() => { if(document.getElementById('announcement-copy-btn')) copyBtn.textContent = original; }, 1200);
    };
    // Fallback for webviews/browsers where the async Clipboard API is
    // blocked or unavailable (common in in-app browsers): select the
    // textarea contents and use the older execCommand('copy'), which
    // works off the same user gesture without needing clipboard-write
    // permission.
    const legacyCopy = () => {
      try{
        textarea.focus();
        textarea.select();
        textarea.setSelectionRange(0, textarea.value.length);
        const ok = document.execCommand('copy');
        if(ok){ finish(); return true; }
      }catch(e){}
      return false;
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(finish).catch(() => {
        if(!legacyCopy()) alert(t('Could not copy \u2014 select the text and copy manually.'));
      });
    } else {
      if(!legacyCopy()){
        textarea.focus();
        textarea.select();
        alert(t('Select the text in the box and copy manually.'));
      }
    }
  });

  document.getElementById('announcement-save-btn').addEventListener('click', async () => {
    const saveBtn = document.getElementById('announcement-save-btn');
    saveBtn.textContent = t('Saving\u2026');
    await persist(textarea.value);
    if(document.getElementById('announcement-save-btn')){ saveBtn.textContent = 'Saved!'; setTimeout(() => { if(document.getElementById('announcement-save-btn')) saveBtn.textContent = 'Save'; }, 1200); }
    renderDashboard();
  });

  document.getElementById('announcement-reset-btn').addEventListener('click', async () => {
    const fresh = buildAnnouncement(t);
    textarea.value = fresh;
    await persist('');
    renderDashboard();
  });
}

function wireDeliverOtherPopup(s, routeIslands){
  document.getElementById('deliver-other-popup-close-btn').addEventListener('click', closeDeliverOtherPopup);
  const sel = document.getElementById('deliver-other-island-select');
  if(sel){
    sel.addEventListener('change', () => {
      const manual = document.getElementById('deliver-other-island-manual');
      if(manual) manual.style.display = sel.value === '__other' ? '' : 'none';
    });
  }
  const checkDeliverOtherMobile = wireMobileValidation('deliver-other-rmobile');
  document.getElementById('deliver-other-confirm-btn').addEventListener('click', async () => {
    const selEl = document.getElementById('deliver-other-island-select');
    const manualEl = document.getElementById('deliver-other-island-manual');
    const island = (selEl && selEl.value && selEl.value !== '__other') ? selEl.value : (manualEl ? manualEl.value.trim() : '');
    const note = document.getElementById('deliver-other-note').value.trim();
    const receiverName = document.getElementById('deliver-other-rname').value.trim();
    const receiverMobile = document.getElementById('deliver-other-rmobile').value.trim();
    if(!island || !note || !receiverName || !receiverMobile){
      alert(t('Island, reason, receiver name, and receiver mobile are all required for an off-island delivery.'));
      return;
    }
    if(!checkDeliverOtherMobile()) return;
    const btn = document.getElementById('deliver-other-confirm-btn');
    btn.disabled = true; btn.textContent = t('Saving\u2026');
    try{
      await markDeliveredOffIsland(s.id, { island, note, receiverName, receiverMobile });
    }catch(e){
      console.error('markDeliveredOffIsland failed', e);
      alert(t('Could not save this delivery. Check your connection and try again.'));
      btn.disabled = false; btn.textContent = t('Confirm Delivery');
      return;
    }
    closeDeliverOtherPopup();
  });
}

function openLoadForm(id){
  if(!state.loadingDraft[id]){
    state.loadingDraft[id] = { items: [], customName:'', customPrice:'', itemSearch:'', open: true, itemDropdownOpen: true };
  } else {
    state.loadingDraft[id].open = true;
  }
  renderDashboard();
}

// Ranks catalog items by how often they've actually been loaded across all
// shipments (by total quantity), not alphabetically -- the item picker
// should surface what's commonly shipped first, since that's what saves
// the most taps day to day. Items never used yet fall back to
// alphabetical order among themselves, after everything that has history.
function sortedRatesByUsage(){
  const counts = {};
  (state.shipments || []).forEach(s => {
    (s.items || []).forEach(i => {
      counts[i.id] = (counts[i.id] || 0) + (i.qty || 1);
    });
  });
  return state.rates.slice().sort((a, b) => {
    const ca = counts[a.id] || 0;
    const cb = counts[b.id] || 0;
    if(cb !== ca) return cb - ca;
    return a.name.localeCompare(b.name);
  });
}

function renderLoadForm(s){
  const draft = state.loadingDraft[s.id];
  const total = draft.items.reduce((sum,i) => sum + i.qty*i.price, 0);
  const sortedRates = sortedRatesByUsage();
  const rawQuery = (draft.itemSearch || '').trim();
  const query = rawQuery.toLowerCase();
  const matches = query ? sortedRates.filter(r => r.name.toLowerCase().includes(query)) : sortedRates;
  const isPicking = !!draft.itemDropdownOpen;

  const newItemRow = `
    <div style="display:flex;gap:8px;align-items:flex-end;margin:14px 0 12px;">
      <div style="flex:1;">
        <label>${t("New Item")}</label>
        <input type="text" placeholder="${t("e.g. Motorcycle")}" data-custom-name="${s.id}" value="${escapeHtml(draft.customName)}" style="margin-bottom:0;">
      </div>
      <div style="width:100px;">
        <label>${t("Rate")}</label>
        <input type="text" placeholder="0" data-custom-price="${s.id}" value="${escapeHtml(draft.customPrice)}" style="margin-bottom:0;">
      </div>
      <button class="btn btn-ghost" data-add-custom="${s.id}" style="height:44px;">${t("Add")}</button>
    </div>
  `;

  // No match for what's been typed -- a tappable row offering to add it
  // as a brand new item (using exactly what was typed as the name) beats
  // a dead-end "No matching items." message, since the person's already
  // told us the name; they shouldn't have to retype it into the New Item
  // field below. See openAddNewItemPopup for what happens on tap.
  const noMatchHtml = query
    ? `<button type="button" class="item-result-row" data-add-new-item="${s.id}" style="color:var(--teal);font-weight:600;">
        <span>${t('Add "{name}" as a new item').replace('{name}', escapeHtml(rawQuery))}</span>
        <span>+</span>
      </button>`
    : `<div class="empty" style="padding:10px 0;font-size:calc(13px * var(--en-scale));">${t("No matching items.")}</div>`;

  const resultsListHtml = matches.length ? matches.map(r => `
    <button type="button" class="item-result-row" data-pick-item="${s.id}" data-rate-id="${r.id}">
      <span>${escapeHtml(r.name)}</span><span class="rprice">${fmtMoney(r.price)}</span>
    </button>
  `).join('') : noMatchHtml;

  // Three fixed flex sections rather than nested position:sticky blocks --
  // header+search never moves, the middle (dropdown results while
  // picking, or the added-items list while reviewing) is the only part
  // that scrolls, and the footer (New Item row, plus Total/Confirm/Cancel
  // while reviewing) is a genuine flex-shrink:0 footer that always stays
  // at the bottom of the screen. The previous sticky-based layout relied
  // on the outer panel actually scrolling for "sticky bottom" to do
  // anything, so on a tall dropdown-results list or a long items list it
  // could end up pushed out of view instead of staying put.
  return `
    <div style="flex-shrink:0;padding-bottom:4px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div>
          <h3 style="margin-bottom:2px;">${t("Log Items Loaded")}</h3>
          <div class="tag-meta">${escapeHtml(s.name)} \u2192 ${escapeHtml(s.receiverName||'')} \u00b7 ${s.id}</div>
        </div>
        <button type="button" class="btn btn-ghost" data-cancel-load="${s.id}" style="padding:8px 14px;">\u2715 Close</button>
      </div>
      <div style="margin-bottom:0;">
        <label>${t("Search & tap an item to add it")}</label>
        <input type="text" data-item-search="${s.id}" placeholder="${t("Item List (tap to search)")}" autocomplete="off" value="${escapeHtml(draft.itemSearch||'')}" style="margin-bottom:0;">
      </div>
    </div>

    <div data-items-scroll="${s.id}" style="flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:10px 0;">
      ${isPicking ? `
        <div data-item-results="${s.id}" style="display:flex;flex-direction:column;gap:6px;">
          ${resultsListHtml}
        </div>
      ` : (draft.items.length ? draft.items.map((i,idx) => `
        <div class="rate-row" style="padding:8px 10px;">
          <div style="min-width:0;">
            <div class="name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(i.name)}</div>
            <div class="price">${fmtMoney(i.price)}/unit</div>
          </div>
          <div class="stepper">
            <button data-dec="${idx}" data-sid="${s.id}">\u2212</button>
            <span class="qty">${i.qty}</span>
            <button data-inc="${idx}" data-sid="${s.id}">+</button>
            <button data-remove="${idx}" data-sid="${s.id}" title="${t("Remove")}" style="border-color:#F5C6C6;color:#C43B3B;">\u00d7</button>
          </div>
        </div>
      `).join('') : `<div class="empty" style="padding:16px 0;">${t("No items added yet.")}</div>`)}
    </div>

    <div style="flex-shrink:0;">
      ${newItemRow}
      ${isPicking ? '' : `
        <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(total)}</span></div>
        <div class="tag-actions" style="margin-top:14px;">
          <button class="btn btn-primary" data-confirm-load="${s.id}">${t("Confirm Loaded & Take Photo")}</button>
          <button class="btn btn-ghost" data-cancel-load="${s.id}">${t("Cancel")}</button>
        </div>
      `}
    </div>
  `;
}

function pickItem(sid, rateId){
  const d = state.loadingDraft[sid];
  const rate = state.rates.find(r => r.id === rateId);
  if(!d || !rate) return;
  const existing = d.items.find(i => i.id === rate.id);
  if(existing){ existing.qty += 1; }
  else { d.items.unshift({ id: rate.id, name: rate.name, price: rate.price, qty: 1 }); }
  d.itemSearch = '';
  d.itemDropdownOpen = false;
  renderDashboard();
}

// Opens over the Log Items Loaded modal when "Add ... as a new item" is
// tapped after a search with no matches -- collects just the rate/price
// (the name is already known, from what was typed) then creates the
// catalog entry, adds it to this shipment's items, and closes back out
// to the loading form. lockBodyScroll/unlockBodyScroll nest safely on
// top of the loading modal's own lock (see _scrollLockCount), so this
// doesn't need any special-casing for being a popup-over-a-popup.
function openAddNewItemPopup(sid){
  const d = state.loadingDraft[sid];
  if(!d) return;
  const name = (d.itemSearch || '').trim();
  if(!name) return;
  closeAddNewItemPopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'add-new-item-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2200;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="add-new-item-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:420px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
        <h3 style="margin-bottom:2px;">${t("Set Rate for New Item")}</h3>
        <button type="button" class="btn btn-ghost" id="add-new-item-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <p class="sub" style="margin-bottom:14px;">${escapeHtml(name)}</p>
      <label>${t("Rate")}</label>
      <input type="text" inputmode="decimal" id="add-new-item-price" placeholder="0" style="margin-bottom:6px;">
      <div class="pin-error" id="add-new-item-error"></div>
      <div class="tag-actions" style="margin-top:8px;">
        <button class="btn btn-primary" id="add-new-item-confirm-btn">${t("Add Item")}</button>
        <button class="btn btn-ghost" id="add-new-item-cancel-btn">${t("Cancel")}</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeAddNewItemPopup(); });
  document.body.appendChild(overlay);
  document.getElementById('add-new-item-close-btn').addEventListener('click', closeAddNewItemPopup);
  document.getElementById('add-new-item-cancel-btn').addEventListener('click', closeAddNewItemPopup);
  const priceInput = document.getElementById('add-new-item-price');
  priceInput.focus();
  const confirm = async () => {
    const errorEl = document.getElementById('add-new-item-error');
    const price = parseFloat(priceInput.value);
    if(isNaN(price) || price < 0){
      errorEl.textContent = t('Enter a valid rate.');
      return;
    }
    errorEl.textContent = '';
    const btn = document.getElementById('add-new-item-confirm-btn');
    btn.disabled = true;
    // Reuse an existing rate with this exact name if one somehow already
    // exists (e.g. added from another device moments ago), same
    // case-insensitive check the New Item row below already does --
    // otherwise this is a genuinely new catalog entry, tagged the same
    // way a bulk upload tags its items so it shows up under "New Items"
    // in Settings > Item Rates for the owner to notice.
    let rate = state.rates.find(r => r.name.trim().toLowerCase() === name.toLowerCase());
    if(!rate){
      rate = { id: 'rate-'+Date.now()+'-'+Math.random().toString(36).slice(2,8), name, price, uploadedAt: Date.now() };
      state.rates.unshift(rate);
      await saveRates(state.rates);
    }
    const existing = d.items.find(i => i.id === rate.id);
    if(existing){ existing.qty += 1; }
    else { d.items.unshift({ id: rate.id, name: rate.name, price: rate.price, qty: 1 }); }
    d.itemSearch = '';
    d.itemDropdownOpen = false;
    closeAddNewItemPopup();
    renderDashboard();
  };
  document.getElementById('add-new-item-confirm-btn').addEventListener('click', confirm);
  priceInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') confirm(); });
}
function closeAddNewItemPopup(){
  if(document.getElementById('add-new-item-popup-overlay')) unlockBodyScroll();
  document.getElementById('add-new-item-popup-overlay')?.remove();
}

function renderItemResultsBox(sid){
  const d = state.loadingDraft[sid];
  if(!d) return;
  const box = document.querySelector(`[data-item-results="${sid}"]`);
  if(!box) return;
  const rawQuery = (d.itemSearch || '').trim();
  const query = rawQuery.toLowerCase();
  const sortedRates = sortedRatesByUsage();
  const matches = query ? sortedRates.filter(r => r.name.toLowerCase().includes(query)) : sortedRates;
  const noMatchHtml = query
    ? `<button type="button" class="item-result-row" data-add-new-item="${sid}" style="color:var(--teal);font-weight:600;">
        <span>${t('Add "{name}" as a new item').replace('{name}', escapeHtml(rawQuery))}</span>
        <span>+</span>
      </button>`
    : `<div class="empty" style="padding:10px 0;font-size:calc(13px * var(--en-scale));">${t("No matching items.")}</div>`;
  box.style.display = 'flex';
  box.innerHTML = matches.length ? matches.map(r => `
    <button type="button" class="item-result-row" data-pick-item="${sid}" data-rate-id="${r.id}">
      <span>${escapeHtml(r.name)}</span><span class="rprice">${fmtMoney(r.price)}</span>
    </button>
  `).join('') : noMatchHtml;
  box.querySelectorAll('[data-pick-item]').forEach(b => b.addEventListener('click', () => pickItem(b.dataset.pickItem, b.dataset.rateId)));
  const addNewBtn = box.querySelector('[data-add-new-item]');
  if(addNewBtn) addNewBtn.addEventListener('click', () => openAddNewItemPopup(addNewBtn.dataset.addNewItem));
}

// Tracks in-flight "Confirm Loaded" saves by shipment id, so the
// photo-attach handler can wait for the matching save to finish before
// starting its own -- see the race-condition note in wireLoadFormEvents.
const pendingLoadConfirms = {};

function wireLoadFormEvents(){
  document.querySelectorAll('[data-item-search]').forEach(inp => {
    // Tapping into the field opens the full item list immediately (no
    // separate dropdown toggle needed); typing then filters it live.
    inp.addEventListener('focus', () => {
      const sid = inp.dataset.itemSearch;
      const d = state.loadingDraft[sid];
      if(!d) return;
      d.itemDropdownOpen = true;
      renderItemResultsBox(sid);
    });
    inp.addEventListener('input', () => {
      const sid = inp.dataset.itemSearch;
      const d = state.loadingDraft[sid];
      if(!d) return;
      d.itemSearch = inp.value;
      d.itemDropdownOpen = true;
      renderItemResultsBox(sid);
    });
    // A short delay so a tap on a dropdown row (or the custom-add button)
    // still registers its own click first -- otherwise this would close
    // the list out from under the tap before it counts as a pick. Scroll-
    // triggered blurs (see below) are flagged and skip this entirely --
    // scrolling through the list should never collapse it, only close the
    // keyboard.
    inp.addEventListener('blur', () => {
      if(inp.dataset.scrollDismiss === '1'){ inp.dataset.scrollDismiss = ''; return; }
      const sid = inp.dataset.itemSearch;
      setTimeout(() => {
        const d = state.loadingDraft[sid];
        if(d && d.itemDropdownOpen){ d.itemDropdownOpen = false; renderDashboard(); }
      }, 200);
    });
  });
  // Scrolling either list while the keyboard is up is awkward on a phone
  // (the keyboard eats most of the screen) -- dismissing it gives the full
  // screen back to browse with. This should ONLY close the keyboard, never
  // the list itself. The tricky part: iOS blurs the focused input the
  // moment you touch down on the list to start scrolling -- that blur
  // fires before any 'scroll' event does, so flagging on scroll alone was
  // too late and let the close-on-blur logic above fire anyway. Flagging
  // on touchstart/mousedown instead catches it before that native blur
  // happens.
  document.querySelectorAll('[data-item-results], [data-items-scroll]').forEach(box => {
    const flagActiveSearchInput = () => {
      const active = document.activeElement;
      if(active && active.tagName === 'INPUT' && active.dataset.itemSearch !== undefined){
        active.dataset.scrollDismiss = '1';
      }
    };
    box.addEventListener('touchstart', flagActiveSearchInput, { passive: true });
    box.addEventListener('mousedown', flagActiveSearchInput);
    box.addEventListener('scroll', () => {
      const active = document.activeElement;
      if(active && active.tagName === 'INPUT' && active.dataset.itemSearch !== undefined){
        active.dataset.scrollDismiss = '1';
        active.blur();
      }
    });
  });
  document.querySelectorAll('[data-pick-item]').forEach(b => b.addEventListener('click', () => pickItem(b.dataset.pickItem, b.dataset.rateId)));
  document.querySelectorAll('[data-add-new-item]').forEach(b => b.addEventListener('click', () => openAddNewItemPopup(b.dataset.addNewItem)));
  document.querySelectorAll('[data-inc]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items[b.dataset.inc].qty++; renderDashboard();
  }));
  document.querySelectorAll('[data-dec]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid];
    const idx = b.dataset.dec;
    d.items[idx].qty = Math.max(0, d.items[idx].qty - 1);
    if(d.items[idx].qty === 0) d.items.splice(idx,1);
    renderDashboard();
  }));
  document.querySelectorAll('[data-remove]').forEach(b => b.addEventListener('click', () => {
    const d = state.loadingDraft[b.dataset.sid]; d.items.splice(b.dataset.remove,1); renderDashboard();
  }));
  document.querySelectorAll('[data-custom-name]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customName].customName = inp.value; }));
  document.querySelectorAll('[data-custom-price]').forEach(inp => inp.addEventListener('input', () => { state.loadingDraft[inp.dataset.customPrice].customPrice = inp.value; }));
  // Browsers don't reliably scroll a focused field into view above the
  // keyboard when it's inside a custom scroll container (like this
  // modal) -- doing it explicitly keeps the New Item row visible instead
  // of the keyboard covering it.
  document.querySelectorAll('[data-custom-name], [data-custom-price]').forEach(inp => {
    inp.addEventListener('focus', () => {
      setTimeout(() => inp.scrollIntoView({ block: 'center', behavior: 'smooth' }), 250);
    });
  });
  document.querySelectorAll('[data-add-custom]').forEach(b => b.addEventListener('click', async () => {
    const d = state.loadingDraft[b.dataset.addCustom];
    const name = (d.customName||'').trim();
    const price = parseFloat(d.customPrice) || 0;
    if(!name) return;
    d.itemDropdownOpen = false; // synchronous, before any await -- avoids a race with the click-outside-closes-dropdown listener

    // Reuse an existing rate if one with this name already exists (case-insensitive),
    // otherwise persist it as a new rate so it shows up in the dropdown for every
    // future shipment entry, not just this one -- tagged uploadedAt like the
    // search quick-add flow does, so it shows under "New Items" in Settings >
    // Item Rates for the owner to notice, same as any other newly added item.
    let rate = state.rates.find(r => r.name.trim().toLowerCase() === name.toLowerCase());
    if(!rate){
      rate = { id: 'custom-'+Date.now(), name, price, uploadedAt: Date.now() };
      state.rates.push(rate);
      await saveRates(state.rates);
    }

    const existing = d.items.find(i => i.id === rate.id);
    if(existing){ existing.qty++; }
    else { d.items.unshift({ id: rate.id, name: rate.name, price: rate.price, qty: 1 }); }

    d.customName=''; d.customPrice='';
    renderDashboard();
  }));
  document.querySelectorAll('[data-cancel-load]').forEach(b => b.addEventListener('click', () => { delete state.loadingDraft[b.dataset.cancelLoad]; renderDashboard(); }));

  document.querySelectorAll('[data-confirm-load]').forEach(b => b.addEventListener('click', () => {
    const id = b.dataset.confirmLoad;
    const draft = state.loadingDraft[id];
    const items = draft.items.filter(i => i.qty > 0);
    if(items.length === 0){ alert(t('Add at least one item before confirming.')); return; }
    // Camera first, synchronously, inside this click -- browsers require a
    // file-input click to happen within a trusted user gesture, so any
    // await (like a network save) before this point makes them silently
    // ignore it. The save then runs right behind it without blocking.
    //
    // The save's promise is stashed so the photo-attach handler below can
    // await it before starting its own save -- without this, if the photo
    // comes back quickly, its save could fetch the shipment before this
    // one finishes writing the items, then save that stale pre-items copy
    // right back over it, silently wiping out the items that were just
    // added. Waiting here guarantees the photo save always starts from
    // the up-to-date, items-included copy.
    const photoInput = document.querySelector(`[data-load-photo="${id}"]`);
    if(photoInput) photoInput.click();
    pendingLoadConfirms[id] = completeLoadConfirm(id);
  }));

  document.querySelectorAll('[data-load-photo]').forEach(inp => inp.addEventListener('change', async () => {
    const id = inp.dataset.loadPhoto;
    const file = inp.files && inp.files[0];
    if(!file) return;
    let photo = null;
    try{ photo = await compressImageToDataUrl(file, 700, 0.45); }
    catch(e){ console.error('Photo compression failed', e); }
    if(pendingLoadConfirms[id]){ await pendingLoadConfirms[id]; delete pendingLoadConfirms[id]; }
    if(photo) await attachPhoto(id, photo);
  }));
}

// Closes the floating item-search dropdown on any tap outside it or the
// search field itself -- attached once globally (not re-attached on every
// re-render, since wireLoadFormEvents runs each time the modal updates)
// so it can't stack up duplicate listeners over a session.
document.addEventListener('click', (e) => {
  // If the click target was already removed from the DOM by another
  // handler on this same click (e.g. tapping "Log Items Loaded" itself,
  // which re-renders the whole modal mid-bubble), there's no reliable way
  // to tell "inside" from "outside" -- and it's exactly the click that
  // just opened the dropdown in the first place, so leave it alone.
  if(!e.target.isConnected) return;
  document.querySelectorAll('[data-item-search]').forEach(inp => {
    const sid = inp.dataset.itemSearch;
    const d = state.loadingDraft[sid];
    if(!d || !d.itemDropdownOpen) return;
    const resultsBox = document.querySelector(`[data-item-results="${sid}"]`);
    if(inp.contains(e.target) || (resultsBox && resultsBox.contains(e.target))) return;
    d.itemDropdownOpen = false;
    renderDashboard();
  });
});

// Scrolling the page while the on-screen keyboard is open closes it --
// matches how most native/mobile apps behave, and avoids the keyboard
// staying up (covering half the screen) while browsing elsewhere on the
// page. Deliberately touch-drag-based rather than a generic 'scroll'
// listener -- the browser fires scroll events for all sorts of reasons
// that aren't the person scrolling (e.g. auto-scrolling to keep the
// cursor visible while typing), and a plain scroll listener was closing
// the keyboard on every single keystroke because of that. Only a real
// finger-drag of a meaningful distance on the content area counts.
let _scrollDismissTouchY = null;
let _scrollDismissTarget = null;
document.addEventListener('touchstart', (e) => {
  const target = e.target.closest && e.target.closest('#panel, #gate-area');
  if(target){ _scrollDismissTouchY = e.touches[0].clientY; _scrollDismissTarget = target; }
}, { passive: true });
document.addEventListener('touchmove', (e) => {
  if(_scrollDismissTouchY === null) return;
  const dy = Math.abs(e.touches[0].clientY - _scrollDismissTouchY);
  if(dy > 15){
    const active = document.activeElement;
    if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) active.blur();
    _scrollDismissTouchY = null; // only trigger once per gesture, not on every move
  }
}, { passive: true });
document.addEventListener('touchend', () => { _scrollDismissTouchY = null; _scrollDismissTarget = null; });

// Collapses the header down to just a small logo, and the bottom nav
// away entirely, while scrolling down through a long list -- giving the
// content more room -- then restores both on scrolling back up or
// reaching near the top. Uses a real 'scroll' listener (rather than the
// touch-drag approach above) since this needs the actual scroll
// position/direction, not just "did a drag happen" -- but guards against
// the same spurious-scroll-while-typing issue noted above by skipping
// the toggle while a text field is focused, so it can't fight with
// someone mid-form-entry.
// Header collapse distance -- how many px of scroll it takes to go from
// fully expanded (--tp: 0) to fully collapsed (--tp: 1). Tied directly to
// scrollTop every scroll event fires, on Home only; every other tab keeps
// --tp pinned at 0 so its header never moves.
// --tp is now hard-pinned at 0 everywhere, including Home: the header no
// longer shrinks/fades on scroll at all, so this listener just keeps the
// "badge-tucked" un-toggled instead of running the collapse math it used
// to. Left in place (rather than removed outright) since badge-tucked and
// --tp are still read elsewhere (see the CSS above) -- this just never
// drives them past their resting state now.
const HOME_HEADER_COLLAPSE_DISTANCE = 90;
document.addEventListener('scroll', (e) => {
  const target = e.target;
  if(!target || (target.id !== 'panel' && target.id !== 'gate-area')) return;
  const shell = document.querySelector('.shell');
  if(!shell) return;
  shell.style.setProperty('--tp', '0');
  shell.classList.remove('badge-tucked');
}, true);

// Resizes and re-compresses a captured photo before it ever touches the
// database -- raw camera photos are several MB each, and this data is stored
// inside one shared JSON blob for every shipment, so uncompressed photos
// would make the whole app slow to load for everyone, not just this record.
function compressImageToDataUrl(file, maxDim, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > height && width > maxDim){ height = Math.round(height * (maxDim/width)); width = maxDim; }
        else if(height > maxDim){ width = Math.round(width * (maxDim/height)); height = maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// ---------------- Transfer slip verification ----------------
// Every place in the app where an owner/org attaches a bank-transfer
// screenshot as proof of payment (Upgrade to Pro's BML/MIB tabs, and the
// Request Additional Boat screenshot) runs the uploaded image through this
// same check before it's ever sent to the server. It OCRs the slip image
// client-side (Tesseract.js, lazy-loaded only the first time it's actually
// needed) and confirms three things against what's configured on this
// device/org: the amount is exactly the required MVR 500, the "To" account
// number on the slip matches the relevant BML/MIB account set by the Super
// Admin, and the slip's own transaction date/time is within 15 minutes of
// the moment the person pressed to start that particular transfer (BML/MIB
// tab tap, or opening the Request Additional Boat form) -- not just "recent"
// in general, since a stale but real slip from days ago shouldn't pass either.
// Recognizes the three real slip layouts in use: the BML app's own
// confirmation screen, an MIB-to-MIB "Transfer Successful" screenshot, and
// an MIB "Favara" cross-bank transfer screenshot (whose own "Bank" field
// says which bank the money actually landed in). Dark-mode screenshots of
// any of these are read the same way -- only the colours differ, not the
// text OCR reads.
let _tesseractLoadPromise = null;
function loadTesseractLib(){
  if(window.Tesseract) return Promise.resolve(window.Tesseract);
  if(_tesseractLoadPromise) return _tesseractLoadPromise;
  _tesseractLoadPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.0/dist/tesseract.min.js';
    s.onload = () => resolve(window.Tesseract);
    s.onerror = () => reject(new Error('Failed to load OCR library'));
    document.head.appendChild(s);
  });
  return _tesseractLoadPromise;
}
async function ocrTransferSlipImage(file){
  const Tesseract = await loadTesseractLib();
  const { data } = await Tesseract.recognize(file, 'eng');
  return (data && data.text) || '';
}
// Turns raw OCR text into {format, slipBank, amount, toAccount, dateObj},
// or null if it doesn't look like any of the three recognized slip layouts.
function parseTransferSlipText(rawText){
  const text = String(rawText || '').replace(/\r/g, '');
  const upper = text.toUpperCase();
  // The MIB app stamps every slip it produces with its own "MALDIVES
  // ISLAMIC BANK" footer/logo -- regardless of which bank the money
  // actually lands in (a same-bank "MIB Transfer", a cross-bank "Favara"
  // transfer, or a cross-bank "Quick Transfer" all carry that same
  // footer). So the footer only tells us the slip came from the MIB app,
  // never the destination bank -- that's only ever trustworthy from the
  // slip's own "Bank" row, read below, regardless of what the
  // Transaction Type label says.
  const isMibApp = upper.includes('MALDIVES ISLAMIC BANK');
  const isBmlApp = !isMibApp && (upper.includes('BANK OF MALDIVES') || (upper.includes('REFERENCE') && upper.includes('TRANSACTION DATE')));
  let format = null;
  if(isMibApp) format = 'mib_app';
  else if(isBmlApp) format = 'bml_app';
  if(!format) return null;

  let slipBank = null;
  if(format === 'bml_app'){
    slipBank = 'bml';
  } else if(format === 'mib_app'){
    const bankMatch = text.match(/Bank\s*[:\-]?\s*([A-Za-z .]+)/i);
    if(bankMatch){
      const b = bankMatch[1].toUpperCase();
      if(b.includes('ISLAMIC')) slipBank = 'mib';
      else if(b.includes('BML') || b.includes('MALDIVES')) slipBank = 'bml';
    }
  }

  let amount = null;
  const amtMatch = text.match(/MVR\s*[:\-]?\s*([\d,]+\.\d{2})/i) || text.match(/([\d,]+\.\d{2})\s*MVR/i);
  if(amtMatch) amount = parseFloat(amtMatch[1].replace(/,/g, ''));

  let toAccount = null;
  const toIdx = text.search(/\bTo\b/i);
  if(toIdx !== -1){
    const windowText = text.slice(toIdx, toIdx + 150);
    const digitMatch = windowText.match(/\d[\d\s]{6,20}\d/);
    if(digitMatch) toAccount = digitMatch[0].replace(/\s+/g, '');
  }

  let dateObj = null;
  let m = text.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2})/);
  if(m){
    dateObj = new Date(parseInt(m[3],10), parseInt(m[2],10)-1, parseInt(m[1],10), parseInt(m[4],10), parseInt(m[5],10));
  } else {
    m = text.match(/(\d{4})-(\d{2})-(\d{2})\s+(\d{2}):(\d{2}):(\d{2})/);
    if(m) dateObj = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10), parseInt(m[4],10), parseInt(m[5],10), parseInt(m[6],10));
  }

  return { format, slipBank, amount, toAccount, dateObj };
}
// Draws the image onto a canvas and inverts every pixel's RGB -- turns a
// light-text-on-dark-background screenshot into dark-text-on-light, which
// OCR reads far more reliably. Only used as a fallback (see readTransferSlip
// below) since it costs an extra OCR pass.
function invertImageColorsToBlob(file){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      img.onerror = reject;
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        for(let i = 0; i < d.length; i += 4){
          d[i] = 255 - d[i];
          d[i+1] = 255 - d[i+1];
          d[i+2] = 255 - d[i+2];
        }
        ctx.putImageData(imgData, 0, 0);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob failed')), 'image/png');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
async function readTransferSlip(file){
  let text;
  try{ text = await ocrTransferSlipImage(file); }
  catch(e){ console.error('Transfer slip OCR failed', e); return null; }
  let parsed = parseTransferSlipText(text);
  if(!parsed){
    // Dark-mode screenshots (light text on a dark panel -- e.g. the MIB
    // app's dark theme) often read poorly for OCR, which is trained on
    // dark text on a light background. Before giving up, retry once with
    // the image's colors inverted.
    try{
      const inverted = await invertImageColorsToBlob(file);
      const text2 = await ocrTransferSlipImage(inverted);
      parsed = parseTransferSlipText(text2);
    }catch(e){
      console.error('Inverted-image OCR retry failed', e);
    }
  }
  return parsed;
}
// Pure comparison against an already-known expected bank -- used once we
// know which account (BML or MIB) the slip is supposed to be proving payment
// into.
function validateParsedTransferSlip(parsed, opts){
  if(!parsed || !parsed.slipBank){
    return { valid:false, reason: t('This doesn\u2019t look like a supported transfer slip.') };
  }
  if(parsed.slipBank !== opts.expectedBank){
    return { valid:false, reason: t('This slip isn\u2019t a transfer into the correct account.') };
  }
  if(parsed.amount == null || Math.abs(parsed.amount - opts.expectedAmount) > 0.001){
    return { valid:false, reason: t('The amount on the slip doesn\u2019t match the required amount.') };
  }
  const expectedDigits = String(opts.expectedAccountNumber || '').replace(/\D/g, '');
  const slipDigits = String(parsed.toAccount || '').replace(/\D/g, '');
  if(!expectedDigits || !slipDigits || slipDigits !== expectedDigits){
    return { valid:false, reason: t('The destination account number on the slip doesn\u2019t match.') };
  }
  if(!parsed.dateObj){
    return { valid:false, reason: t('Couldn\u2019t read the date/time on the slip.') };
  }
  const diffMinutes = Math.abs(parsed.dateObj.getTime() - opts.referenceTime) / 60000;
  if(diffMinutes > (opts.windowMinutes || 15)){
    return { valid:false, reason: t('The date/time on the slip is outside the allowed 15-minute window.') };
  }
  return { valid:true };
}
// Used where the expected bank is already fixed (the person picked the BML
// or MIB tab before uploading).
async function checkTransferSlip(file, opts){
  const parsed = await readTransferSlip(file);
  if(!parsed) return { valid:false, reason: t('Couldn\u2019t read the transfer slip image. Try a clearer photo/screenshot.') };
  return validateParsedTransferSlip(parsed, opts);
}
// Used where no bank was picked up front (the Request Additional Boat form)
// -- accepts either BML or MIB, whichever the slip itself turns out to be.
async function checkTransferSlipAnyBank(file, opts){
  const parsed = await readTransferSlip(file);
  if(!parsed) return { valid:false, reason: t('Couldn\u2019t read the transfer slip image. Try a clearer photo/screenshot.') };
  const expectedAccountNumber = parsed.slipBank === 'mib' ? opts.mibAccountNumber : opts.bmlAccountNumber;
  return validateParsedTransferSlip(parsed, { expectedBank: parsed.slipBank, expectedAccountNumber, expectedAmount: opts.expectedAmount, referenceTime: opts.referenceTime, windowMinutes: opts.windowMinutes });
}
// Themed error popup for a rejected slip -- auto-dismisses after 6 seconds
// on its own, same as tapping the X or outside the panel does manually.
// Whichever way it closes, onDismiss() runs once to reset that upload area
// back to a fresh, empty state (no stale file left attached) rather than
// leaving the person to re-open the form themselves.
function showTransferSlipErrorPopup(reason, onDismiss){
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'slip-error-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2400;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" style="max-width:380px;width:100%;margin:0;position:relative;animation:invoice-pop-in 0.18s ease-out;">
      <button type="button" class="btn btn-ghost" id="slip-error-close-btn" style="position:absolute;top:10px;right:10px;padding:6px 11px;">\u2715</button>
      <h3 style="margin-bottom:6px;color:var(--red);">${t('Not a Valid Transfer Slip')}</h3>
      <p class="sub" style="margin-bottom:4px;">${escapeHtml(reason)}</p>
      <p class="sub" style="margin-bottom:0;">${t('Please upload a valid transfer slip.')}</p>
    </div>
  `;
  document.body.appendChild(overlay);
  let closed = false;
  const close = () => {
    if(closed) return;
    closed = true;
    clearTimeout(timer);
    overlay.remove();
    unlockBodyScroll();
    if(onDismiss) onDismiss();
  };
  const timer = setTimeout(close, 6000);
  document.getElementById('slip-error-close-btn').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
}

async function completeLoadConfirm(id){
  const draft = state.loadingDraft[id];
  if(!draft) return;
  const items = draft.items.filter(i => i.qty > 0).map(i => ({name:i.name, qty:i.qty, price:i.price}));
  if(items.length === 0) return;
  const total = items.reduce((sum,i) => sum + i.qty*i.price, 0);
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'loaded'; s.items = items; s.total = total; s.loadedAt = new Date().toISOString();
    s.invoiceId = s.invoiceId || invoiceId();
    s.paid = s.paid || false;
  });
  delete state.loadingDraft[id];
  state.expandedShipmentIds.delete(id);
  syncShipmentToSheet(state.shipments.find(x => x.id === id));
  renderDashboard();
}

async function attachPhoto(id, photo){
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(s){ s.photo = photo; s.imageArchived = false; }
  });
  state.expandedShipmentIds.delete(id);
  renderDashboard();
}

// Called from the Trips tab: moves every 'loaded' shipment tied to this trip
// into 'in_transit' together, since the boat either has departed or hasn't --
// individual shipments don't depart separately.
async function markTripInTransit(tripId){
  let moved = 0;
  const now = new Date().toISOString();
  await withFreshShipments(list => {
    list.forEach(s => {
      if(s.tripId === tripId && s.status === 'loaded'){ s.status = 'in_transit'; s.inTransitAt = now; moved++; }
    });
  });
  await withFreshTrips(list => {
    const t = list.find(x => x.id === tripId);
    if(t) t.departed = true;
  });
  return moved;
}

/* ---------------- GPS auto-tracking (departure + arrival detection) ----------------
   Uses whichever phone the owner/staff taps "Start Location Tracking" on --
   normally the one physically kept on the boat -- to watch its GPS position
   against island coordinates saved in Trip Settings. When that phone moves
   more than GPS_DEPART_METERS from the trip's origin island, the trip is
   auto-marked in transit (same effect as tapping "Mark In Transit"). Once
   departed, each destination island with saved coordinates is checked in
   turn; coming within GPS_ARRIVE_METERS of one auto-sets it as the arrived
   island, the same as picking it from the "Boat arrived at" dropdown.

   Only the device that started tracking runs any of this (tracked via a
   localStorage flag, not shared app data) -- otherwise every phone with the
   app open would try to report its own location as the boat's. The trip
   status changes this produces ARE shared normally (via withFreshTrips),
   same as a manual tap, so every device sees them once they happen.

   A single raw GPS reading past the threshold isn't trusted on its own --
   phones drift by tens of meters even standing still, especially near a
   jetty. GPS_CONFIRM_READINGS consecutive readings, each at least
   GPS_CONFIRM_GAP_MS apart, must agree before anything is auto-changed. */
const GPS_DEPART_METERS = 500;
const GPS_ARRIVE_METERS = 350;
const GPS_CONFIRM_READINGS = 3;
const GPS_CONFIRM_GAP_MS = 20000;
const GPS_TRACKING_STORAGE_KEY = 'seafare_gps_tracking_trip_id';

let gpsWatchId = null;
let gpsTrackingTripId = null;
let gpsDepartConfirm = [];      // timestamps of consecutive over-threshold readings since departure
let gpsArriveConfirm = {};      // { islandName: [timestamps] } since arrival

function haversineMeters(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Accepts a plain "lat, lng" pair or a pasted Google Maps URL/link (which
// carries the coordinates as @lat,lng,... or !3dlat!4dlng in the URL) and
// pulls the first coordinate pair out of it. Returns null if none found --
// this is deliberately just regex extraction, no network geocoding call,
// so it works offline and needs no API key.
function parseLatLngFromText(str){
  if(!str) return null;
  const s = String(str).trim();
  let m = s.match(/(-?\d{1,3}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  if(!m) m = s.match(/!3d(-?\d{1,3}\.\d+)!4d(-?\d{1,3}\.\d+)/);
  if(!m) return null;
  const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
  if(isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat, lng };
}

// Every island name the boat is known to touch, from its saved routes --
// shared between the New Trip origin/destination pickers and the Island
// Locations editor in Trip Settings so both list the same islands.
function getAllKnownIslands(){
  const boatRoutes = state.settings.routes || [];
  return [...new Set([
    ...boatRoutes.map(r => r.origin),
    ...boatRoutes.flatMap(r => r.destinations || [])
  ])];
}

function isGpsTrackingThisDevice(tripId){
  return gpsTrackingTripId === tripId;
}

function startGpsTracking(tripId){
  if(!navigator.geolocation){ alert(t('This device/browser can\'t get GPS location.')); return; }
  const trip = (state.trips||[]).find(x => x.id === tripId);
  if(!trip){
    showMessageBox(t('No Trip Found'), t("This trip couldn't be found, so GPS tracking can't start. Add or select a trip first."));
    return;
  }
  const coords = state.settings.islandCoords || {};
  const hasOrigin = !!coords[trip.origin];
  const hasAnyDest = (trip.destinations||[]).some(isl => coords[isl]);
  if(!hasOrigin && !hasAnyDest){
    showMessageBox(t('Location Needed'), t('Set island locations for this route in Trip Settings first, so GPS tracking knows what to check distance against.'));
    return;
  }
  stopGpsTracking();
  gpsTrackingTripId = tripId;
  gpsDepartConfirm = [];
  gpsArriveConfirm = {};
  try{ localStorage.setItem(GPS_TRACKING_STORAGE_KEY, tripId); }catch(e){}
  gpsWatchId = navigator.geolocation.watchPosition(
    pos => handleGpsUpdate(tripId, pos),
    err => { console.error('GPS watch error', err); },
    { enableHighAccuracy: true, maximumAge: 10000, timeout: 25000 }
  );
  renderDashboard();
}

function stopGpsTracking(){
  if(gpsWatchId != null){ navigator.geolocation.clearWatch(gpsWatchId); }
  gpsWatchId = null;
  gpsTrackingTripId = null;
  gpsDepartConfirm = [];
  gpsArriveConfirm = {};
  try{ localStorage.removeItem(GPS_TRACKING_STORAGE_KEY); }catch(e){}
}

// Resumes tracking after a page reload if this same device was mid-trip
// tracking before -- the watchPosition itself never survives a reload,
// only the "which trip was I tracking" flag does. Won't resume across app
// backgrounding on iOS since the tab can be fully suspended; the person
// needs to reopen the app for that.
function resumeGpsTrackingIfAny(){
  let savedTripId = null;
  try{ savedTripId = localStorage.getItem(GPS_TRACKING_STORAGE_KEY); }catch(e){}
  if(!savedTripId) return;
  const trip = (state.trips||[]).find(x => x.id === savedTripId);
  if(!trip || trip.finished || !isProAccount()){
    try{ localStorage.removeItem(GPS_TRACKING_STORAGE_KEY); }catch(e){}
    return;
  }
  startGpsTracking(savedTripId);
}

async function handleGpsUpdate(tripId, pos){
  const trip = (state.trips||[]).find(x => x.id === tripId);
  if(!trip || trip.finished){ stopGpsTracking(); return; }
  const coords = state.settings.islandCoords || {};
  const now = Date.now();
  const here = { lat: pos.coords.latitude, lng: pos.coords.longitude };

  if(!trip.departed){
    const origin = coords[trip.origin];
    if(!origin) return;
    const dist = haversineMeters(here.lat, here.lng, origin.lat, origin.lng);
    if(dist > GPS_DEPART_METERS){
      gpsDepartConfirm = gpsDepartConfirm.filter(ts => now - ts < GPS_CONFIRM_GAP_MS * GPS_CONFIRM_READINGS * 2);
      const last = gpsDepartConfirm[gpsDepartConfirm.length - 1];
      if(!last || now - last >= GPS_CONFIRM_GAP_MS) gpsDepartConfirm.push(now);
      if(gpsDepartConfirm.length >= GPS_CONFIRM_READINGS){
        gpsDepartConfirm = [];
        let moved = 0;
        const tripShipments = state.shipments.filter(s => s.tripId === tripId);
        try{
          moved = await markTripInTransit(tripId);
        }catch(e){
          console.error('Auto markTripInTransit failed', e);
          return;
        }
        trip.departed = true;
        downloadTripManifest(trip, tripShipments);
        alert(`${t('GPS detected departure \u2014 trip marked in transit automatically.')} ${moved} ${t('shipment(s) updated.')}`);
        renderDashboard();
      }
    } else {
      gpsDepartConfirm = [];
    }
  } else {
    for(const isl of (trip.destinations||[])){
      if(trip.arrivedIsland === isl) continue;
      const dest = coords[isl];
      if(!dest) continue;
      const dist = haversineMeters(here.lat, here.lng, dest.lat, dest.lng);
      if(dist <= GPS_ARRIVE_METERS){
        const list = gpsArriveConfirm[isl] || [];
        const last = list[list.length - 1];
        if(!last || now - last >= GPS_CONFIRM_GAP_MS) list.push(now);
        gpsArriveConfirm[isl] = list;
        if(list.length >= GPS_CONFIRM_READINGS){
          gpsArriveConfirm[isl] = [];
          trip.arrivedIsland = isl;
          trip.arrivedAt = new Date().toISOString();
          state.dashIslandView = isl;
          renderDashboard();
          try{
            await withFreshTrips(l => {
              const fresh = l.find(x => x.id === tripId);
              if(fresh){ fresh.arrivedIsland = isl; fresh.arrivedAt = trip.arrivedAt; }
            });
          }catch(e){ console.error('Auto arrival save failed', e); }
          alert(`${t('GPS detected arrival at')} ${isl}.`);
          renderDashboard();
        }
      } else {
        gpsArriveConfirm[isl] = [];
      }
    }
  }
}

/* ---------------- Pro subscription gate + upgrade popup ----------------
   Free accounts get one boat, English/Dhivehi is locked to whichever the
   boat already uses, and GPS auto-tracking is off. Everything about Pro
   status lives on this boat's own settings (the same generic per-boat
   settings storage islandCoords/routes/etc. already use) -- there's no
   separate billing backend here, so:
     isPro            -- boolean, set by the Super Admin once a transfer's confirmed
     proStartedAt     -- ISO date the current 30-day period began
     proExpiresAt     -- ISO date that period ends (proStartedAt + 30 days)
     proRequestPending -- true from the moment the owner taps "I've Paid" until
                          Super Admin approves it (which clears it)
     proRequestedAt   -- ISO date of the most recent request, informational
   isProAccount() is expiry-aware on purpose -- once proExpiresAt passes
   with no renewal, Pro features lock again automatically without needing
   an admin to manually revoke anything. */
function isProAccount(){
  const s = state.settings || {};
  if(!s.isPro) return false;
  if(s.proExpiresAt && new Date(s.proExpiresAt).getTime() <= Date.now()) return false;
  return true;
}
// Same check, but from the Org Dashboard screen's own org-level data
// (state.orgData, set at org login/signup) rather than a specific boat's
// settings -- used before a specific boat's dispatch app (and therefore
// state.settings) has been opened, e.g. the "Request Additional Boat" flow.
function isOrgPro(){
  const o = state.orgData || {};
  if(!o.isPro) return false;
  if(o.proExpiresAt && new Date(o.proExpiresAt).getTime() <= Date.now()) return false;
  return true;
}
function proDaysLeft(){
  const s = state.settings || {};
  if(!s.proExpiresAt) return null;
  return (new Date(s.proExpiresAt).getTime() - Date.now()) / 86400000;
}

// Marks (on this device, for this boat) that a Pro payment is in flight
// and the person hasn't actually seen the "Pro is now active" confirmation
// for it yet -- set the moment they submit a bank-transfer request or open
// a Swipe payment link, cleared once showProActivatedAnimation() has
// actually played for them. This is what makes Pro activation reliably
// *seen*, not just applied, even when the confirming event (Super Admin
// approving the transfer, or Swipe confirming the payment) happens while
// they're not looking at this tab at all -- mid-payment in the Swipe app,
// or with the browser/app closed entirely overnight waiting on the Super
// Admin. See checkProActivationAck(), run once per app open from
// renderDashboard() the same way checkProExpiryWarning() is: if this flag
// is still set next time they open the app AND isProAccount() is now
// true, that's exactly the "it went through while I was away" case, and
// the confirmation they missed gets shown right then instead of silently
// never appearing.
function proAckPendingKey(){
  return `sf_pro_ack_pending:${CURRENT_BOAT_ID || 'x'}`;
}
function markProAckPending(){
  try{ localStorage.setItem(proAckPendingKey(), '1'); }catch(e){}
}
function clearProAckPending(){
  try{ localStorage.removeItem(proAckPendingKey()); }catch(e){}
}
// Separate from the pending-request flag above -- this just remembers
// whether THIS device last saw this boat as Pro or not, so a Pro grant
// with no request behind it at all (Super Admin just switches it on as a
// courtesy, nobody ever submitted a transfer or opened a Swipe link)
// still gets caught. Without this, checkProActivationAck() below would
// only ever fire for request-based grants, since markProAckPending() is
// only ever called from submitProRequest()/renderSwipeAccountBody().
function proLastStateKey(){
  return `sf_pro_last_state:${CURRENT_BOAT_ID || 'x'}`;
}
let _proActivationAckCheckedThisLoad = false;
// Run once per app open, from renderDashboard() the same way
// checkProExpiryWarning() is. Two independent reasons this device might
// owe the person a "Pro is now active" moment it hasn't shown yet:
//   1. It knows it's mid-request (proAckPendingKey) -- covers Super Admin
//      approving a submitted transfer, or a Swipe payment completing,
//      while this tab wasn't open to catch it live.
//   2. This boat just flipped from not-Pro to Pro since the last time
//      this device checked (proLastStateKey), with NO request pending at
//      all -- covers a Super Admin granting Pro unprompted, which #1
//      alone would never catch.
// Either way, the animation is due. A brand-new device's very first
// check on an org that's already Pro just records that silently instead
// of firing -- nothing "just changed" from that device's point of view,
// so popping the animation there would be a false alarm, not a catch-up.
async function checkProActivationAck(){
  if(_proActivationAckCheckedThisLoad) return;
  _proActivationAckCheckedThisLoad = true;
  const nowPro = isProAccount();
  let pending = false;
  try{ pending = localStorage.getItem(proAckPendingKey()) === '1'; }catch(e){}
  let lastKnown = null;
  try{ lastKnown = localStorage.getItem(proLastStateKey()); }catch(e){}
  const justWentPro = nowPro && lastKnown !== null && lastKnown !== 'pro';
  try{ localStorage.setItem(proLastStateKey(), nowPro ? 'pro' : 'free'); }catch(e){}
  if(!nowPro || !(pending || justWentPro)) return;
  clearProAckPending();
  await showProActivatedAnimation();
}

// it to Pro -- the actual "notify the admin" step, since there's no push

// (POST /api/pro-requests) -- until that endpoint exists server-side,
// this call harmlessly fails and the local flag above is all that
// tracks the request (as it did before this endpoint was specified).
// The transfer slip itself doesn't depend on that endpoint at all --
// it's stored on this boat's own settings (proRequestScreenshot), the
// same safe generic per-boat storage everything else here uses, so
// Super Admin can already see it (and, on approval, it gets deleted --
// see adminApproveProForOrganization) with zero backend changes needed.
async function submitProRequest(screenshotDataUrl){
  await withFreshSettings(fresh => {
    fresh.proRequestPending = true;
    fresh.proRequestedAt = new Date().toISOString();
    fresh.proRequestScreenshot = screenshotDataUrl || null;
  });
  markProAckPending();
  try{
    await fetch(`${API_BASE}/api/pro-requests`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        boatId: CURRENT_BOAT_ID,
        boatName: _boatNameCache[CURRENT_BOAT_ID] || null
      })
    });
  }catch(e){
    console.error('pro-request notification call failed (backend endpoint may not exist yet)', e);
  }
}

// Small "here's what this feature is" nudge shown when a free-plan
// account taps something Pro-gated (dark mode, more than 2 staff, GPS
// tracking, etc.), instead of dropping straight into the payment popup.
// One shared popup, one shared shape -- the only thing that changes per
// call site is the sentence naming that specific feature. "Upgrade to
// Pro" here just closes this and opens the real payment popup above.
function openProFeatureRequiredPopup(featureText){
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'pro-feature-required-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2200;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" style="max-width:380px;width:100%;margin:0;animation:invoice-pop-in 0.18s ease-out;position:relative;text-align:center;">
      <button type="button" class="btn btn-ghost" id="pro-feature-required-close-btn" style="position:absolute;top:14px;right:14px;padding:6px 11px;">\u2715</button>
      <div class="plan-tier-icon pro" style="margin:0 auto 14px;">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS.crown}</svg>
      </div>
      <h3 style="margin-bottom:8px;">${t('Pro Feature')}</h3>
      <p class="sub" style="margin-bottom:18px;">${escapeHtml(featureText)}</p>
      <button class="btn btn-primary" id="pro-feature-required-upgrade-btn" style="width:100%;">${t('Upgrade to Pro')}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => { overlay.remove(); unlockBodyScroll(); };
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
  document.getElementById('pro-feature-required-close-btn').addEventListener('click', close);
  document.getElementById('pro-feature-required-upgrade-btn').addEventListener('click', () => {
    close();
    openUpgradeToProPopup();
  });
}

function closeUpgradeToProPopup(){
  stopSwipePaymentPolling();
  stopRedotPayPaymentPolling();
  stopBankTransferPolling();
  const overlay = document.getElementById('upgrade-pro-popup-overlay');
  if(overlay) unlockBodyScroll();
  overlay?.remove();
}

function wireUpgradeToProAccountTabs(){
  document.querySelectorAll('#upgrade-pro-account-tabs [data-pro-account-tab]').forEach(b => b.addEventListener('click', () => {
    stopSwipePaymentPolling();
    stopRedotPayPaymentPolling();
    document.querySelectorAll('#upgrade-pro-account-tabs [data-pro-account-tab]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if(b.dataset.proAccountTab === 'bml' || b.dataset.proAccountTab === 'mib'){
      _proTransferSelectedAt = Date.now();
    }
    renderUpgradeToProAccountBody(b.dataset.proAccountTab);
  }));
}

// The Swipe/RedotPay tabs render into the very same #upgrade-pro-account-body
// slot as BML/MIB below, instead of opening a second stacked popup on top of
// this one -- that used to double up the dark overlay (two translucent
// backdrops layered on each other) so the organization app behind looked
// noticeably darker/grayer than every other popup in the app. One panel,
// one overlay, same as everywhere else.
function renderUpgradeToProAccountBody(which){
  if(which === 'swipe'){
    stopRedotPayPaymentPolling(); stopBankTransferPolling();
    const reqArea = document.getElementById('upgrade-pro-request-area');
    if(reqArea) reqArea.innerHTML = '';
    renderSwipeAccountBody();
    return;
  }
  if(which === 'redotpay'){
    stopSwipePaymentPolling(); stopBankTransferPolling();
    const reqArea = document.getElementById('upgrade-pro-request-area');
    if(reqArea) reqArea.innerHTML = '';
    renderRedotPayAccountBody();
    return;
  }
  stopSwipePaymentPolling();
  stopRedotPayPaymentPolling();
  const body = document.getElementById('upgrade-pro-account-body');
  if(!body) return;
  if(!_proBankAccounts){
    body.innerHTML = `<div class="empty" style="padding:16px 0;">${t('Loading\u2026')}</div>`;
    return;
  }
  const a = _proBankAccounts[which] || _proBankAccounts.bml || { name:'', number:'' };
  body.innerHTML = `
    <div class="item-result-row" style="flex-direction:column;align-items:flex-start;gap:6px;">
      <div class="tag-meta">${t('Account Name')}: <strong>${escapeHtml(a.name)}</strong></div>
      <div class="tag-meta">${t('Account Number')}: <strong class="copy-number" data-copy-number="${escapeHtml(a.number)}" style="text-decoration:underline;cursor:pointer;">${escapeHtml(a.number)}</strong></div>
    </div>
    <div class="note" style="margin-top:12px;">${t('Tap the account number to copy it. After transferring, tap "I\u2019ve Paid" below so the Super Admin can confirm it.')}</div>
  `;
  body.querySelectorAll('[data-copy-number]').forEach(el => el.addEventListener('click', async (e) => {
    e.stopPropagation();
    const number = el.dataset.copyNumber;
    if(!number) return;
    const original = el.textContent;
    try{
      await navigator.clipboard.writeText(number);
      el.textContent = t('Copied!');
    }catch(err){
      el.textContent = t('Could not copy');
    }
    setTimeout(() => { el.textContent = original; }, 1200);
  }));
  // BML/MIB are the only tabs that ever need the screenshot-upload /
  // "I've Paid" form -- it wasn't rendered on popup open anymore (see
  // openUpgradeToProPopup), so this is where it actually appears now,
  // the moment one of these two tabs is picked.
  renderUpgradeToProRequestArea(_proAlreadyRequested, which);
}

// "Pay by Swipe" tab -- creates a real payment link via the server (which
// talks to Swipe with a server-side API key; the browser never sees it),
// then shows it with an Open + status line, right inside the same
// Upgrade-to-Pro panel the BML/MIB tabs use (see renderUpgradeToProAccountBody
// above) rather than a second popup stacked on top of it.
//
// Rather than polling on a timer while this tab just sits there (which
// could flip the status -- and pop the "Pro activated" animation --
// while the person isn't even looking at the screen, e.g. still over in
// the Swipe app or the pay.swipe.mv tab), the check instead fires the
// moment the person actually comes back to this tab: on 'visibilitychange'
// (tab regains focus) and plain window 'focus' (covers switching back
// into the same window/app on mobile). That's naturally when they'd
// expect to see whether it went through. The "Check Now" button is still
// there as a manual fallback. Since Pro lives on the organization, a
// confirmed payment here shows up for every boat, owner, manager, and
// staff under it -- not just this device or boat.
let _swipeProPaymentRef = null;
let _swipeProReturnHandler = null;
// Set by openUpgradeToProPopup() the moment the popup opens -- see there
// for why this (rather than re-reading live state) is what
// handleProPaymentConfirmed() below uses to decide where to return to.
let _proUpgradeReturnContext = null;
function stopSwipePaymentPolling(){
  if(_swipeProReturnHandler){
    document.removeEventListener('visibilitychange', _swipeProReturnHandler);
    window.removeEventListener('focus', _swipeProReturnHandler);
    _swipeProReturnHandler = null;
  }
  _swipeProPaymentRef = null;
}
// Same "check when they actually come back to the tab" approach as the
// Swipe polling above, but for a submitted bank-transfer request instead
// of a Swipe link -- there's no separate payment status endpoint for
// this path, so it just re-fetches this boat's own settings and checks
// isProAccount(); the Super Admin approving the transfer is what flips
// that server-side. Started the moment the "waiting for the Super Admin"
// note is shown (see renderUpgradeToProRequestArea) and stopped on popup
// close or once it's confirmed.
let _bankTransferReturnHandler = null;
function stopBankTransferPolling(){
  if(_bankTransferReturnHandler){
    document.removeEventListener('visibilitychange', _bankTransferReturnHandler);
    window.removeEventListener('focus', _bankTransferReturnHandler);
    _bankTransferReturnHandler = null;
  }
}
async function checkBankTransferProStatus(){
  try{
    state.settings = await loadSettings();
  }catch(e){ console.error('checkBankTransferProStatus failed', e); return; }
  if(isProAccount()){
    stopBankTransferPolling();
    await handleProPaymentConfirmed();
  }
}
function startBankTransferPolling(){
  if(_bankTransferReturnHandler) return;
  _bankTransferReturnHandler = () => {
    if(document.visibilityState === 'visible') checkBankTransferProStatus();
  };
  document.addEventListener('visibilitychange', _bankTransferReturnHandler);
  window.addEventListener('focus', _bankTransferReturnHandler);
}
async function renderSwipeAccountBody(){
  const body = document.getElementById('upgrade-pro-account-body');
  if(!body) return;
  body.innerHTML = `<div class="note">${t('Generating a payment link\u2026')}</div>`;
  try{
    const res = await fetch(`${API_BASE}/api/pro/payment-link`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ boatId: CURRENT_BOAT_ID }),
    });
    const data = await res.json().catch(() => ({}));
    if(!res.ok || !data.ok || !data.paymentUrl){
      body.innerHTML = `<div class="note" style="border-color:var(--red);color:var(--ink-soft);">${t('Could not create a payment link right now. Use the bank transfer option instead, or try again in a moment.')}</div>`;
      return;
    }
    _swipeProPaymentRef = data.swipePaymentId;
    markProAckPending();
    body.innerHTML = `
      <div class="note">${t('Tap below to pay \u0783')}${SWIPE_PRO_DISPLAY_AMOUNT} ${t('via the Swipe app. Pro activates automatically once payment is confirmed \u2014 no need to notify the Super Admin for this option.')}</div>

    `;
    document.getElementById('swipe-payment-check-btn').addEventListener('click', () => checkSwipeProPaymentStatus(false));
    // Check automatically the moment the person comes back to this tab --
    // not on a timer running the whole time they're away. Cleared by
    // stopSwipePaymentPolling() on popup close or once the payment clears.
    _swipeProReturnHandler = () => {
      if(document.visibilityState === 'visible') checkSwipeProPaymentStatus(true);
    };
    document.addEventListener('visibilitychange', _swipeProReturnHandler);
    window.addEventListener('focus', _swipeProReturnHandler);
  }catch(e){
    console.error('renderSwipeAccountBody failed', e);
    body.innerHTML = `<div class="note" style="border-color:var(--red);color:var(--ink-soft);">${t('Could not create a payment link right now. Use the bank transfer option instead, or try again in a moment.')}</div>`;

}
async function checkSwipeProPaymentStatus(isAutoPoll){
  if(!_swipeProPaymentRef) return;
  const btn = document.getElementById('swipe-payment-check-btn');
  const statusEl = document.getElementById('swipe-payment-status');
  if(!isAutoPoll && btn){ btn.disabled = true; btn.textContent = t('Checking\u2026'); }
  try{
    const res = await fetch(`${API_BASE}/api/pro/payment-link/${encodeURIComponent(_swipeProPaymentRef)}/status`);
    const data = await res.json().catch(() => ({}));
    if(data.ok && data.status === 'COMPLETED'){
      stopSwipePaymentPolling();
      await handleProPaymentConfirmed();
      return;
    }
    if(statusEl) statusEl.textContent = data.ok ? `${t('Status')}: ${data.status}` : t('Could not check payment status.');
  }catch(e){
    console.error('checkSwipeProPaymentStatus failed', e);
    if(statusEl) statusEl.textContent = t('Could not check payment status.');
  }finally{
    if(!isAutoPoll && btn){ btn.disabled = false; btn.textContent = t('Check Now'); }
  }
}

// Hover shows/hides the name via pure CSS (:hover). Touch needs JS: a tap
// shows the name for 5s, and holding the icon down keeps it visible for as
// long as the finger stays -- the 5s countdown only starts once released.
function wireRedotPayWalletTooltips(container){
  container.querySelectorAll('.redotpay-wallet').forEach(el => {
    let hideTimer = null;
    const show = () => {
      if(hideTimer){ clearTimeout(hideTimer); hideTimer = null; }
      el.classList.add('show-name');
    };
    const scheduleHide = () => {
      if(hideTimer) clearTimeout(hideTimer);
      hideTimer = setTimeout(() => el.classList.remove('show-name'), 5000);
    };
    el.addEventListener('touchstart', show, { passive: true });
    el.addEventListener('touchend', scheduleHide);
    el.addEventListener('touchcancel', scheduleHide);
  });
}

// Shared "Pro just activated" moment, fired the instant a Swipe payment or
// a Super-Admin-approved bank transfer is confirmed (whether caught by an
// auto-poll, a manual "Check Now", or the bank-transfer visibility/focus
// check -- see checkBankTransferProStatus()). Closes the payment panel,
// shows a brief animated confirmation, then refreshes whichever screen the
// person was on -- captured in
// _proUpgradeReturnContext when the popup was first opened -- so Pro-only
// options appear immediately and they can pick up right where they left
// off, no manual reload or renavigating needed. On the Org Dashboard
// specifically that means landing back on the (now Pro) "add another
// boat" flow, since that's the only thing Upgrade to Pro is ever
// triggered from there; everywhere else (Home's GPS prompt, routes/trip
// settings, the language toggle inside Settings, or any other page) just
// redraws that same tab now that isProAccount()/isOrgPro() reflect the
// new payment.
async function handleProPaymentConfirmed(){
  clearProAckPending();
  try{ localStorage.setItem(proLastStateKey(), 'pro'); }catch(e){}
  const returnContext = _proUpgradeReturnContext || { entryMode: state.entryMode, tab: state.tab, settingsTab: state.settingsTab };
  _proUpgradeReturnContext = null;
  closeUpgradeToProPopup();
  await showProActivatedAnimation();
  if(returnContext.entryMode === 'org' && state.orgData){
    try{
      const refreshed = await fetch(`${API_BASE}/api/org-login`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ mobile: state.orgData.mobile, passkey: state.orgPasskey })
      }).then(r => r.json()).catch(() => null);
      if(refreshed && refreshed.ok){
        state.orgData = refreshed.organization;
        state.orgBoats = refreshed.boats || [];
      }
    }catch(e){ console.error('org refresh after Pro payment failed', e); }
    state.boatRequestOpen = true;
    state.orgError = '';
    renderOrgDashboard();
  } else {
    try{ state.settings = await loadSettings(); }catch(e){ console.error('settings refresh after Pro payment failed', e); }
    // Restore the exact tab/sub-tab the payment was started from (in case
    // anything else changed state.tab in the background while the popup
    // was open, e.g. a poll-driven redirect) before redrawing it.
    if(returnContext.tab) state.tab = returnContext.tab;
    if(returnContext.settingsTab) state.settingsTab = returnContext.settingsTab;
    render();
  }
}

// bank-transfer submission confirmation (see renderUpgradeToProRequestArea)
// so submitting doesn't leave a permanent "waiting..." note sitting in a
// popup the person then has to close themselves -- it tells them once,
// briefly, and gets out of the way.
function showToast(message, durationMs){
  document.querySelectorAll('.app-toast').forEach(el => el.remove());
  const el = document.createElement('div');
  el.className = 'app-toast';
  el.textContent = message;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 300);
  }, durationMs || 5000);
}

function renderUpgradeToProRequestArea(alreadyRequested, which){
  const area = document.getElementById('upgrade-pro-request-area');
  if(!area) return;
  if(alreadyRequested){
    area.innerHTML = `<div class="note" style="color:var(--teal);font-weight:600;">${t('Payment noted \u2014 waiting for the Super Admin to confirm it.')}</div>`;
    startBankTransferPolling();
    return;
  }
  stopBankTransferPolling();
  // A screenshot of the transfer is required, not optional -- that's
  // what Super Admin actually confirms the payment against (see the
  // per-boat Pro block in the admin dashboard). Submit stays disabled
  // until a file is attached.
  area.innerHTML = `
    <label style="margin-bottom:6px;">${t('Attach a screenshot of the transfer')}</label>
    <input type="file" accept="image/*" id="upgrade-pro-screenshot-input" style="margin-bottom:10px;">
    <button class="btn btn-primary" id="upgrade-pro-request-btn" style="width:100%;" disabled>${t('I\u2019ve Paid \u2014 Notify Admin')}</button>
  `;
  const fileInput = document.getElementById('upgrade-pro-screenshot-input');
  const submitBtn = document.getElementById('upgrade-pro-request-btn');
  fileInput.addEventListener('change', () => {
    submitBtn.disabled = !fileInput.files || !fileInput.files[0];
  });
  submitBtn.addEventListener('click', async () => {
    const file = fileInput.files && fileInput.files[0];
    if(!file){ themedAlert(t('Attach a screenshot of the transfer first.')); return; }
    submitBtn.disabled = true; submitBtn.textContent = t('Checking slip\u2026');
    const expectedAccount = (_proBankAccounts && _proBankAccounts[which]) ? _proBankAccounts[which].number : '';
    const check = await checkTransferSlip(file, {
      expectedBank: which,
      expectedAccountNumber: expectedAccount,
      // TEMP TEST VALUE -- change back to SWIPE_PRO_DISPLAY_AMOUNT (500) when done testing.
      expectedAmount: 1,
      referenceTime: _proTransferSelectedAt || Date.now(),
      windowMinutes: 15
    });
    if(!check.valid){
      showTransferSlipErrorPopup(check.reason, () => {
        renderUpgradeToProRequestArea(false, which);
      });
      return;
    }
    submitBtn.textContent = t('Notifying\u2026');
    try{
      const screenshot = await compressImageToDataUrl(file, 800, 0.55);
      await submitProRequest(screenshot);
      // Used to just toast "waiting for the Super Admin" and, only during
      // signup, re-render the Choose-a-Plan screen (Pro card now reading
      // "Continue with Free Version") -- leaving the person to notice that
      // and click it themselves. showProPendingReviewPopup() replaces
      // both: it states the same thing as an actual popup (easy to miss a
      // toast), and its own Continue button is what takes signup straight
      // into the boats page -- no extra click stuck on Choose-a-Plan. From
      // the normal in-app Upgrade-to-Pro popup (Settings, etc.) Continue
      // just closes it, same end result as before.
      closeUpgradeToProPopup();
      showProPendingReviewPopup();
    }catch(e){
      console.error('submitProRequest failed', e);
      submitBtn.disabled = false; submitBtn.textContent = t('I\u2019ve Paid \u2014 Notify Admin');
      themedAlert(t('Could not send that. Check your connection and try again.'));
    }
  });
}
