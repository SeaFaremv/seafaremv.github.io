      <h3>${t("Boat Routes")}</h3>
      <p class="sub" style="margin-bottom:12px;">${t("The routes this boat mainly ferries. Once set, picking an origin on the New Trip form fills in destinations and the loading location automatically.")}</p>
      <div id="routes-list">
        ${routes.length === 0 ? '<div class="empty">${t("No routes set up yet.")}</div>' : routes.map((r, idx) => `
          <div class="item-result-row" style="display:inline-flex;width:fit-content;max-width:100%;margin-bottom:6px;flex-wrap:wrap;">
            <span>${escapeHtml(r.origin)} \u2192 ${escapeHtml((r.destinations||[]).join(', '))}</span>
            <button class="btn btn-danger" data-del-route="${idx}" style="padding:6px 10px;font-size:calc(12px * var(--en-scale));">${t("Remove")}</button>
          </div>
        `).join('')}
      </div>
      ${(!isProAccount() && routes.length >= 1) ? `
        <div class="note" style="margin-top:12px;">${t('Free plan is limited to 1 route with 1 destination island. Upgrade to Pro to add more routes and destinations.')}</div>
        <button class="btn btn-amber" id="routes-upgrade-btn" style="width:100%;margin-top:10px;">${t('Upgrade to Pro')}</button>
      ` : `
        <div style="margin-top:12px;">
          <label>${t("Origin")}</label>
          <input type="text" id="route-origin-input" placeholder="${t("e.g. Male'")}">
          ${isProAccount() ? `
            <label>${t("Destinations (one per line)")}</label>
            <textarea id="route-dests-input" rows="2" placeholder="e.g. Maalhos&#10;Himandhoo&#10;Feridhoo"></textarea>
          ` : `
            <label>${t("Destination")}</label>
            <input type="text" id="route-dests-input" placeholder="${t("e.g. Maalhos")}">
            <div class="note" style="margin:4px 0 0;">${t('Free plan: 1 origin, 1 destination. Upgrade to Pro for multiple routes and destinations.')}</div>
          `}
          <label>${t("Loading location / jetty (optional)")}</label>
          <input type="text" id="route-location-input" placeholder="${t("e.g. Male' T-Jetty Area")}">
          <button class="btn btn-primary" id="add-route-btn" style="width:100%;">${t("+ Add Route")}</button>
        </div>
      `}
    </div>

    <div class="settings-block">
      <h3>${t('Island Locations (GPS Auto-Tracking)')}</h3>
      <p class="sub" style="margin-bottom:12px;">${t('Tap Open Google Maps, find the island and drop a pin on it, copy the coordinates there (tap the pin, then Copy), then paste them into the box below and tap Save. Once an island has a saved location, "Start GPS Tracking" on the Home screen can auto-mark a trip in transit when the boat moves 500m from its origin, and auto-detect which island it has arrived at.')}</p>
      <div id="island-coords-list">
        ${allIslandsForCoords.length === 0 ? `<div class="empty">${t('Add a boat route above first \u2014 islands to set locations for will show up here.')}</div>` : allIslandsForCoords.map(isl => {
          const c = islandCoords[isl];
          return `
            <div class="item-result-row" style="display:inline-flex;width:fit-content;max-width:100%;margin-bottom:6px;flex-wrap:wrap;align-items:flex-start;gap:8px;">

              ` : `
                <a class="btn btn-ghost" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(isl)}" target="_blank" rel="noopener" style="padding:8px 12px;font-size:calc(12px * var(--en-scale));text-decoration:none;">${t('\ud83d\udccd Open Google Maps')}</a>
                <div style="display:flex;gap:8px;width:100%;">
                  <input type="text" data-island-coord-input="${escapeHtml(isl)}" placeholder="${t('Paste Google Maps link or lat, lng')}" style="flex:1;min-width:0;margin-bottom:0;">
                  <button class="btn btn-primary" data-save-island-coord="${escapeHtml(isl)}" style="padding:8px 12px;font-size:calc(12px * var(--en-scale));flex-shrink:0;">${t('Save')}</button>
                </div>

        }).join('')}
      </div>
    </div>

    <div class="settings-block">
      <h3>${t("Trip Manifest File")}</h3>
      <p class="sub">${t("When a trip is marked in transit, a file listing every loaded shipment (sender, receiver, items, totals, and loading photos) is downloaded automatically to the phone of whoever marked it — owner or manager. Opens right in the browser. No setup needed.")}</p>
    </div>
  `;

  const byId = (id) => document.getElementById(id);

  byId('edit-trip-contacts-btn')?.addEventListener('click', () => { state.settingsEdit.tripContacts = true; renderTripSettings(); });
  byId('cancel-trip-contacts-btn')?.addEventListener('click', () => { state.settingsEdit.tripContacts = false; renderTripSettings(); });
  byId('save-trip-contacts-btn')?.addEventListener('click', async () => {
    const boatContacts = byId('trip-contacts-input').value.trim();
    await withFreshSettings(fresh => { fresh.tripDefaults = Object.assign({}, fresh.tripDefaults, { boatContacts }); });
    state.settingsEdit.tripContacts = false;
    renderTripSettings();
  });

  byId('edit-trip-tracking-btn')?.addEventListener('click', () => { state.settingsEdit.tripTracking = true; renderTripSettings(); });
  byId('cancel-trip-tracking-btn')?.addEventListener('click', () => { state.settingsEdit.tripTracking = false; renderTripSettings(); });
  byId('save-trip-tracking-btn')?.addEventListener('click', async () => {
    const trackingLink = byId('trip-tracking-input').value.trim();
    await withFreshSettings(fresh => { fresh.tripDefaults = Object.assign({}, fresh.tripDefaults, { trackingLink }); });
    state.settingsEdit.tripTracking = false;
    renderTripSettings();
  });

  byId('edit-trip-viber-btn')?.addEventListener('click', () => { state.settingsEdit.tripViber = true; renderTripSettings(); });
  byId('cancel-trip-viber-btn')?.addEventListener('click', () => { state.settingsEdit.tripViber = false; renderTripSettings(); });
  byId('save-trip-viber-btn')?.addEventListener('click', async () => {
    const viberLink = byId('trip-viber-input').value.trim();
    await withFreshSettings(fresh => { fresh.tripDefaults = Object.assign({}, fresh.tripDefaults, { viberLink }); });
    state.settingsEdit.tripViber = false;
    renderTripSettings();
  });

  byId('add-route-btn')?.addEventListener('click', async () => {
    const origin = byId('route-origin-input').value.trim();
    const destsInput = byId('route-dests-input');
    // Free plan renders a single-line input for this field instead of the
    // Pro textarea, so there's nothing to split on newlines there -- just
    // take the one value. Either way, non-Pro accounts are hard-capped at
    // one destination and one route total here too, not just hidden in
    // the UI, in case this ever gets called from somewhere that skipped
    // the render-time gating above.
    let destinations = destsInput.tagName === 'TEXTAREA'
      ? destsInput.value.split('\n').map(s=>s.trim()).filter(Boolean)
      : [destsInput.value.trim()].filter(Boolean);
    if(!isProAccount()){
      if((state.settings.routes||[]).length >= 1){ openProFeatureRequiredPopup(t('Adding more than one route or destination is a Pro feature. Upgrade to Pro to add more.')); return; }
      destinations = destinations.slice(0, 1);
    }
    const location = byId('route-location-input').value.trim();
    if(!origin || destinations.length === 0){ alert(t('Enter an origin and at least one destination.')); return; }
    await withFreshSettings(fresh => {
      fresh.routes = fresh.routes || [];
      fresh.routes.push({ origin, destinations, location });
    });
    renderTripSettings();
  });
  byId('routes-upgrade-btn')?.addEventListener('click', () => openProFeatureRequiredPopup(t('Adding more than one route or destination is a Pro feature. Upgrade to Pro to add more.')));
  document.querySelectorAll('[data-del-route]').forEach(b => b.addEventListener('click', async () => {
    const idx = parseInt(b.dataset.delRoute, 10);
    if(!confirm(t('Remove this route?'))) return;
    await withFreshSettings(fresh => {
      if(fresh.routes) fresh.routes.splice(idx, 1);
    });
    renderTripSettings();
  }));

  document.querySelectorAll('[data-save-island-coord]').forEach(b => b.addEventListener('click', async () => {
    const island = b.dataset.saveIslandCoord;
    const input = document.querySelector(`[data-island-coord-input="${CSS.escape(island)}"]`);
    const parsed = parseLatLngFromText(input ? input.value : '');
    if(!parsed){ alert(t('Could not find coordinates in that \u2014 paste a Google Maps link or a "lat, lng" pair.')); return; }
    await withFreshSettings(fresh => {
      fresh.islandCoords = fresh.islandCoords || {};
      fresh.islandCoords[island] = parsed;
    });
    renderTripSettings();
  }));
  document.querySelectorAll('[data-clear-island-coord]').forEach(b => b.addEventListener('click', async () => {
    const island = b.dataset.clearIslandCoord;
    await withFreshSettings(fresh => {
      if(fresh.islandCoords) delete fresh.islandCoords[island];
    });
    renderTripSettings();
  }));
}

async function loadGoogleSheetsStatus(){
  const el = document.getElementById('google-sheets-status');
  if(!el) return;
  try{
    const res = await fetch(`${API_BASE}/api/google/status?boatId=${encodeURIComponent(CURRENT_BOAT_ID)}`);
    const data = await res.json().catch(() => ({}));
    if(!document.getElementById('google-sheets-status')) return; // navigated away
    if(!data.configured){
      el.innerHTML = `<div class="empty">${t("This feature isn't set up on the server yet. Ask your developer to add Google API credentials.")}</div>`;
      return;
    }
    if(data.connected){
      el.innerHTML = `
        <div class="view-field"><span class="vf-value" style="font-family:'Inter',sans-serif;">${escapeHtml(data.email)}</span></div>
        <button class="btn btn-ghost" id="google-disconnect-btn" style="width:100%;margin-top:8px;">${t("Disconnect Google Account")}</button>
      `;
      document.getElementById('google-disconnect-btn').addEventListener('click', () => {
        if(!confirm(t('Disconnect this Google account? New trips will stop getting sheets until you reconnect.'))) return;
        fetch(`${API_BASE}/api/google/disconnect`, {
          method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ boatId: CURRENT_BOAT_ID })
        }).then(() => loadGoogleSheetsStatus());
      });
    } else {
      el.innerHTML = `<button class="btn btn-primary" id="google-connect-btn" style="width:100%;">${t("Connect Google Account")}</button>`;
      document.getElementById('google-connect-btn').addEventListener('click', async () => {
        const r = await fetch(`${API_BASE}/api/google/auth-url?boatId=${encodeURIComponent(CURRENT_BOAT_ID)}`);
        const d = await r.json().catch(() => ({}));
        if(d.url) location.href = d.url;
        else alert(t('Could not start Google connection. Try again.'));
      });
    }
  }catch(e){
    console.error('loadGoogleSheetsStatus failed', e);
    if(el) el.innerHTML = `<div class="empty">${t("Could not check Google connection status.")}</div>`;
  }
}

// Customers aren't a separate saved list -- they're derived live from every
// shipment ever logged for this boat, deduplicated by mobile number (the
// true unique identifier, since two different senders can share a name).
// This keeps the directory always in sync with real activity with no extra
// data entry or storage needed.
function renderCustomerDirectory(){
  const body = document.getElementById('settings-body');
  const routes = state.settings.routes || [];
  const routeIslands = new Set();
  routes.forEach(r => (r.destinations||[]).forEach(d => routeIslands.add(d)));
  (state.shipments||[]).forEach(s => { if(s.island) routeIslands.add(s.island); });
  const islands = Array.from(routeIslands).sort();
  const selectedIsland = state.customerDirectoryIsland || '';

  const byMobile = new Map();
  (state.shipments||[]).forEach(s => {
    if(selectedIsland && s.island !== selectedIsland) return;
    if(s.mobile && s.name){
      const key = s.mobile;
      if(!byMobile.has(key)) byMobile.set(key, { name: s.name, mobile: s.mobile, islands: new Set() });
      if(s.island) byMobile.get(key).islands.add(s.island);
    }
  });
  const customers = Array.from(byMobile.values()).sort((a,b) => a.name.localeCompare(b.name));

  body.innerHTML = `
    <div class="settings-block">
      <h3>${t("Customer Check-In Link")}</h3>
      <div class="url-box"><div><div class="tag-label">Put this on your QR code / share with customers</div><div class="u">${escapeHtml(baseUrl() + '#c/' + CURRENT_BOAT_ID)}</div></div></div>
      <div class="note">${t("This is what your senders and receivers use to check in cargo and track shipments for THIS boat specifically.")}</div>
      <div style="text-align:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:16px;margin-top:12px;">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=${encodeURIComponent(baseUrl() + '#c/' + CURRENT_BOAT_ID)}" alt="QR code for this boat's customer check-in link" width="220" height="220" style="max-width:100%;">
        <div class="note" style="margin-top:10px;">${t("Print this or display it on the boat -- customers scan it with their phone camera to check in cargo. Press and hold the image to save it to your phone.")}</div>
      </div>
    </div>

    <div class="settings-block">
      <h3>${t("Customers")}</h3>
      <p class="sub" style="margin-bottom:12px;">${t("Everyone who has sent cargo on this boat, one entry per mobile number (in case two senders share a name).")}</p>
      <label>${t("Filter by island")}</label>
      <select id="customer-island-filter" style="width:auto;min-width:160px;max-width:100%;">
        <option value="">All islands</option>
        ${islands.map(isl => `<option value="${escapeHtml(isl)}" ${selectedIsland===isl?'selected':''}>${escapeHtml(isl)}</option>`).join('')}
      </select>
      <div style="margin-top:14px;">
        ${customers.length === 0 ? '<div class="empty">${t("No customers yet.")}</div>' : customers.map(c => `
          <div class="item-result-row" style="display:inline-flex;width:fit-content;max-width:100%;margin-bottom:6px;">
            <span>${escapeHtml(c.name)} \u2014 ${escapeHtml(c.mobile)}</span>
            <span class="rprice">${escapeHtml(Array.from(c.islands).join(', '))}</span>
          </div>
        `).join('')}
      </div>
    </div>
  `;

  document.getElementById('customer-island-filter').addEventListener('change', (e) => {
    state.customerDirectoryIsland = e.target.value;
    renderCustomerDirectory();
  });
}

function closeRatesDownloadFormatPopup(){
  const overlay = document.getElementById('rates-download-format-overlay');
  if(overlay) unlockBodyScroll();
  overlay?.remove();
}
function openRatesDownloadFormatPopup(){
  closeRatesDownloadFormatPopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'rates-download-format-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:360px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">
        <h3 style="margin-bottom:2px;">${t("Download Item List")}</h3>
        <button type="button" class="btn btn-ghost" id="rates-download-format-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <p class="sub" style="margin-top:-6px;">${t("Choose a file format.")}</p>
      <button class="btn btn-primary" id="rates-download-json-btn" style="width:100%;margin-bottom:10px;">${t("Download as JSON")}</button>
      <button class="btn btn-primary" id="rates-download-xlsx-btn" style="width:100%;">${t("Download as Excel")}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeRatesDownloadFormatPopup(); });
  document.getElementById('rates-download-format-close-btn').addEventListener('click', closeRatesDownloadFormatPopup);
  document.getElementById('rates-download-json-btn').addEventListener('click', async () => {
    const boatName = _boatNameCache[CURRENT_BOAT_ID] || await getCurrentBoatName();
    const payload = JSON.stringify({ seafareRatesExport: true, boatName, exportedAt: new Date().toISOString(), rates: state.rates }, null, 2);
    const dataUrl = 'data:application/json;charset=utf-8,' + encodeURIComponent(payload);
    const filename = `seafare-rates-${(boatName||'boat').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.json`;
    downloadDataUrl(dataUrl, filename);
    closeRatesDownloadFormatPopup();
  });
  document.getElementById('rates-download-xlsx-btn').addEventListener('click', async () => {
    const btn = document.getElementById('rates-download-xlsx-btn');
    const boatName = _boatNameCache[CURRENT_BOAT_ID] || await getCurrentBoatName();
    btn.disabled = true; const originalLabel = btn.textContent; btn.textContent = t('Preparing\u2026');
    try{
      await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const ws = XLSX.utils.json_to_sheet(state.rates.map(r => ({ Name: r.name, Price: r.price })));
      ws['!cols'] = [{ wch: 36 }, { wch: 12 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Rates');
      const filename = `seafare-rates-${(boatName||'boat').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.xlsx`;
      XLSX.writeFile(wb, filename);
      closeRatesDownloadFormatPopup();
    }catch(e){
      console.error('rates xlsx export failed', e);
      alert(t("Could not create the Excel file. Check your connection and try again."));
      btn.disabled = false; btn.textContent = originalLabel;
    }
  });
}

function renderRatesSetup(){
  const body = document.getElementById('settings-body');
  body.innerHTML = `
    <div class="settings-block">
      <div style="margin-bottom:14px;">
        <div style="display:flex;gap:8px;margin-bottom:6px;">
          <button class="btn btn-ghost" id="download-rates-btn" style="flex:0 0 auto;padding:6px 12px;font-size:calc(11px * var(--en-scale));">${t("Download")}</button>
          <button class="btn btn-ghost" id="upload-rates-btn" style="flex:0 0 auto;padding:6px 12px;font-size:calc(11px * var(--en-scale));">${t("Upload List")}</button>
        </div>
        <input type="file" id="upload-rates-input" accept="application/json,.json,.xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" style="display:none;">
      </div>
      <h3>${t("Item Rates")}</h3>
      <p class="sub" style="margin-top:-6px;">${t("This list belongs to this boat only \u2014 other boats in your organization keep their own separate list and prices, even after you download/upload between them.")}</p>
      <div style="display:flex;gap:8px;align-items:flex-end;margin-bottom:16px;">
        <div style="flex:1;"><label>${t("New item name")}</label><input type="text" id="new-rate-name" style="margin-bottom:0;"></div>
        <div style="width:100px;"><label>${t("Price")}</label><input type="text" id="new-rate-price" style="margin-bottom:0;"></div>
        <button class="btn btn-ghost" id="add-rate-btn" style="height:44px;">${t("Add")}</button>
      </div>
      <div class="note" id="rates-transfer-note" style="display:none;"></div>
      <div id="rates-list"></div>
    </div>

    <div class="settings-block">
      <h3>${t("QR Link Override")}</h3>
      <label>${t("Public URL customers should scan (once published/hosted)")}</label>
      <input type="text" id="qr-url-input" placeholder="${t("https://yourdomain.com/cargo-log")}" value="${escapeHtml(state.settings.qrUrl)}">
      <button class="btn btn-primary" id="save-qr-btn">${t("Save Link")}</button>
      <div class="note">${t("Leave blank to just use this page's own address for the customer link shown above.")}</div>
    </div>
  `;

  // Items uploaded together carry an `uploadedAt` timestamp (set below,
  // persisted as part of the rate object itself -- not just local UI
  // state) so the "New Items Uploaded" grouping survives reloads and
  // naturally dissolves on its own: an item only counts as "new" while
  // Date.now() - uploadedAt is under a week. Nothing has to actively move
  // it back into the main list -- once a week has passed, the next render
  // just no longer sees it as new. Manually-added single items (via the
  // Add button below) never get this field, so they've always gone
  // straight into the regular list, same as before.
  const ONE_WEEK_MS = 7 * 24 * 60 * 60 * 1000;
  const isRecentlyUploaded = (r) => r.uploadedAt && (Date.now() - r.uploadedAt) < ONE_WEEK_MS;
  let newSectionCollapsed = false; // UI-only, resets each time this screen opens

  const renderRatesList = () => {
    const container = document.getElementById('rates-list');
    if(!state.rates.length){
      container.innerHTML = `<div class="empty" style="padding:16px 0;">${t("No items yet — add one above.")}</div>`;
      return;
    }
    const newItems = state.rates.filter(isRecentlyUploaded);
    const olderItems = state.rates.filter(r => !isRecentlyUploaded(r));
    const rowHtml = (r) => `
      <div class="rate-edit-row">
        <input type="text" data-rate-name="${r.id}" value="${escapeHtml(r.name)}" style="flex:1;">
        <input type="text" class="price-input" data-rate-price="${r.id}" value="${r.price}">
        <button class="btn btn-danger" data-rate-del="${r.id}" title="${t("Remove")}">\u00d7</button>
      </div>
    `;
    container.innerHTML = `
      <div class="rates-list-card">
        ${newItems.length ? `
          <div class="rates-section-label${newSectionCollapsed ? ' is-collapsed' : ''}" id="new-items-toggle">
            <span>${t('New Items Uploaded')} (${newItems.length})</span>
            <span class="rsl-chevron">\u25be</span>
          </div>
          ${newSectionCollapsed ? '' : newItems.map(rowHtml).join('')}
        ` : ''}
        ${olderItems.map(rowHtml).join('')}
      </div>
    `;
    if(newItems.length){
      document.getElementById('new-items-toggle').addEventListener('click', () => {
        newSectionCollapsed = !newSectionCollapsed;
        renderRatesList();
      });
    }
    const findIdx = (id) => state.rates.findIndex(r => r.id === id);
    document.querySelectorAll('[data-rate-name]').forEach(inp => inp.addEventListener('change', async () => {
      const idx = findIdx(inp.dataset.rateName);
      if(idx > -1){ state.rates[idx].name = inp.value; await saveRates(state.rates); }
    }));
    document.querySelectorAll('[data-rate-price]').forEach(inp => inp.addEventListener('change', async () => {
      const idx = findIdx(inp.dataset.ratePrice);
      if(idx > -1){ state.rates[idx].price = parseFloat(inp.value) || 0; await saveRates(state.rates); }
    }));
    document.querySelectorAll('[data-rate-del]').forEach(b => b.addEventListener('click', async () => {
      const idx = findIdx(b.dataset.rateDel);
      const item = state.rates[idx];
      if(!item) return;
      if(!confirm(`Remove "${item.name}" from the item list? This can't be undone.`)) return;
      state.rates.splice(idx,1);
      await saveRates(state.rates);
      renderRatesList();
    }));
  };
  renderRatesList();

  document.getElementById('download-rates-btn').addEventListener('click', () => {
    openRatesDownloadFormatPopup();
  });

  document.getElementById('upload-rates-btn').addEventListener('click', () => {
    document.getElementById('upload-rates-input').click();
  });
  document.getElementById('upload-rates-input').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = ''; // allow re-selecting the same file later
    if(!file) return;
    const noteEl = document.getElementById('rates-transfer-note');
    const isExcel = /\.xlsx?$/i.test(file.name) || file.type.includes('spreadsheet') || file.type.includes('ms-excel');
    try{
      let incoming = null;
      if(isExcel){
        await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: 'array' });
        const firstSheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(firstSheet, { defval: '' });
        // Accepts either "Name"/"Price" headers (as exported above) or
        // lowercase "name"/"price" -- so a sheet someone builds by hand
        // works the same as one round-tripped through Download (Excel).
        incoming = rows.map(row => ({
          name: row.Name ?? row.name ?? row.NAME ?? '',
          price: row.Price ?? row.price ?? row.PRICE ?? 0,
        }));
      } else {
        const text = await file.text();
        const parsed = JSON.parse(text);
        incoming = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.rates) ? parsed.rates : null);
      }
      if(!incoming) throw new Error('not a rates list');
      // Existing items are kept as-is -- uploaded items are added as new
      // entries on top, never replacing or overwriting what's already
      // here, so ids are always regenerated even if the file has its own.
      const cleaned = incoming
        .filter(r => r && typeof r.name === 'string' && r.name.trim())
        .map((r, i) => ({ id: `rate-${Date.now()}-${i}`, name: String(r.name).trim(), price: Number(r.price) || 0, uploadedAt: Date.now() }));
      if(!cleaned.length) throw new Error('empty list');
      state.rates = [...cleaned, ...state.rates];
      await saveRates(state.rates);
      renderRatesList();
      noteEl.style.display = 'block';
      noteEl.textContent = t("Added {n} new item(s) to this boat's list \u2014 your existing items were kept. Edit freely, it won't affect any other boat.").replace('{n}', cleaned.length);
    }catch(err){
      console.error('rates upload failed', err);
      noteEl.style.display = 'block';
      noteEl.textContent = t("Could not read that file -- make sure it's a rates list (JSON or Excel) with Name and Price columns.");
    }
  });

  document.getElementById('add-rate-btn').addEventListener('click', async () => {
    const name = document.getElementById('new-rate-name').value.trim();
    const price = parseFloat(document.getElementById('new-rate-price').value) || 0;
    if(!name) return;
    state.rates.push({id:'rate-'+Date.now(), name, price});
    await saveRates(state.rates);
    document.getElementById('new-rate-name').value=''; document.getElementById('new-rate-price').value='';
    renderRatesList();
  });

  document.getElementById('save-qr-btn').addEventListener('click', async () => {
    state.settings.qrUrl = document.getElementById('qr-url-input').value.trim();
    await saveSettings(state.settings);
    renderSettings();
  });
}

let lastRenderedTab = null;
function render(){
  renderLangToggle();
  updateHeaderProBadge();
  if(state.entryMode === 'internal' && !INTERNAL_ROLES.includes(state.role)){
    renderGate();
    return;
  }
  document.getElementById('gate-area').innerHTML = '';
  document.getElementById('gate-area').style.display = 'none';
  document.getElementById('tabs').style.display = 'flex';
  document.getElementById('panel').style.display = 'block';

  if(state.entryMode === 'customer'){ renderModeToggle(); }
  else { document.getElementById('mode-toggle').style.display = 'none'; }

  renderTabs();

  const allowed = getRoleTabs()[state.role].map(t => t.id);
  if(!allowed.includes(state.tab)) state.tab = DEFAULT_TAB[state.role];
  if(!(state.tab === 'settings' && state.settingsTab === 'reports')){ state.reportTripView = null; state.reportIslandView = null; }

  // Every time the Dashboard is freshly opened (not on every re-render
  // while already there, e.g. from polling) it lands on whichever island
  // the boat has actually arrived at, per the Trips tab's "Boat arrived
  // at" selection -- staff don't have to re-tap the island chip each time
  // they switch back in.
  if(state.tab === 'dashboard' && lastRenderedTab !== 'dashboard'){
    const arrived = activeTripArrivedIsland();
    if(arrived) state.dashIslandView = arrived;
  }
  if(state.tab !== lastRenderedTab){
    document.querySelector('.shell')?.style.setProperty('--tp', '0');
    document.querySelector('.shell')?.classList.remove('badge-tucked');
    const scrollable = document.getElementById('panel') || document.getElementById('gate-area');
    if(scrollable) scrollable.scrollTop = 0;
  }
  lastRenderedTab = state.tab;

  // Cash popup can be opened from Dashboard, Invoices, or Reports -- only
  // clean it up when navigating to some other tab entirely, not on every
  // render (which includes background polling refreshes while it's open).
  if(!['dashboard','invoices','reports'].includes(state.tab)){
    if(document.getElementById('cash-popup-overlay')) unlockBodyScroll();
    document.getElementById('cash-popup-overlay')?.remove();
  }

  if(state.tab !== 'dashboard'){
    // Same three overlays as above -- if the person switches tabs while
    // one is open (rather than closing it first), it was being yanked out
    // of the DOM directly here without ever going through its close
    // function, which is exactly what left the scroll lock stuck on and
    // caused the same page-jump bug through a second path.
    if(document.getElementById('load-modal-overlay') || document.getElementById('invoice-popup-overlay') || document.getElementById('deliver-other-popup-overlay')) unlockBodyScroll();
    document.getElementById('load-modal-overlay')?.remove();
    document.getElementById('invoice-popup-overlay')?.remove();
    document.getElementById('deliver-other-popup-overlay')?.remove();
  }
  if(state.tab !== 'dashboard'){
    if(document.getElementById('finish-trip-popup-overlay') || document.getElementById('dest-picker-popup-overlay')) unlockBodyScroll();
    document.getElementById('finish-trip-popup-overlay')?.remove();
    document.getElementById('dest-picker-popup-overlay')?.remove();
  }
  if(state.tab !== 'invoices'){
    if(document.getElementById('invoice-list-popup-overlay')) unlockBodyScroll();
    document.getElementById('invoice-list-popup-overlay')?.remove();
  }

  if(state.tab === 'dashboard'){ renderDashboard(); wireLoadFormEvents(); }
  else if(state.tab === 'checkin'){ renderCheckin(); }
  else if(state.tab === 'track'){ renderTrack(); }
  else if(state.tab === 'invoices'){ renderInvoices(); }
  else if(state.tab === 'shipments'){ renderShipmentsTab(); }
  else if(state.tab === 'settings'){ renderSettings(); }
}

const _origRenderDashboard = renderDashboard;
renderDashboard = function(){
  const scrollY = window.scrollY;
  _origRenderDashboard();
  wireLoadFormEvents();
  // Restoring a stale scrollY blindly is unsafe whenever the re-render
  // makes the page shorter than before (a form collapsing, a card
  // finishing and shrinking, etc.) -- the browser just leaves the
  // viewport wherever that position lands, which can be past the actual
  // content, looking like the top of the page got cut off. Clamping to
  // the real scrollable height after the re-render fixes that generally,
  // for any case like this rather than one at a time.
  const maxScroll = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  window.scrollTo(0, Math.min(scrollY, maxScroll));
};

async function openQrScanner(){
  loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js').catch(e => console.error('jsQR failed to load', e));
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:#000;z-index:2000;display:flex;flex-direction:column;';
  overlay.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;">
      <span style="color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;">${t("Scan Boat QR Code")}</span>
      <button id="qr-scan-close" style="background:rgba(255,255,255,0.12);border:none;color:#fff;font-size:calc(22px * var(--en-scale));line-height:1;cursor:pointer;padding:8px 14px;border-radius:8px;flex-shrink:0;">\u00d7</button>
    </div>
    <div style="flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;">
      <video id="qr-scan-video" autoplay playsinline muted style="max-width:100%;max-height:100%;"></video>
      <div style="position:absolute;width:70%;aspect-ratio:1;border:2px solid var(--teal-light);border-radius:12px;pointer-events:none;"></div>
    </div>
    <div id="qr-scan-status" style="color:rgba(255,255,255,0.75);text-align:center;padding:14px;font-size:calc(13.5px * var(--en-scale));">Point your camera at the boat's QR code.</div>
  `;
  document.body.appendChild(overlay);

  const video = overlay.querySelector('#qr-scan-video');
  const statusEl = overlay.querySelector('#qr-scan-status');
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  let stream = null;
  let stopped = false;

  const cleanup = () => {
    stopped = true;
    if(stream) stream.getTracks().forEach(t => t.stop());
    overlay.remove();
  };
  overlay.querySelector('#qr-scan-close').addEventListener('click', cleanup);

  const tick = () => {
    if(stopped) return;
    if(video.readyState === video.HAVE_ENOUGH_DATA){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = typeof jsQR === 'function' ? jsQR(imageData.data, imageData.width, imageData.height) : null;
      if(code && code.data){
        statusEl.textContent = t('Got it \u2014 opening...');
        try{
          const url = new URL(code.data, location.href);
          if(url.origin === location.origin){
            cleanup();
            location.hash = url.hash.replace('#','');
            return;
          }
        }catch(e){ /* not a valid URL, fall through */ }
        statusEl.textContent = t("That doesn't look like a SeaFare QR code. Try again.");
      }
    }
    requestAnimationFrame(tick);
  };

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(s => {
      stream = s;
      video.srcObject = s;
      requestAnimationFrame(tick);
    })
    .catch(() => {
      statusEl.textContent = t("Couldn't access the camera. Check your browser's camera permission for this site.");
    });
}

async function adminFetch(path, opts){
  opts = opts || {};
  const method = opts.method || 'GET';
  const creds = { username: state.adminUsername, passkey: state.adminPasskey };
  let url = `${API_BASE}${path}`;
  let body;
  if(method === 'GET'){
    url += (path.includes('?') ? '&' : '?') + `username=${encodeURIComponent(creds.username)}&passkey=${encodeURIComponent(creds.passkey)}`;
  } else {
    body = JSON.stringify(Object.assign({}, opts.body || {}, creds));
  }
  const res = await fetch(url, { method, headers:{'Content-Type':'application/json'}, body });
  const data = await res.json().catch(() => ({}));
  if(res.status === 401){ state.adminAuthed = false; clearAdminSession(); stopAdminNotificationPolling(); state.adminError = 'Session expired. Log in again.'; renderAdmin(); throw new Error('unauthorized'); }
  return data;
}

/* ---------------- Admin notification polling + banner ----------------
   There's no push-notification backend here -- no service worker, no
   Web Push subscriptions, nothing that could wake a fully closed browser
   or app. What this DOES cover: any device where the Super Admin is
   currently logged in with this tab open (foreground or backgrounded,
   not closed) gets checked every ~25s, and a genuinely new unread
   notification triggers both an in-page banner (always works) and a
   real OS-level Notification via the browser's Notification API (works
   on desktop and Android Chrome; iOS Safari only honors this inside an
   installed home-screen PWA, not a normal browser tab -- there's no way
   around that from here, it's a platform restriction). A real "wakes a
   closed app" push would need a service worker + Web Push backend this
   project doesn't have yet. */
let adminNotifPollTimer = null;
let adminKnownNotifIds = new Set();
let adminNotifPollPrimed = false;
let _adminBaseTitle = null;

function startAdminNotificationPolling(){
  if(adminNotifPollTimer) return;
  adminNotifPollPrimed = false;
  adminKnownNotifIds = new Set();
  if(typeof Notification !== 'undefined' && Notification.permission === 'default'){
    Notification.requestPermission().catch(() => {});
  }
  pollAdminNotificationsOnce();
  adminNotifPollTimer = setInterval(pollAdminNotificationsOnce, 25000);
}
function stopAdminNotificationPolling(){
  if(adminNotifPollTimer){ clearInterval(adminNotifPollTimer); adminNotifPollTimer = null; }
  updateAdminTabTitleBadge(0);
}
async function pollAdminNotificationsOnce(){
  if(!state.adminAuthed){ stopAdminNotificationPolling(); return; }
  let notifs;
  try{
    const data = await adminFetch('/api/admin/notifications');
    notifs = data.notifications || [];
  }catch(e){ console.error('admin notification poll failed', e); return; }
  state.adminNotifications = notifs;
  const unread = notifs.filter(n => !n.read);
  if(!adminNotifPollPrimed){
    // First check after logging in -- just learn what's already there
    // silently, so existing unread notifications don't all bannered at
    // once the moment admin signs in.
    notifs.forEach(n => adminKnownNotifIds.add(n.id));
    adminNotifPollPrimed = true;
  } else {
    const newOnes = unread.filter(n => !adminKnownNotifIds.has(n.id));
    notifs.forEach(n => adminKnownNotifIds.add(n.id));
    newOnes.forEach(n => showAdminNotificationBanner(n));
  }
  updateAdminTabTitleBadge(unread.length);
  if(document.getElementById('admin-body') && state.adminTab === 'notifications' && !state.adminOrgDetailId){
    renderAdminDashboard();
  }
}
// Jumps straight to whatever a notification is about, instead of just
// marking it read. 'organization' notifications (new signups, re-signups,
// new boats, Pro requests, Swipe payments) open that org's existing detail
// popup -- suspend/delete/Pro controls, all in one place. 'boat_request'
// notifications switch to the Boat Requests tab and highlight the specific
// pending request so it's obvious which one to act on, without having to
// scan the whole list. Older notifications from before this existed have no
// reference_type/reference_id -- those just fall back to staying on the
// Notifications tab, same as today.
function navigateToNotification(n){
  // A pro_request notification is specifically "an owner attached a
  // transfer slip, come review it" -- landing on the generic org popup
  // (see openAdminOrgPopup/renderAdminOrgProBlock, which only shows the
  // Pro status pill and Grant/Revoke buttons, never the screenshot) would
  // mean re-finding the request in the Pro Requests tab just to actually
  // see the slip. Opening it straight into openAdminProRequestPopup()
  // instead shows exactly what needs reviewing -- who requested it, from
  // which boat, and the attached screenshot -- with Grant right there.
  if(n.type === 'pro_request' && n.reference_id){
    state.adminTab = 'proRequests';
    renderAdminDashboard();
    (async () => {
      if(state.adminProRequests === null) await loadAdminProRequests();

/* ---------------- Web Push (real notifications on a closed/backgrounded
   device) ----------------
   This is the piece that can reach a device even when this tab isn't
   open at all -- unlike the polling above, which only works while the
   tab is alive. Needs three things on the backend before it does
   anything (see BACKEND-CHANGES-NEEDED.md for the exact contract):
     1. A VAPID keypair -- the public half goes in ADMIN_PUSH_VAPID_PUBLIC_KEY
        below, the private half stays server-side only.
     2. POST /api/admin/push-subscribe to store a subscription.
     3. The backend actually calling web-push's sendNotification() to
        every stored subscription at the same moment it creates a new
        admin notification (boat request, org signup, pro request, etc).
   Until all three exist, subscribeAdminToPush() below will register the
   service worker and ask for permission, but the subscription it POSTs
   has nowhere real to go yet -- that call is written against the
   endpoint contract in the spec doc, ready to work the moment the
   backend implements it. */
const ADMIN_PUSH_VAPID_PUBLIC_KEY = 'BOWeAWH_VWxCKgUB1gZDDWgTw27KWZqxGxndX45xxXPMio_9PIuFbdbY-_U2pZGveNblcWZWuZsyLWgj_axoqL0';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for(let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

async function subscribeAdminToPush(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    alert(t('Push notifications aren\u2019t supported in this browser.'));
    return false;
  }
  if(ADMIN_PUSH_VAPID_PUBLIC_KEY === 'REPLACE_WITH_YOUR_VAPID_PUBLIC_KEY'){
    console.warn('Web Push not configured yet -- see BACKEND-CHANGES-NEEDED.md');
    alert(t('Push notifications aren\u2019t set up on the server yet.'));
    return false;
  }
  try{
    const reg = await navigator.serviceWorker.register('/sw.js');
    const permission = await Notification.requestPermission();
    if(permission !== 'granted') return false;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(ADMIN_PUSH_VAPID_PUBLIC_KEY)
      });
    }
    await fetch(`${API_BASE}/api/admin/push-subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: state.adminUsername, passkey: state.adminPasskey, subscription: sub.toJSON() })
    });
    return true;
  }catch(e){
    console.error('subscribeAdminToPush failed', e);
    return false;
  }
}

// Whether THIS device already has an active push subscription -- checked
// (not assumed) on every visit to the Notifications tab, so the button
// reflects reality rather than reverting to "Enable" after a reload even
// though push is still on, or staying "Enabled" after the browser/OS
// revoked permission behind the app's back.
async function checkAdminPushSubscribed(){
  try{
    if(!('serviceWorker' in navigator) || !('PushManager' in window)) return false;
    const reg = await navigator.serviceWorker.getRegistration('/sw.js');
    if(!reg) return false;
    const sub = await reg.pushManager.getSubscription();
    return !!sub;
  }catch(e){ return false; }
}

// Counterpart to subscribeAdminToPush -- unsubscribes this device's
// browser-level subscription AND tells the server to drop the stored row,
// so it actually stops receiving pushes rather than just looking "off" in
// this tab while the server keeps sending to it.
async function unsubscribeAdminFromPush(){
  try{
    const reg = await navigator.serviceWorker.getRegistration('/sw.js');
    const sub = reg && await reg.pushManager.getSubscription();
    if(sub){
      const endpoint = sub.endpoint;
      await sub.unsubscribe();
      await fetch(`${API_BASE}/api/admin/push-unsubscribe`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: state.adminUsername, passkey: state.adminPasskey, endpoint })
      });
    }
    return true;
  }catch(e){
    console.error('unsubscribeAdminFromPush failed', e);
    return false;
  }
}

// Drop-in replacement for window.alert() -- same themed .panel backdrop
// as every other themed popup, so it follows dark/light mode instead of
// the browser's own unstylable native dialog chrome (a real
// alert()/confirm() can never pick up the app's theme, no matter what
// CSS says, since the OS draws it, not the page). No title bar -- most
// call sites are one-line notices, so this skips straight to the
// message rather than manufacturing a title for messages that never had
// one.
function themedAlert(message){
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `

      <p style="margin:0 0 16px;line-height:1.5;white-space:pre-line;">${escapeHtml(message)}</p>
      <button class="btn btn-primary" id="themed-alert-close" style="width:100%;">${t("OK")}</button>
    </div>
  `;
  document.body.appendChild(overlay);
  const close = () => overlay.remove();
  document.getElementById('themed-alert-close').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
}
// Drop-in replacement for window.confirm() -- same idea as themedAlert(),
// but since a themed popup can't block the script the way the native
// dialog does, every call site becomes `if(!(await themedConfirm(...)))
// return;` inside an async function instead of the old synchronous
// `if(!confirm(...)) return;`.
function themedConfirm(message){
  return new Promise((resolve) => {
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = `
      <div class="panel" style="max-width:360px;width:100%;">
        <p style="margin:0 0 16px;line-height:1.5;white-space:pre-line;">${escapeHtml(message)}</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-ghost" id="themed-confirm-cancel" style="flex:1;">${t("Cancel")}</button>
          <button class="btn btn-primary" id="themed-confirm-ok" style="flex:1;">${t("OK")}</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const finish = (result) => { overlay.remove(); resolve(result); };
    document.getElementById('themed-confirm-cancel').addEventListener('click', () => finish(false));
    document.getElementById('themed-confirm-ok').addEventListener('click', () => finish(true));
    overlay.addEventListener('click', (e) => { if(e.target === overlay) finish(false); });
  });
}

      </div>

  `;

      if(noteEl.value === DEFAULT_SUSPEND_NOTE) noteEl.value = '';

  const input = document.getElementById('admin-confirm-password');
  input.focus();
  const close = () => overlay.remove();
  document.getElementById('admin-confirm-cancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });

    `).join('')}
    <button class="btn btn-primary" id="as-notify-save-btn" style="width:100%;margin-top:4px;">Save Notification Preferences</button>
    <div id="as-notify-status" class="tag-meta" style="margin-top:6px;"></div>
  `;

    statusEl.textContent = 'Saving\u2026';

      if(!data.ok) throw new Error(data.error || 'Could not save.');
      // The password just changed -- this device's saved admin session

  document.getElementById('as-bank-save-btn').addEventListener('click', async () => {

    statusEl.textContent = 'Saving\u2026';

      statusEl.textContent = 'Saved.';
    }catch(e){
      console.error(e);
      statusEl.textContent = 'Could not save. Try again.';
    }
  });

// Simple case-insensitive "does this text contain the query" filter shared
// by every admin tab's search box below.
function adminMatchesSearch(query, ...fields){
  const q = (query || '').trim().toLowerCase();
  if(!q) return true;
  return fields.some(f => String(f || '').toLowerCase().includes(q));
}
const ADMIN_SEARCH_PLACEHOLDERS = {
  organizations: 'Search by boat name, owner, or mobile\u2026',
  requests: 'Search by boat name or owner\u2026',
  blocked: 'Search by name or mobile number\u2026',
  proRequests: 'Search by boat name or owner\u2026',
  proPayments: 'Search by boat name or owner\u2026',
};

      ));

      // suspend/delete), rather than swapping this list out in place.
      // Split into Pro / Free sections so the admin can see at a glance
      // which organizations are actually paying, rather than scanning a

      const isCurrentlyPro = (o) => o.is_pro && (!o.pro_expires_at || new Date(o.pro_expires_at).getTime() > Date.now());
      const orgCardHtml = (o) => `

          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div>
              <h3 style="margin-bottom:4px;">${escapeHtml(o.owner_name)} \u2192</h3>
              <p class="sub" style="margin-bottom:8px;">${escapeHtml(o.mobile || '')}</p>
            </div>
            <span class="status-pill ${o.status==='suspended'?'status-in_transit':'status-delivered'}">${escapeHtml(o.status)}</span>
          </div>
          ${o.priorDeletion ? `<div class="status-pill" style="background:var(--amber);color:#3a2600;margin-bottom:8px;display:inline-block;">\u26a0 Previously deleted \u2014 tap for details</div>` : ''}
          ${isCurrentlyPro(o) ? `<div class="status-pill status-delivered" style="margin-bottom:8px;display:inline-block;">Pro until ${escapeHtml(fmtDMY((o.pro_expires_at||'').slice(0,10)))}</div>` : ''}
          <div class="tag-label" style="font-size:calc(10.5px * var(--en-scale));text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;margin-bottom:4px;">Boats (${(o.boats||[]).length})</div>
          ${(o.boats||[]).length ? (o.boats||[]).map(b => `<div class="tag-meta" style="margin-bottom:2px;">\u2022 ${escapeHtml(b.name)}${b.is_primary?' (primary)':''} \u2014 ${escapeHtml(b.status)}</div>`).join('') : '<div class="tag-meta">${t("No boats yet.")}</div>'}
        </button>
      `;
      const sectionHtml = (label, list) => list.length ? `
        <div class="tag-label" style="font-size:calc(11px * var(--en-scale));text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);font-weight:700;margin:14px 0 6px;">${escapeHtml(label)} (${list.length})</div>
        ${list.map(orgCardHtml).join('')}
      ` : '';

      if(orgs.length === 0){
        body.innerHTML = `<div class="empty">${t("No organizations yet. This phase only manages data — owner self-signup comes in a later phase.")}</div>`;
      } else {
        const proOrgs = orgs.filter(isCurrentlyPro);
        const freeOrgs = orgs.filter(o => !isCurrentlyPro(o));
        body.innerHTML = sectionHtml('Pro', proOrgs) + sectionHtml('Free', freeOrgs);
      }

      body.querySelectorAll('[data-open-org]').forEach(btn => btn.addEventListener('click', () => {
        openAdminOrgPopup(btn.dataset.openOrg);
      }));
    })();
  } else if(state.adminTab === 'proRequests'){
    (async () => {
      if(state.adminProRequests === null) await loadAdminProRequests();
      if(!document.getElementById('admin-body')) return;
      const reqs = (state.adminProRequests || []).filter(r => adminMatchesSearch(state.adminSearchQuery, r.ownerName, r.orgBoatName, r.boatName));
      body.innerHTML = reqs.length === 0 ? `<div class="empty">No pending Pro requests.</div>` : reqs.map(r => `
        <div class="settings-block">
          <h3 style="margin-bottom:4px;">${escapeHtml(r.ownerName)} \u2014 ${escapeHtml(r.orgBoatName)}</h3>
          <p class="sub" style="margin-bottom:8px;">Requested from boat: ${escapeHtml(r.boatName)}${r.requestedAt ? ` \u00b7 ${fmtDate(r.requestedAt)}` : ''}</p>
          ${r.screenshot ? `<img src="${r.screenshot}" style="max-width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;">` : `<p class="sub" style="margin-bottom:10px;">No transfer slip attached.</p>`}
          <button class="btn btn-primary" style="width:100%;" data-pro-req-grant="${r.organizationId}" ${state.adminBusyId===r.organizationId?'disabled':''}>Grant Pro (30 days)</button>
        </div>
      `).join('');
      body.querySelectorAll('[data-pro-req-grant]').forEach(btn => btn.addEventListener('click', async () => {
        const orgId = btn.dataset.proReqGrant;
        confirmAdminAction('Grant Pro for this organization (30 days) \u2014 shared by every boat, owner, manager, and staff under it, and this clears the request', async () => {
          state.adminBusyId = orgId; renderAdminDashboard();
          try{ await adminApproveProForOrganization(orgId); }
          catch(e){ console.error(e); }
          state.adminBusyId = null; state.adminOrgs = null; state.adminProRequests = null;
          renderAdminDashboard();
        });
      }));
    })();
  } else if(state.adminTab === 'proPayments'){
    (async () => {
      if(state.adminProPayments === null) await loadAdminProPayments();
      if(!document.getElementById('admin-body')) return;
      const pays = (state.adminProPayments || []).filter(p => adminMatchesSearch(state.adminSearchQuery, p.owner_name, p.org_boat_name, p.boat_name));
      body.innerHTML = pays.length === 0 ? `<div class="empty">No card/Swipe payments yet.</div>` : pays.map(p => `
        <button type="button" class="settings-block" data-pro-payment-org="${p.organization_id}" style="display:block;width:100%;text-align:left;cursor:pointer;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div>
              <h3 style="margin-bottom:4px;">${escapeHtml(p.owner_name)} \u2014 ${escapeHtml(p.org_boat_name)}</h3>
              <p class="sub" style="margin-bottom:2px;">Paid from boat: ${escapeHtml(p.boat_name)}</p>
              <p class="tag-meta">${p.completed_at ? fmtDate(p.completed_at) : ''}${p.provider === 'redotpay' ? ' \u2014 via Crypto (RedotPay)' : ' \u2014 via Swipe'}</p>
            </div>
            <span class="status-pill status-delivered">${escapeHtml(p.currency)} ${escapeHtml(String(p.amount))}</span>
          </div>
        </button>
      `).join('');
      body.querySelectorAll('[data-pro-payment-org]').forEach(btn => btn.addEventListener('click', async () => {
        const orgId = btn.dataset.proPaymentOrg;
        if(state.adminOrgs === null) await loadAdminOrgs();
        openAdminOrgPopup(orgId);
      }));
    })();
  } else if(state.adminTab === 'blocked'){
    (async () => {
      if(state.adminBlockedNumbers === null) await loadAdminBlockedNumbers();
      if(!document.getElementById('admin-body')) return;
      const groups = (state.adminBlockedNumbers || []).filter(g => adminMatchesSearch(
        state.adminSearchQuery, g.boatName, g.ownerName, ...(g.numbers||[]).map(n => n.mobile)
      ));
      body.innerHTML = `<p class="sub" style="margin-bottom:10px;">${t("Every number tied to a suspended or deleted account, grouped by the name they signed up with. Tap one to see all of its boats' numbers.")}</p>` + (groups.length === 0 ? `<div class="empty">${t("No blocked users yet.")}</div>` : groups.map(g => {
        const activeCount = (g.numbers||[]).filter(n => n.status === 'blocked').length;
        return `
        <button type="button" class="settings-block" data-blocked-boat="${escapeHtml(g.boatName)}" data-blocked-owner="${escapeHtml(g.ownerName)}" style="display:block;width:100%;text-align:left;cursor:pointer;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
            <div>
              <h3 style="margin-bottom:4px;">${escapeHtml(g.boatName)} \u2192</h3>
              <p class="sub" style="margin-bottom:4px;">${escapeHtml(g.ownerName)}</p>
            </div>
            <span class="status-pill ${g.orgStatus==='suspended'?'status-in_transit':(g.orgStatus==='deleted'?'status-pending':'status-delivered')}">${escapeHtml(g.orgStatus || 'deleted')}</span>
          </div>
          <div class="tag-meta">${activeCount} ${t("number(s) currently blocked")}${g.dueAmount ? ` \u00b7 ${t("Due")}: ${escapeHtml(g.dueCurrency||'MVR')} ${escapeHtml(String(g.dueAmount))}` : ''}</div>
        </button>
      `; }).join(''));
      body.querySelectorAll('[data-blocked-boat]').forEach(btn => btn.addEventListener('click', () => {
        openBlockedGroupPopup(btn.dataset.blockedBoat, btn.dataset.blockedOwner);
      }));
    })();
  } else if(state.adminTab === 'requests'){
    (async () => {
      if(state.adminRequests === null) await loadAdminRequests();
      if(!document.getElementById('admin-body')) return;
      const reqs = (state.adminRequests || []).filter(r => adminMatchesSearch(state.adminSearchQuery, r.requested_boat_name, r.owner_name, r.org_boat_name));
      // A notification tap can land here wanting one specific request
      // called out (see navigateToNotification) -- give that card's
      // wrapper a data-hook and a highlight ring so it's obvious which one
      // to look at, instead of dropping the admin into an unmarked list.
      const highlightId = state.adminHighlightRequestId || null;
      body.innerHTML = reqs.length === 0 ? `<div class="empty">${t("No boat requests yet.")}</div>` : reqs.map(r => `
        <div class="settings-block" data-request-card="${r.id}" ${r.id === highlightId ? 'style="border-color:var(--teal);box-shadow:0 0 0 2px var(--teal);"' : ''}>
          <div style="display:flex;justify-content:space-between;align-items:flex-start;">
            <div>
              <h3 style="margin-bottom:4px;">${escapeHtml(r.requested_boat_name)}</h3>
              <p class="sub" style="margin-bottom:8px;">For ${escapeHtml(r.owner_name)} (${escapeHtml(r.org_boat_name)}) \u00b7 ${fmtDate(r.created_at)}</p>
            </div>
            <span class="status-pill ${r.status==='approved'?'status-delivered':r.status==='rejected'?'status-in_transit':''}">${escapeHtml(r.status)}</span>
          </div>
          ${r.payment_screenshot ? `<img src="${r.payment_screenshot}" style="max-width:100%;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;">` : `<p class="sub" style="margin-bottom:10px;">${t("No payment screenshot attached.")}</p>`}
          ${r.status === 'pending' ? `
            <div style="display:flex;gap:8px;">
              <button class="btn btn-primary" data-approve="${r.id}" ${state.adminBusyId===r.id?'disabled':''}>${t("Approve")}</button>
              <button class="btn btn-danger" data-reject="${r.id}" ${state.adminBusyId===r.id?'disabled':''}>${t("Reject")}</button>
            </div>
          ` : r.admin_note ? `<p class="sub">Note: ${escapeHtml(r.admin_note)}</p>` : ''}
        </div>
      `).join('');
      if(highlightId){
        // One-shot -- clears itself so the ring doesn't linger through
        // later re-renders of this tab (approve/reject, tab revisits, etc).
        state.adminHighlightRequestId = null;
        document.querySelector(`[data-request-card="${highlightId}"]`)?.scrollIntoView({ behavior:'smooth', block:'center' });
      }
      body.querySelectorAll('[data-approve]').forEach(b => b.addEventListener('click', async () => {
        const id = b.dataset.approve;
        const reqRow = (state.adminRequests||[]).find(r => r.id === id);
        if(reqRow && reqRow.payment_screenshot){
          const proceed = confirm('Approving will download the payment screenshot to this device, then permanently delete it from the database. Continue?');
          if(!proceed) return;
        }
        state.adminBusyId = id; renderAdminDashboard();
        try{
          const data = await adminFetch(`/api/admin/boat-requests/${id}/approve`, { method:'POST' });
          if(data && data.paymentScreenshot){
            downloadDataUrl(data.paymentScreenshot, `payment-slip-${(data.requestedBoatName||'boat').replace(/[^a-z0-9]+/gi,'-')}.jpg`);
          }
        }
        catch(e){ console.error(e); }
        state.adminBusyId = null; state.adminRequests = null; state.adminOrgs = null;
        renderAdminDashboard();
      }));
      body.querySelectorAll('[data-reject]').forEach(b => b.addEventListener('click', async () => {
        const note = prompt('Reason for rejecting (optional):') || '';
        state.adminBusyId = b.dataset.reject; renderAdminDashboard();
        try{ await adminFetch(`/api/admin/boat-requests/${b.dataset.reject}/reject`, { method:'POST', body:{ note } }); }
        catch(e){ console.error(e); }
        state.adminBusyId = null; state.adminRequests = null;
        renderAdminDashboard();
      }));
    })();
  } else if(state.adminTab === 'notifications'){
    (async () => {
      if(state.adminNotifications === null || state.adminNotifications === undefined) await loadAdminNotifications();
      if(state.adminPushSubscribed === null || state.adminPushSubscribed === undefined) state.adminPushSubscribed = await checkAdminPushSubscribed();
      if(!document.getElementById('admin-body')) return;
      const notes = state.adminNotifications || [];
      const unreadCount = notes.filter(n => !n.read).length;
      const typeLabels = { new_signup: 'New Signup', new_boat: 'New Boat', pending_request: 'Pending Request', resignup_after_deletion: '\u26a0 Re-signup After Deletion', pro_request: 'Pro Upgrade Requested', pro_paid_via_swipe: '\u2705 Paid via Swipe', pro_paid_via_redotpay: '\u2705 Paid via Crypto (RedotPay)' };
      body.innerHTML = `
        <button type="button" class="btn btn-ghost" id="admin-enable-push-btn" style="width:100%;margin-bottom:12px;">${state.adminPushSubscribed ? t('\u2713 Push Notifications Enabled \u2014 tap to disable') : t('\ud83d\udd14 Enable Push Notifications on This Device')}</button>
        ${unreadCount ? `<button type="button" class="btn btn-ghost" id="admin-notif-mark-all-btn" style="width:100%;margin-bottom:12px;">Mark all ${unreadCount} as read</button>` : ''}
        ${notes.length === 0 ? `<div class="empty">${t("No notifications yet.")}</div>` : notes.map(n => `
          <button type="button" class="settings-block" data-notif-id="${n.id}" style="display:block;width:100%;text-align:left;cursor:pointer;${n.read ? 'opacity:0.6;' : 'border-color:var(--teal);'}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
              <span class="tag-label" style="font-size:calc(10.5px * var(--en-scale));text-transform:uppercase;letter-spacing:0.05em;color:${n.type==='resignup_after_deletion' ? 'var(--red)' : 'var(--ink-soft)'};font-weight:700;">${escapeHtml(typeLabels[n.type] || n.type)}</span>
              ${!n.read ? `<span class="status-pill" style="background:var(--teal);color:#fff;">New</span>` : ''}
            </div>
            <p class="sub" style="margin-top:4px;margin-bottom:2px;">${escapeHtml(n.message)}</p>
            <div class="tag-meta">${escapeHtml(String(n.created_at).slice(0,16).replace('T',' '))}</div>
          </button>
        `).join('')}
      `;
      document.getElementById('admin-enable-push-btn').addEventListener('click', async () => {
        const btn = document.getElementById('admin-enable-push-btn');
        btn.disabled = true;
        if(state.adminPushSubscribed){
          btn.textContent = t('Disabling\u2026');
          const ok = await unsubscribeAdminFromPush();
          state.adminPushSubscribed = ok ? false : state.adminPushSubscribed;
        } else {
          btn.textContent = t('Enabling\u2026');
          const ok = await subscribeAdminToPush();
          state.adminPushSubscribed = ok ? true : state.adminPushSubscribed;
        }
        btn.disabled = false;
        btn.textContent = state.adminPushSubscribed ? t('\u2713 Push Notifications Enabled \u2014 tap to disable') : t('\ud83d\udd14 Enable Push Notifications on This Device');
      });
      document.getElementById('admin-notif-mark-all-btn')?.addEventListener('click', async () => {
        state.adminNotifications.forEach(n => n.read = true);
        renderAdminDashboard();
        try{ await adminFetch('/api/admin/notifications/read-all', { method:'POST' }); }catch(e){ console.error(e); }
      });
      body.querySelectorAll('[data-notif-id]').forEach(btn => btn.addEventListener('click', async () => {
        const n = state.adminNotifications.find(x => x.id === btn.dataset.notifId);
        if(!n) return;
        // Tapping a notification always takes you to what it's about, read
        // or not -- marking it read shouldn't be the only thing tapping
        // does, and it was previously a dead end once a notification had
        // already been read.
        const wasUnread = !n.read;
        n.read = true;
        navigateToNotification(n);
        if(wasUnread){
          try{ await adminFetch(`/api/admin/notifications/${btn.dataset.notifId}/read`, { method:'POST' }); }catch(e){ console.error(e); }
        }
      }));
    })();
  }
}

/* ---------------- Owner signup / org login (Phase 2) ---------------- */
function renderOrgArea(){
  hideNormalShell();
  document.body.classList.toggle('plan-choice-screen', !!(state.orgAuthed && state.showPlanChoice));
  if(state.orgAuthed){
    if(state.showPlanChoice){ renderChoosePlanScreen(); return; }
    renderOrgDashboard();
    return;
  }
  if(state.orgScreen === 'signup') renderSignupForm();
  else renderOrgLogin();
}

// Shown exactly once, right after a brand-new signup completes and before
// the org dashboard -- lets the owner see the Free vs Pro tiers side by
// side and either continue on Free (no action needed, the account is
// already created that way) or go straight into the existing Upgrade to
// Pro payment flow. Never shown again after this first pass (see the
// choose-plan-free-btn/choose-plan-pro-btn handlers below, both of which
// clear state.showPlanChoice), and never shown at all for org logins --
// only immediately after POST /api/signup succeeds sets this flag.
//
// The dark navy hero strip reuses the exact sailing-boat/wave motif from
// the very first screen a new owner sees (renderLandingPage) -- this is
// the other "first moment" in the same signup journey, so bringing that
// same visual back here ties the two together rather than introducing a
// new decoration. Below it, feature rows use a small filled check badge
// (teal for Free, amber for Pro) instead of plain bullets, so "included"
// is something you see, not just read.
function planCheckIcon(colorVar){
  return `
    <svg viewBox="0 0 20 20" width="18" height="18" fill="none">
      <circle cx="10" cy="10" r="10" fill="${colorVar}"/>
      <path d="M6 10.2l2.5 2.5L14 7.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  `;
}
// The Pro tier's feature list, shared between the Choose-a-Plan screen
// (renderChoosePlanScreen) and the Upgrade to Pro popup (openUpgradeToProPopup)
// so both places advertise exactly the same thing and only need updating once.
const PRO_PLAN_FEATURES = [
  'Add and manage up to 15 boats',
  'Make unlimited shipments',
  'Add up to 10 staff per boat',
  'Add up to 2 managers per boat',
  'Dhivehi language switch',
];
// Builds one plan tier card -- used both side-by-side (Free + Pro) on the
// Choose-a-Plan screen, and standalone (Pro only, no button) as the visual
// header of the Upgrade to Pro popup, so the "this is what Pro gets you"
// card looks identical everywhere it's shown in the app.
function planCard(opts){
  return `
    <div class="plan-card${opts.highlight ? ' pro' : ''}">
      ${opts.highlight ? `<div class="plan-ribbon">${t('Most Popular')}</div>` : ''}
      <div class="plan-tier-icon ${opts.highlight ? 'pro' : 'free'}">
        <svg viewBox="0 0 24 24" fill="none" stroke="${opts.highlight ? 'var(--amber)' : 'var(--teal)'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[opts.icon]}</svg>
      </div>
      <div class="plan-tier-name">${escapeHtml(opts.title)}</div>
      <div class="plan-tier-price">${opts.priceHtml}</div>
      <div class="plan-check-list">
        ${opts.points.map(p => `<div class="plan-check-row">${planCheckIcon(opts.highlight ? 'var(--amber)' : 'var(--teal)')}<span>${escapeHtml(p)}</span></div>`).join('')}
      </div>
      ${opts.btnId ? `<button class="btn ${opts.highlight ? 'btn-amber' : 'btn-ghost'}" id="${opts.btnId}" style="width:100%;">${escapeHtml(opts.btnLabel)}</button>` : ''}
    </div>
  `;
}
function renderChoosePlanScreen(){
  const area = document.getElementById('gate-area');
  // Once a bank-transfer request has actually been submitted, picking
  // "Pro" again would just reopen the same payment popup with nothing
  // new to do -- there's nothing left to submit until the Super Admin
  // confirms it. The Pro card's button reflects that: it becomes
  // "Continue with Free Version" so the person isn't stuck on this
  // screen waiting -- they can go use the app under Free right away
  // (see the pro-card click handler below) while the request sits
  // pending in the background. See renderUpgradeToProRequestArea(), the
  // moment this flips to true, and showToast() there, which is what
  // brings them back to this (re-rendered) screen right after
  // submitting.
  const proPending = !!(state.settings && state.settings.proRequestPending);
  area.innerHTML = `
    <div style="max-width:680px;margin:0 auto;padding:20px 16px 60px;">
      <div class="panel plan-panel">
        <div class="plan-hero">
          <div class="plan-hero-waves"></div>
          <svg class="plan-hero-boat" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 17l1.5-6h15L21 17"/><path d="M5 17v2a1 1 0 001 1h12a1 1 0 001-1v-2"/><path d="M12 3v8"/><path d="M8 6l4-3 4 3"/>
          </svg>
        </div>
        <div class="plan-body">
          <div class="plan-heading">${t('Choose a Plan')}</div>
          <p class="sub">${t('You can upgrade to Pro anytime later from Settings.')}</p>
          <div class="plan-cards">
            ${planCard({
              title: t('Free'), priceHtml: t('Free'), icon: 'box', highlight: false,
              points: [
                t('1 boat'),
                t('Up to 500 shipments total'),
                t('Up to 2 staff'),
                t('No managers'),
              ],
              btnId: 'choose-plan-free-btn', btnLabel: t('Continue with Free'),
            })}
            ${planCard({
              title: t('Pro'), priceHtml: `<strong>\u0783500</strong> / ${t('mo')}`, icon: 'crown', highlight: true,
              points: PRO_PLAN_FEATURES.map(p => t(p)),
              btnId: 'choose-plan-pro-btn', btnLabel: proPending ? t('Continue with Free Version') : t('Continue with Pro'),
            })}
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('choose-plan-free-btn').addEventListener('click', () => {
    state.showPlanChoice = false;
    renderOrgArea();
  });
  document.getElementById('choose-plan-pro-btn').addEventListener('click', () => {
    if(proPending){
      // Already requested and waiting on the Super Admin -- same "go use
      // the app" action as the Free card, just reached via the Pro card
      // since that's the one they actually picked.
      state.showPlanChoice = false;
      renderOrgArea();
      return;
    }
    // Deliberately doesn't set state.showPlanChoice = false or call
    // renderOrgArea() here (unlike the Free button above) -- this screen
    // stays put underneath the popup, so if they submit a request the
    // Pro card above is right there to re-render with its new label
    // rather than needing to be reconstructed from scratch.
    openUpgradeToProPopup();
  });
}

function orgBackToStart(){
  state.entryMode = 'customer'; state.role = null;
  state.signupOtpSentTo = null; state.signupOtpVerifiedMobile = null; state.signupOtpCooldownUntil = 0; state.signupOtpUnavailable = false;
  state.signupEmailOtpSentTo = null; state.signupEmailOtpVerifiedEmail = null; state.signupEmailOtpCooldownUntil = 0; state.signupEmailOtpUnavailable = false;
  location.hash = '';
  handleHash();
}

        <button class="btn btn-primary" id="su-submit-btn" style="width:100%;margin:10px 0;">${t("Sign Up")}</button>
