/* ---------------- Super Admin side of Pro: grant/renew ----------------
   Pro lives on the organizations table and is granted/revoked through
   the dedicated admin endpoints below, not by reading/writing a boat's
   own settings JSON. */
// Grants/revokes Pro for the whole organization -- shared by every boat,
// owner, manager, and staff under it (see the GET /api/data/:boatId/settings
// merge on the server). These call the dedicated admin endpoints rather
// than mutating a boat's own settings JSON, since Pro now lives on the
// organizations table.
// Server-side, POST /api/admin/organizations/:orgId/pro/grant must, for
// every boat under this organization with a pending request: set
// isPro=true (org-wide) and, on that specific requesting boat's own
// settings record, clear proRequestPending, proRequestedAt, AND
// proRequestScreenshot (the actual transfer-slip image bytes/base64) --
// not just flip the pending flag. The screenshot is only ever needed for
// the review that just happened; once granted there's no reason to keep
// a payment slip image sitting in the database indefinitely. Frontend
// already reflects this by nulling out its own cached copies
// (state.adminOrgs/state.adminProRequests) right after this call
// resolves -- see wireAdminOrgProButtons() and the Grant button handlers
// in the Pro Requests tab / openAdminProRequestPopup() -- but the actual
// deletion has to happen here, server-side, since that's where the row
// lives.
async function adminApproveProForOrganization(orgId){
  const data = await adminFetch(`/api/admin/organizations/${orgId}/pro/grant`, { method: 'POST' });
  if(!data.ok) throw new Error(data.error || `Failed to grant Pro for organization ${orgId}`);
  return data.organization;
}
async function adminRevokeProForOrganization(orgId){
  const data = await adminFetch(`/api/admin/organizations/${orgId}/pro/revoke`, { method: 'POST' });
  if(!data.ok) throw new Error(data.error || `Failed to revoke Pro for organization ${orgId}`);
  return data.organization;
}

function isTripFinished(tripId){
  if(!tripId) return false;
  const t = (state.trips||[]).find(x => x.id === tripId);
  return !!(t && t.finished);
}

// Proof-of-delivery photos are only useful for a short window after
// delivery -- long enough to catch and correct a wrong "delivered" tap,
// not indefinitely. Clears the photo (keeping everything else about the
// shipment intact) once 6 days have passed since deliveredAt. If the
// owner undoes the delivery within that window (Mark as Undelivered),
// deliveredAt gets cleared too, which cancels this entirely -- the photo
// only ever gets cleared for something that's genuinely still marked
// delivered 6+ days later. The photo itself stays encrypted at rest (see
// server.js) for the full 6 days regardless of whether it's currently
// being shown anywhere -- see photoLinkHtml, which hides it from view
// the moment a shipment is marked delivered, well before this deletes it.
const DELIVERY_PHOTO_RETENTION_MS = 6 * 24 * 60 * 60 * 1000;
async function cleanupExpiredDeliveryPhotos(){
  const now = Date.now();
  const expiredIds = new Set(
    state.shipments
      .filter(s => s.status === 'delivered' && s.photo && s.deliveredAt && (now - new Date(s.deliveredAt).getTime()) > DELIVERY_PHOTO_RETENTION_MS)
      .map(s => s.id)
  );
  if(expiredIds.size === 0) return;
  await withFreshShipments(list => {
    list.forEach(s => {
      if(expiredIds.has(s.id) && s.status === 'delivered' && s.photo){
        delete s.photo; s.imageArchived = true;
      }
    });
  });
}

// Once a shipment is BOTH delivered and paid, there's nothing left to do
// with it -- no follow-up needed, no payment to chase. Keeping the full
// record (photo already long gone by the 3-hour rule, but names, mobile
// numbers, item lists) forever adds up for a boat running for years. 12
// hours after both delivered and paid are true gives the owner/manager a
// real window to catch a mistake with the undo buttons in the invoice
// popup (which clear paid/delivered and so remove it from this list
// entirely) before the record is folded into that month's compact
// summary and removed for good.
//
// Runs as three separate steps rather than one big shipments+settings
// save, specifically to avoid double-counting revenue if this gets
// interrupted partway (e.g. a save fails, or two devices run cleanup at
// close to the same time): a shipment is marked foldedIntoReport in the
// live list FIRST (so a retry never re-counts it), only THEN added to the
// monthly aggregate, and only removed from the live list as a final step
// once its revenue is safely recorded elsewhere. Worst case on a failure
// partway through is a shipment sitting around marked-but-not-yet-removed
// a little longer -- never lost, never double-counted.
const COMPLETED_SHIPMENT_RETENTION_MS = 12 * 60 * 60 * 1000;
function monthKeyFor(dateStr){
  const d = dateStr ? new Date(dateStr) : new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}
async function cleanupCompletedShipments(){
  const now = Date.now();
  const isDueForCleanup = (s) => {
    if(s.status !== 'delivered' || !s.paid || s.foldedIntoReport) return false;
    const deliveredMs = s.deliveredAt ? new Date(s.deliveredAt).getTime() : 0;
    const paidMs = s.paidAt ? new Date(s.paidAt).getTime() : 0;
    const completedAt = Math.max(deliveredMs, paidMs);
    return completedAt > 0 && (now - completedAt) > COMPLETED_SHIPMENT_RETENTION_MS;
  };

  // Step 1: mark candidates, computing their monthly contribution from
  // this same fresh copy so nothing changes underneath us between here
  // and step 2.
  let contributions = null;
  await withFreshShipments(list => {
    const due = list.filter(isDueForCleanup);
    if(due.length === 0) return;
    contributions = {};
    due.forEach(s => {
      const key = monthKeyFor(s.loadedAt || s.createdAt);
      if(!contributions[key]) contributions[key] = { revenue: 0, shipmentCount: 0, byIsland: {} };
      const bucket = contributions[key];
      bucket.revenue += (s.total || 0);
      bucket.shipmentCount += 1;
      bucket.byIsland[s.island] = bucket.byIsland[s.island] || { count: 0, revenue: 0 };
      bucket.byIsland[s.island].count += 1;
      bucket.byIsland[s.island].revenue += (s.total || 0);
      s.foldedIntoReport = true;
    });
  });
  if(!contributions) return;

  // Step 2: fold into the compact per-month aggregate.
  await withFreshSettings(fresh => {
    const reports = fresh.monthlyReports || (fresh.monthlyReports = {});
    Object.keys(contributions).forEach(key => {
      const c = contributions[key];
      const existing = reports[key] || { revenue: 0, shipmentCount: 0, byIsland: {} };
      existing.revenue += c.revenue;
      existing.shipmentCount += c.shipmentCount;
      Object.keys(c.byIsland).forEach(isl => {
        const e = existing.byIsland[isl] || { count: 0, revenue: 0 };
        e.count += c.byIsland[isl].count;
        e.revenue += c.byIsland[isl].revenue;
        existing.byIsland[isl] = e;
      });
      reports[key] = existing;
    });
  });

  // Step 3: safe to remove now -- their revenue is recorded.
  await withFreshShipments(list => {
    const remaining = list.filter(s => !s.foldedIntoReport);
    list.length = 0;
    list.push(...remaining);
  });
}

async function finishTrip(tripId){
  let trip;
  await withFreshTrips(list => {
    const t = list.find(x => x.id === tripId);
    if(t){ t.finished = true; t.finishedAt = new Date().toISOString(); trip = t; }
  });
  // Shipments that stayed 'pending' (checked in, but never actually
  // loaded onto the boat) are dropped entirely at this point -- they
  // never became real cargo on this trip, so there's nothing to report as
  // undelivered and no reason to keep the placeholder around.
  //
  // Delivered shipments' photos are NOT cleared here anymore -- that's now
  // handled by a 3-hour-after-delivery timer (see
  // cleanupExpiredDeliveryPhotos) regardless of whether the trip has
  // finished, which gives the owner a real window to catch and undo a
  // wrong "delivered" tap even after the trip itself has ended.
  await withFreshShipments(list => {
    const remaining = list.filter(s => !(s.tripId === tripId && s.status === 'pending'));
    list.length = 0;
    list.push(...remaining);
  });
  if(trip) finalizeGoogleSheetForTrip(trip);
}

async function markDelivered(id){
  const existing = state.shipments.find(x => x.id === id);
  if(!shipmentTripHasArrived(existing)){
    alert(t("Can't mark this delivered yet \u2014 the boat hasn't arrived at any destination island for this trip."));
    return;
  }
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'delivered'; s.deliveredAt = new Date().toISOString();
    // Photo is kept for now -- it's only cleaned up once the trip itself is
    // marked finished (see finishTrip), not the moment an individual
    // shipment is delivered mid-trip.
  });
  syncShipmentToSheet(state.shipments.find(x => x.id === id));
  renderDashboard();
  maybePromptMarkPaidAfterDelivery(id);
}

    openCashPopup(shipmentId);
  });
  document.getElementById('mark-paid-prompt-transfer').addEventListener('click', async () => {
    const btn = document.getElementById('mark-paid-prompt-transfer');
    btn.disabled = true; btn.textContent = t('Confirming\u2026');
    await withFreshShipments(list => {
      const fresh = list.find(x => x.id === shipmentId);
      if(fresh){ fresh.paid = true; fresh.paymentMethod = 'transfer'; fresh.paidAt = new Date().toISOString(); }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    close();
    refreshAfterCashPopup();
  });
}

// Off-island delivery -- keeps s.island as the originally registered
// destination (for accounting/records), but records where it actually got
// handed over, why, and to whom. The originally registered receiver's
// details are left untouched; the manually-entered name/mobile go in
// separate fields so both are preserved.
async function markDeliveredOffIsland(id, { island, note, receiverName, receiverMobile }){
  const existing = state.shipments.find(x => x.id === id);
  if(!shipmentTripHasArrived(existing)){
    alert(t("Can't mark this delivered yet \u2014 the boat hasn't arrived at any destination island for this trip."));
    return;
  }
  await withFreshShipments(list => {
    const s = list.find(x => x.id === id);
    if(!s) return;
    s.status = 'delivered'; s.deliveredAt = new Date().toISOString();
    s.deliveredIsland = island;
    s.deliveryNote = note;
    s.actualReceiverName = receiverName;
    s.actualReceiverMobile = receiverMobile;
  });
  syncShipmentToSheet(state.shipments.find(x => x.id === id));
  // Off-island deliveries are typically done by browsing away from the
  // pinned "arrived" island to find the shipment elsewhere -- once it's
  // handed over, snap the Dashboard back to the boat's actual arrived
  // island instead of leaving it stranded on the island just browsed to.
  const arrived = activeTripArrivedIsland();
  if(arrived) state.dashIslandView = arrived;
  renderDashboard();
  maybePromptMarkPaidAfterDelivery(id);
}

      <label>${t("Receiver's mobile number")}</label>
      <input type="tel" id="f-rmobile" required>
      <label>${t("Cargo note (optional)")}</label>
      <textarea id="f-note" rows="2" placeholder="${t("e.g. 3 sacks of rice, fragile")}"></textarea>
      <button type="submit" class="btn btn-primary">${t("Submit Check-In")}</button>
    </form>

  const otherEl = document.getElementById('f-island-other');
  if(selectEl){
    selectEl.addEventListener('change', () => {
      if(selectEl.value === '__other'){ otherEl.style.display = 'block'; otherEl.required = true; }
      else { otherEl.style.display = 'none'; otherEl.required = false; otherEl.value=''; }
      runReceiverAutofillForIsland('f-mobile', 'f-island-select', 'f-island-other', 'f-rname', 'f-rmobile');
    });
  }
  otherEl.addEventListener('blur', () => {
    runReceiverAutofillForIsland('f-mobile', 'f-island-select', 'f-island-other', 'f-rname', 'f-rmobile');
  });

  document.getElementById('f-mobile').addEventListener('blur', () => {
    runReceiverAutofillForIsland('f-mobile', 'f-island-select', 'f-island-other', 'f-rname', 'f-rmobile');
  });
  wireReceiverAutofill('f-mobile', 'f-rname', 'f-rmobile', 'f-rname-suggestions');
  const checkSenderMobile = wireMobileValidation('f-mobile');
  const checkReceiverMobile = wireMobileValidation('f-rmobile');

  document.getElementById('checkin-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('f-name').value.trim();
    const mobile = document.getElementById('f-mobile').value.trim();
    const island = selectEl && selectEl.value && selectEl.value !== '__other' ? selectEl.value : (document.getElementById('f-island-other').value||'').trim();

    const receiverMobile = document.getElementById('f-rmobile').value.trim();
    const note = document.getElementById('f-note').value.trim();
    if(!name || !mobile || !island || !receiverName || !receiverMobile) return;
    if(!checkSenderMobile() || !checkReceiverMobile()) return;

    const code = trackingCode();
    const shipment = { id: code, name, mobile, island, receiverName, receiverMobile, note, status:'pending', items:[], total:0, tripId: trip ? trip.id : null, createdAt: new Date().toISOString() };
    await withFreshShipments(list => { list.push(shipment); });
    syncShipmentToSheet(shipment);

    openTrackingCodePopup(code, receiverName);
    e.target.reset();
  });
}

// Shared everywhere a shipment status is shown to a customer or to
// owner/manager/staff (timeline, status pill, collapsed track rows) --
// pulled out so all of them translate from exactly one place.
function statusStepLabels(){
  return { pending:t('Checked In'), loaded:t('Loaded'), in_transit:t('In Transit'), delivered:t('Delivered') };
}
// Shared by the customer-facing full card below and the owner/manager/
// staff detail popup -- pulled out so both stay in sync automatically
// rather than maintaining two copies of the same markup.
function trackTimelineHtml(s){
  const steps = STATUS_STEPS;
  const idx = steps.indexOf(s.status);
  const dates = { pending: s.createdAt, loaded: s.loadedAt, in_transit: s.inTransitAt, delivered: s.deliveredAt };
  const labels = statusStepLabels();
  const tripEnded = isTripFinished(s.tripId) && s.status !== 'delivered';
  return steps.map((step,i) => {
    let label = labels[step];
    let redLabel = false;
    if(tripEnded && step === s.status){ label = t('Trip Ended'); redLabel = true; }
    if(tripEnded && step === 'delivered'){ label = t('Not Delivered'); redLabel = true; }
    const endedClass = (tripEnded && i <= idx) ? ' trip-ended' : '';
    return `
    <div class="tl-step ${i<=idx?'done':''}${endedClass}">
      <div class="tl-dot"></div>
      <div class="tl-label"${redLabel ? ' style="color:var(--red);"' : ''}>${label}</div>
      <div class="tl-date">${dates[step] ? fmtDate(dates[step]) : ''}</div>
    </div>
  `;
  }).join('');
}
function trackInvoiceHtml(s){
  if(!(s.items && s.items.length)) return '';
  return `
    <div class="invoice">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="display" style="font-size:calc(15px * var(--en-scale));color:var(--navy-deep);">${t('Invoice')} \u2014 ${s.id}</div>
        <button class="btn btn-ghost" data-share-image="${s.id}" style="padding:6px 12px;font-size:calc(11px * var(--en-scale));">${t("Share as Image")}</button>
      </div>
      <div class="tag-meta" style="margin-top:6px;">${t('Sender:')} ${escapeHtml(s.name)} \u00b7 ${telLink(s.mobile)} \u2192 ${escapeHtml(s.island)}</div>
      ${s.receiverName ? `<div class="tag-meta">${t('Receiver:')} ${escapeHtml(s.receiverName)} \u00b7 ${telLink(s.receiverMobile)}</div>` : ''}
      ${s.invoiceId ? `<div class="tag-meta">${t('Invoice')} ${s.invoiceId} \u00b7 <strong style="color:${s.paid?'#22A366':'#E5473B'}">${s.paid?t('Paid'):t('Unpaid')}</strong></div>` : ''}
      <table>
        <thead><tr><th>${t('Item')}</th><th class="num">Qty</th><th class="num">${t("Rate")}</th><th class="num">${t('Amount')}</th></tr></thead>
        <tbody>
          ${s.items.map(i => `<tr><td>${escapeHtml(i.name)}</td><td class="num">${i.qty}</td><td class="num">${fmtMoney(i.price)}</td><td class="num">${fmtMoney(i.qty*i.price)}</td></tr>`).join('')}

      </table>
      <div class="total-line"><span>${t('Total Due')}</span><span class="amt">${fmtMoney(s.total)}</span></div>
    </div>
  `;
}
function trackStatusPillHtml(s){
  const labels = statusStepLabels();
  const tripEnded = isTripFinished(s.tripId) && s.status !== 'delivered';
  return tripEnded
    ? `<span class="status-pill" style="background:var(--red);color:#fff;">${t('Trip Ended')}</span>`
    : `<span class="status-pill status-${s.status}">${labels[s.status]}</span>`;

// Collapsed summary row -- what owner/manager/staff see in the results

        <textarea id="trip-dests" rows="3" placeholder="${t("Fills in automatically once you pick an origin — edit if needed")}"></textarea>
        <div style="position:relative;margin-top:6px;margin-bottom:12px;">
          <input type="text" id="trip-dests-search" placeholder="${t("Type to search & add an island…")}" autocomplete="off">
          <div class="item-results" id="trip-dests-results" style="display:none;"></div>
        </div>
        <label>${t("Trip date")}</label>
        <input type="date" id="trip-date">
        <label>${t("Loading time")}</label>
        <input type="time" id="trip-loading">
        <label>${t("Estimated departure time")}</label>
        <input type="time" id="trip-departure">
        <label>${t("Loading location / jetty")}</label>
        <input type="text" id="trip-location" placeholder="${t("Fills in automatically once you pick an origin")}">
        ${hasDefaults ? `
          <div class="note">Boat contacts, tracking link, and Viber link are fixed and pulled in automatically from Owner Settings \u2014 <a href="#settings" style="color:var(--teal);font-weight:700;">edit them there</a> if they ever change.</div>
        ` : `
          <div class="note" style="border-color:var(--red);color:var(--red);">Boat contacts, tracking link, and Viber link aren't set yet \u2014 go to <a href="#settings" style="color:var(--red);font-weight:700;">Owner Settings</a> and add them first, or the announcement will show them blank.</div>
        `}
        <button class="btn btn-primary" id="create-trip-btn" style="margin-top:12px;">${t("Create Trip & Set Active")}</button>
      </div>
    `}
    <div id="trip-list" style="margin-top:20px;"></div>
  `;

  if(!ongoingTrip){
  if(boatRoutes.length > 0){
    document.getElementById('trip-origin').addEventListener('change', (e) => {
      const otherInput = document.getElementById('trip-origin-other');
      const otherWrap = document.getElementById('trip-origin-other-wrap');
      if(e.target.value === '__other'){
        otherWrap.style.display = '';
        otherInput.focus();
        return;
      }
      otherWrap.style.display = 'none';
      const rememberedLocations = state.settings.originLoadingLocations || {};
      const matchingRoutes = boatRoutes.filter(r => r.origin === e.target.value);
      if(matchingRoutes.length){
        // Known outbound route (e.g. Male' -> Maalhos, Himandhoo, Feridhoo)
        // -- fill in exactly as saved.
        const mergedDestinations = [...new Set(matchingRoutes.flatMap(r => r.destinations || []))];
        document.getElementById('trip-dests').value = mergedDestinations.join('\n');
        const routeWithLocation = matchingRoutes.find(r => r.location);
        document.getElementById('trip-location').value = routeWithLocation ? routeWithLocation.location : (rememberedLocations[e.target.value] || '');
      } else {
        // Origin is a destination-only island (e.g. Feridhoo, picked for a
        // return trip) -- there's no saved route to auto-fill from, so let
        // the owner pick which of the other known islands this return
        // trip stops at instead of leaving it blank. The loading location
        // still auto-fills here if this origin's been used before, even
        // without a full saved route.
        document.getElementById('trip-location').value = rememberedLocations[e.target.value] || '';
        openDestinationPickerPopup(e.target.value, allKnownIslands, boatRoutes);
      }
    });
  }

  // Same auto-fill as above, but for the free-text origin field -- used
  // either as the "Other" fallback within the dropdown, or as the only
  // origin field at all for a boat with no saved routes yet (the common
  // case early on). Fires on blur so it doesn't fight with typing, and
  // only fills in if the location field is still empty.
  const originOtherInput = document.getElementById('trip-origin-other');
  if(originOtherInput){
    originOtherInput.addEventListener('blur', () => {
      const typed = originOtherInput.value.trim();
      const locationField = document.getElementById('trip-location');
      const rememberedLocations = state.settings.originLoadingLocations || {};
      if(typed && locationField && !locationField.value.trim() && rememberedLocations[typed]){
        locationField.value = rememberedLocations[typed];
      }
    });
  }

  // Uses the themed island search popup (openIslandSearchPopup, wired
  // globally near the top of the script) instead of an inline dropdown --
  // gives the same atoll-grouped browse view and anchored-under-the-field
  // positioning as the New Trip form's other pickers.
  function wireIslandSearchDropdown(inputId, onPick, opts){
    const input = document.getElementById(inputId);
    if(!input) return;
    input.addEventListener('focus', () => openIslandSearchPopup(input, onPick, opts));
    input.addEventListener('input', () => { input._islandSearchRedraw && input._islandSearchRedraw(); });
    // Short delay so a tap on a result inside the popup (mousedown, below)
    // fires before this closes it -- standard pattern for this, works
    // reliably on touch.
    input.addEventListener('blur', () => {
      if(input._islandSearchScrollBlur){
        input._islandSearchScrollBlur = false;
        return; // scroll-triggered: just drop the keyboard, leave the list open
      }
      setTimeout(closeIslandSearchPopup, 150);
    });
  }
  wireIslandSearchDropdown('trip-origin-other', (islandName) => {
    const originSelect = document.getElementById('trip-origin');
    const otherInput = document.getElementById('trip-origin-other');
    if(originSelect){ originSelect.value = '__other'; }
    otherInput.value = islandName;
    otherInput.dispatchEvent(new Event('blur'));
    otherInput.blur();
  }, { closeOnPick: true });
  wireIslandSearchDropdown('trip-dests-search', (islandName) => {
    const destsField = document.getElementById('trip-dests');
    const existing = destsField.value.split('\n').map(s => s.trim()).filter(Boolean);
    if(!existing.includes(islandName)) existing.push(islandName);
    destsField.value = existing.join('\n');
    document.getElementById('trip-dests-search').value = '';
  }, { closeOnPick: true });

  document.getElementById('create-trip-btn').addEventListener('click', async () => {
    const originSelect = document.getElementById('trip-origin');
    const origin = (originSelect && originSelect.value !== '__other' ? originSelect.value : document.getElementById('trip-origin-other').value).trim();
    const destinations = document.getElementById('trip-dests').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const date = document.getElementById('trip-date').value;
    const loadingTime = document.getElementById('trip-loading').value;
    const departureTime = document.getElementById('trip-departure').value;
    const location = document.getElementById('trip-location').value.trim();
    const fresh = state.settings.tripDefaults || {};
    const boatContacts = fresh.boatContacts || '';
    const trackingLink = fresh.trackingLink || '';
    const viberLink = fresh.viberLink || '';
    if(!origin || destinations.length === 0 || !date){ alert(t('Origin, at least one destination, and a date are required.')); return; }
    // Both times are optional individually, but if both are set, loading
    // has to happen before departure -- the boat can't leave before it's
    // finished loading.
    if(loadingTime && departureTime && departureTime < loadingTime){
      alert(t('Departure time cannot be before loading time.'));
      return;
    }
    const trip = {id:'trip-'+Date.now(), origin, destinations, date, loadingTime, departureTime, location, boatContacts, trackingLink, viberLink, active:true, createdAt:new Date().toISOString()};
    await withFreshTrips(list => {
      list.forEach(t => t.active = false);
      list.push(trip);
    });
    // Remember this loading location against this origin, regardless of
    // whether it came from a saved route or was typed by hand -- so next
    // time this origin is picked (including return trips with no saved
    // route at all), it's already filled in.
    if(location){
      const updatedSettings = Object.assign({}, state.settings, {
        originLoadingLocations: Object.assign({}, state.settings.originLoadingLocations || {}, { [origin]: location })
      });
      state.settings = updatedSettings;
      saveSettings(updatedSettings);
    }
    renderDashboard();
    createGoogleSheetForTrip(trip);
  });
  } // end ongoingTrip guard

  const list = panel.querySelector('#trip-list');
  if(trips.length === 0){ list.innerHTML = `<div class="empty">${t("No trips planned yet.")}</div>`; return; }

  list.innerHTML = trips.map(t => {
    const loadedCount = state.shipments.filter(s => s.tripId === t.id && s.status === 'loaded').length;
    const tripShipments = state.shipments.filter(s => s.tripId === t.id);
    // 'pending' shipments were checked in but never actually loaded onto
    // the boat -- they aren't real cargo on this trip, so there's nothing
    // to warn about here (they're dropped entirely once the trip finishes,
    // see finishTrip).
    const undelivered = tripShipments.filter(s => s.status !== 'delivered' && s.status !== 'pending');
    const delivered = tripShipments.filter(s => s.status === 'delivered');
    const statusClass = t.finished ? 'status-delivered' : (t.departed ? 'status-in_transit' : (t.active?'status-delivered':'status-pending'));
    const statusLabel = t.finished ? 'Finished' : (t.departed ? 'In Transit' : (t.active?'Active':'Past'));
    return `
    <div class="tag">
      <div class="tag-top">
        <div>
          <div class="tag-code">${escapeHtml(t.origin)} \u2192 ${escapeHtml((t.destinations||[]).join(', '))}</div>
          <div class="tag-meta">${fmtDMY(t.date)} \u00b7 Load ${escapeHtml(t.loadingTime||'--:--')} \u00b7 Depart ${escapeHtml(t.departureTime||'--:--')}</div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <span class="status-pill ${statusClass}">${statusLabel}</span>
          ${t.arrivedIsland && !t.finished ? `<span class="status-pill status-arrived">Boat Arrived ${escapeHtml(t.arrivedIsland)}</span>` : ''}
        </div>
      </div>
      <div class="tag-meta">${escapeHtml(t.location||'')}</div>
      ${t.finished ? `<div class="tag-meta">${delivered.length} delivered \u00b7 ${undelivered.length} undelivered</div>` : ''}
      ${t.departed && !t.finished ? `
        <div style="margin-top:10px;">
          <label style="font-size:calc(11px * var(--en-scale));text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);display:block;margin-bottom:4px;">Boat arrived at</label>
          <select data-arrived-select="${t.id}">
            <option value="" ${!t.arrivedIsland ? 'selected' : ''}>Not arrived yet</option>
            ${(t.destinations||[]).map(isl => `<option value="${escapeHtml(isl)}" ${t.arrivedIsland===isl ? 'selected' : ''}>${escapeHtml(isl)}</option>`).join('')}
          </select>
        </div>
      ` : ''}
      <div class="tag-actions">
        ${!t.active && !t.finished ? `<button class="btn btn-amber" data-set-active="${t.id}">${t("Set Active")}</button>` : ''}
        ${t.active && !t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-transit="${t.id}">Mark In Transit (${loadedCount} loaded)</button>` : ''}
        ${t.departed && !t.finished ? `<button class="btn btn-primary" data-mark-finish="${t.id}">${t("Mark Trip Finished")}</button>` : ''}
        ${!t.finished ? `<button class="btn btn-ghost" data-copy-ann="${t.id}">${t("View & Copy Announcement")}</button>` : ''}
        <button class="btn btn-danger" data-del-trip="${t.id}">${t("Delete")}</button>
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-mark-transit]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm(t('Mark this trip in transit? Every loaded shipment on this trip will move to "In Transit" together, and a manifest file will be saved to this device.'))) return;
    const tripId = b.dataset.markTransit;
    const trip = (state.trips||[]).find(t => t.id === tripId);
    const tripShipments = state.shipments.filter(s => s.tripId === tripId);
    let moved;
    try{
      moved = await markTripInTransit(tripId);
    }catch(e){
      console.error('markTripInTransit failed', e);
      alert(t('Could not mark this trip in transit. Check your connection and try again.'));
      return;
    }
    if(trip) downloadTripManifest(trip, tripShipments);
    alert(t('Trip marked in transit. {count} shipment(s) updated.').replace('{count}', moved));
    renderTrips();
  }));

  list.querySelectorAll('[data-mark-finish]').forEach(b => b.addEventListener('click', () => {
    openFinishTripPopup(b.dataset.markFinish);
  }));

  list.querySelectorAll('[data-arrived-select]').forEach(sel => sel.addEventListener('change', () => {
    const tripId = sel.dataset.arrivedSelect;
    const island = sel.value || null;
    // Optimistic: apply the change locally and re-render immediately so it
    // feels instant, then persist safely (fetch-fresh + merge + save) in
    // the background. This is a simple find-by-id field update, so
    // applying it twice (once to the live state, once to the freshly
    // fetched copy inside withFreshTrips) is safe -- unlike an "add new
    // item" mutation, there's no risk of creating a duplicate.
    const localTrip = (state.trips || []).find(t => t.id === tripId);
    if(localTrip){ localTrip.arrivedIsland = island; localTrip.arrivedAt = island ? new Date().toISOString() : null; }
    state.dashIslandView = island;
    renderTrips();
    withFreshTrips(l => {
      const t = l.find(x => x.id === tripId);
      if(t){ t.arrivedIsland = island; t.arrivedAt = island ? new Date().toISOString() : null; }
    }).then(() => renderTrips());
  }));

  list.querySelectorAll('[data-set-active]').forEach(b => b.addEventListener('click', () => {
    const targetId = b.dataset.setActive;
    state.trips.forEach(t => t.active = (t.id === targetId));
    renderTrips();
    withFreshTrips(l => { l.forEach(t => t.active = (t.id === targetId)); }).then(() => renderTrips());
  }));
  list.querySelectorAll('[data-del-trip]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm(t('Delete this trip?'))) return;
    await withFreshTrips(l => { const i = l.findIndex(t => t.id === b.dataset.delTrip); if(i>-1) l.splice(i,1); });
    renderTrips();
  }));
  list.querySelectorAll('[data-copy-ann]').forEach(b => b.addEventListener('click', () => {
    openAnnouncementPopup(b.dataset.copyAnn);
  }));
}

/* ---------------- Invoices (owner only) ---------------- */
function renderShipmentsTab(){
  const panel = document.getElementById('panel');
  const all = state.shipments.filter(s => s.status !== 'pending');
  const delivered = all.filter(s => s.status === 'delivered');
  const undelivered = all.filter(s => s.status !== 'delivered');
  // Free plan soft cap: 500 shipments total, warning only -- logging still
  // works past this, it's just a nudge to upgrade. Only shown for
  // organizations actually subject to the plan limits (plan_limits_enabled,
  // set at signup) that are also not already Pro; existing/grandfathered
  // organizations never see this regardless of their shipment count.
  const nearFreeCap = state.settings.planLimitsEnabled && !state.settings.isPro && state.shipments.length >= 500;

  panel.innerHTML = `
    <h2>${t("Shipments")}</h2>
    <p class="sub">${t("Every shipment that's been loaded, whether or not it's been delivered or paid yet.")}</p>
    ${nearFreeCap ? `
      <div class="note" style="margin-bottom:16px;">
        ${t("You've reached the 500-shipment limit on the Free plan. You can keep logging shipments, but upgrading to Pro removes this limit entirely.")}
        <button class="btn btn-amber" id="shipments-cap-upgrade-btn" style="width:100%;margin-top:10px;">${t('Upgrade to Pro')}</button>
      </div>
    ` : ''}
    <div class="stat-grid">
      <button type="button" class="stat-card" id="delivered-stat-card" style="text-align:left;cursor:${delivered.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Delivered</div>
        <div class="sval" style="color:var(--green);">${delivered.length}</div>
      </button>
      <button type="button" class="stat-card" id="undelivered-stat-card" style="text-align:left;cursor:${undelivered.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Undelivered</div>
        <div class="sval" style="color:var(--red);">${undelivered.length}</div>
      </button>
    </div>
  `;
  document.getElementById('shipments-cap-upgrade-btn')?.addEventListener('click', () => openProFeatureRequiredPopup(t('Logging more than 500 shipments is a Pro feature. Upgrade to Pro to remove this limit.')));
  if(delivered.length){
    document.getElementById('delivered-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Delivered Shipments', delivered,
      () => ({ title: 'Delivered Shipments', list: state.shipments.filter(s => s.status !== 'pending' && s.status === 'delivered') })
    ));
  }
  if(undelivered.length){
    document.getElementById('undelivered-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Undelivered Shipments', undelivered,
      () => ({ title: 'Undelivered Shipments', list: state.shipments.filter(s => s.status !== 'pending' && s.status !== 'delivered') })
    ));
  }
}

async function renderInvoices(){
  const panel = document.getElementById('panel');

  // Backfill: older shipments may have items/total but never got an invoiceId
  // assigned (e.g. created before this feature existed) -- fix that once, here,
  // so nothing invoiced silently stays invisible on this page.
  let needsSave = false;
  state.shipments.forEach(s => {
    if(s.items && s.items.length && !s.invoiceId){ needsSave = true; }
  });
  if(needsSave){
    await withFreshShipments(list => {
      list.forEach(s => {
        if(s.items && s.items.length && !s.invoiceId){
          s.invoiceId = invoiceId();
          if(s.paid === undefined) s.paid = false;
        }
      });
    });
  }

  // The three summary stats cover every invoice ever generated, so the
  // numbers always add up (Total Invoiced = Paid + Unpaid) regardless of
  // whether the trip that carried them has since finished -- money owed
  // doesn't stop counting just because its trip moved to Reports. The
  // detailed list below stays focused on the current/active trip only,
  // matching "Invoices from finished trips move to Reports".
  const allInvoices = state.shipments.filter(s => s.invoiceId && !s.voided);
  const total = allInvoices.reduce((sum,s) => sum + (s.total||0), 0);
  const unpaid = allInvoices.filter(s => !s.paid);
  const paid = allInvoices.filter(s => s.paid);
  const sorted = state.shipments.filter(s => s.invoiceId && !isTripFinished(s.tripId)).sort((a,b) => new Date(b.loadedAt) - new Date(a.loadedAt));

  const unpaidTotal = unpaid.reduce((sum,s) => sum + (s.total||0), 0);
  const paidTotal = paid.reduce((sum,s) => sum + (s.total||0), 0);

  panel.innerHTML = `
    <h2>${t("Invoices")}</h2>
    <p class="sub">${t("Generated automatically when a shipment's items are logged. Invoices from finished trips move to Reports.")}</p>
    <div class="stat-grid">
      <div class="stat-card"><div class="slabel">Total Invoiced</div><div class="sval">${fmtMoney(total)}</div></div>
      <button type="button" class="stat-card" id="unpaid-stat-card" style="text-align:left;cursor:${unpaid.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Unpaid${unpaid.length ? ` (${unpaid.length})` : ''}</div>
        <div class="sval" style="color:var(--red);">${unpaid.length ? fmtMoney(unpaidTotal) : '0'}</div>
      </button>
      <button type="button" class="stat-card" id="paid-stat-card" style="text-align:left;cursor:${paid.length ? 'pointer' : 'default'};font:inherit;border:1.5px solid var(--line);">
        <div class="slabel">Paid${paid.length ? ` (${paid.length})` : ''}</div>
        <div class="sval" style="color:var(--green);">${paid.length ? fmtMoney(paidTotal) : '0'}</div>
      </button>
    </div>
    <div id="invoice-list"></div>
  `;

  if(unpaid.length){
    document.getElementById('unpaid-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Unpaid Invoices', unpaid,
      () => ({ title: 'Unpaid Invoices', list: state.shipments.filter(s => s.invoiceId && !s.voided && !s.paid) })
    ));
  }
  if(paid.length){
    document.getElementById('paid-stat-card').addEventListener('click', () => openInvoiceListPopup(
      'Paid Invoices', paid,
      () => ({ title: 'Paid Invoices', list: state.shipments.filter(s => s.invoiceId && !s.voided && s.paid) })
    ));
  }

  const list = panel.querySelector('#invoice-list');
  if(sorted.length === 0){ list.innerHTML = `<div class="empty">${t("No invoices yet.")}</div>`; return; }

  list.innerHTML = sorted.map(s => {
    return `
    <div class="tag" style="${s.voided ? 'opacity:0.5;' : ''}">
      <div class="tag-top">
        <div>
          <div class="tag-code">${s.invoiceId}</div>
          <div class="tag-meta">${escapeHtml(s.name)} \u00b7 to ${escapeHtml(s.island)}</div>
        </div>
        <span class="status-pill ${s.voided ? 'status-pending' : (s.paid ? 'status-delivered' : 'status-in_transit')}">${s.voided ? 'Voided' : (s.paid ? 'Paid \u2014 ' + (s.paymentMethod||'').toUpperCase() : 'Unpaid')}</span>
      </div>
      <div class="tag-meta">${fmtDate(s.loadedAt)}</div>
      <div class="total-line"><span>Total</span><span class="amt">${fmtMoney(s.total)}</span></div>
      <div class="tag-actions">
        <button class="btn btn-ghost" data-inv-print="${s.id}">${t("Share")}</button>
        ${!s.voided && !s.paid ? `
          <button class="btn btn-primary" data-cash-open="${s.id}">${t("Collect — Cash")}</button>
          <button class="btn btn-primary" data-inv-pay="${s.id}" data-method="transfer">${t("Collect \u2014 Transfer")}</button>
        ` : ''}
        ${!s.voided && s.paid ? `<button class="btn btn-ghost" data-inv-unpay="${s.id}">${t("Mark Unpaid")}</button>` : ''}
        ${!s.voided ? `<button class="btn btn-danger" data-inv-void="${s.id}">${t("Void")}</button>` : ''}
      </div>
    </div>
  `;
  }).join('');

  list.querySelectorAll('[data-inv-print]').forEach(b => b.addEventListener('click', () => { openInvoicePopup(b.dataset.invPrint); }));
  list.querySelectorAll('[data-inv-pay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invPay);
      if(s){ s.paid = true; s.paymentMethod = b.dataset.method; s.paidAt = new Date().toISOString(); }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invPay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-cash-open]').forEach(b => b.addEventListener('click', () => {
    openCashPopup(b.dataset.cashOpen);
  }));
  list.querySelectorAll('[data-inv-unpay]').forEach(b => b.addEventListener('click', async () => {
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invUnpay);
      if(s){ s.paid = false; s.paymentMethod = null; s.paidAt = null; }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === b.dataset.invUnpay));
    renderInvoices();
  }));
  list.querySelectorAll('[data-inv-void]').forEach(b => b.addEventListener('click', async () => {
    if(!confirm(t('Void this invoice? It will be excluded from totals.'))) return;
    await withFreshShipments(list => {
      const s = list.find(x => x.id === b.dataset.invVoid);
      if(s) s.voided = true;
    });
    renderInvoices();
  }));
}

/* ---------------- Reports (owner only) ---------------- */
function renderReports(){
  if(state.reportTripView && state.reportIslandView) return renderReportIslandDetail();
  if(state.reportTripView) return renderReportTripIslands();

  const panel = document.getElementById('panel');
  const invoiced = state.shipments.filter(s => s.items && s.items.length && !s.voided && s.paid);
  const totalRevenue = invoiced.reduce((sum,s) => sum + (s.total||0), 0);
  const todayStart = startOfToday(), weekStart = startOfWeek();
  const revToday = invoiced.filter(s => new Date(s.paidAt) >= todayStart).reduce((sum,s)=>sum+(s.total||0),0);
  const revWeek = invoiced.filter(s => new Date(s.paidAt) >= weekStart).reduce((sum,s)=>sum+(s.total||0),0);

  const byIsland = {};
  invoiced.forEach(s => {
    byIsland[s.island] = byIsland[s.island] || {count:0, revenue:0};
    byIsland[s.island].count++;
    byIsland[s.island].revenue += (s.total||0);
  });
  const islandRows = Object.keys(byIsland).sort((a,b) => byIsland[b].revenue - byIsland[a].revenue);

// Filenames use both parties' name + mobile, sanitized for the filesystem.
function safeFilenamePart(str){
  return (str||'').replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g,'') || 'unknown';
}
function photoFilename(s){
  const senderPart = `${safeFilenamePart(s.name)}-${safeFilenamePart(s.mobile)}`;
  const receiverPart = `${safeFilenamePart(s.receiverName)}-${safeFilenamePart(s.receiverMobile)}`;
  return `${senderPart}_${receiverPart}.jpg`;
}
// Shows the photo as a tappable filename link. Tapping it pops the photo
// up in a full-screen lightbox (see openPhotoLightbox/the global click
// handler below) instead of expanding it in place in the card -- nobody
// has to scroll past a photo they didn't ask to see, and once they do ask,
// they get an unobstructed full view rather than a cramped inline thumbnail.
function photoLinkHtml(s){
  // Once marked delivered, the photo is deliberately hidden from view --
  // its only remaining purpose is to let an accidental "delivered" tap be
  // corrected (see cleanupExpiredDeliveryPhotos above), not to stay
  // browsable after the fact. It's still sitting in the database
  // (encrypted) for up to 6 days in case that correction happens; if the
  // shipment gets marked back to undelivered, s.status is no longer
  // 'delivered' and this check passes again, showing the same photo.
  if(!s.photo || s.status === 'delivered') return '';
  const filename = photoFilename(s);
  return `
    <div class="items-details" style="margin-top:8px;">
      <a href="#" class="photo-open-link" data-photo-src="${escapeHtml(s.photo)}" data-photo-name="${escapeHtml(filename)}" style="display:block;font-size:calc(12px * var(--en-scale));color:var(--green);text-decoration:underline;">\ud83d\udcf7 ${escapeHtml(filename)}</a>
    </div>
  `;
}
// Adds a "slide it away to close" drag gesture to a popup card, alongside
// whatever other ways it already closes (tap the backdrop outside it,
// press its own close mark). One shared implementation wired into every
// popup that needs it (the photo lightbox below, the invoice popups
// further up/down the file) instead of a copy per popup, so it behaves
// identically -- and gets fixed in one place -- no matter which role's
// end opened it (owner, manager, staff, admin, or a customer's tracking
// link all end up calling the same opener functions).
// - freeDrag:true (used for the photo) lets the card be dragged away in
//   ANY direction, since there's nothing scrollable inside it to fight
//   over -- the whole card is just an image.
// - freeDrag:false/omitted (used for the invoice-style popups, which
//   scroll vertically when their content is tall) only starts the
//   dismiss-drag on a downward drag that begins with the panel already
//   scrolled to the very top. That's the same rule real bottom-sheet/
//   modal UIs use so a swipe meant to scroll the invoice never gets
//   hijacked into closing it instead -- scrolling down through a tall
//   invoice works exactly as before, and only a swipe down from the top
//   slides the card away.
// Touch-driven (this is a phone app), with mouse-drag support too so it
// still works from a desktop browser/admin screen.
function enableDragToDismiss(cardEl, overlayEl, closeFn, opts){
  if(!cardEl || !overlayEl) return;
  const freeDrag = !!(opts && opts.freeDrag);
  const threshold = 90;
  let active = false, startX = 0, startY = 0, dx = 0, dy = 0;

  const begin = (x, y, target) => {
    if(!freeDrag){
      // Bail out (let the normal vertical scroll happen) unless this drag
      // starts on/above the card while it's already scrolled to the top.
      if(cardEl.scrollTop > 0) return false;
    }
    active = true; startX = x; startY = y; dx = 0; dy = 0;
    cardEl.style.transition = 'none';
    return true;
  };
  const move = (x, y) => {
    if(!active) return;
    dx = x - startX; dy = y - startY;
    if(!freeDrag){
      if(dy < 0){ dx = 0; dy = 0; } // ignore an upward drag entirely -- that's a scroll, not a dismiss
      dx = 0; // vertical-only slide for the card popups, so it doesn't drift sideways
    }
    cardEl.style.transform = `translate(${dx}px, ${dy}px)`;
    const dist = Math.hypot(dx, dy);
    overlayEl.style.opacity = String(Math.max(0, 1 - dist / 350));
  };
  const finish = () => {
    if(!active) return;
    active = false;
    const dist = Math.hypot(dx, dy);
    cardEl.style.transition = 'transform 0.2s ease-out';
    overlayEl.style.transition = 'opacity 0.2s ease-out';
    if(dist > threshold){
      const angle = Math.atan2(dy, dx || 1);
      cardEl.style.transform = `translate(${Math.cos(angle)*900}px, ${Math.sin(angle)*900}px)`;
      overlayEl.style.opacity = '0';
      setTimeout(closeFn, 190);
    } else {
      cardEl.style.transform = 'translate(0,0)';
      overlayEl.style.opacity = '1';
    }
  };

  cardEl.addEventListener('touchstart', (e) => {
    if(e.touches.length !== 1) return;
    const t = e.touches[0];
    begin(t.clientX, t.clientY, e.target);
  }, { passive: true });
  cardEl.addEventListener('touchmove', (e) => {
    if(!active) return;
    const t = e.touches[0];
    move(t.clientX, t.clientY);
  }, { passive: true });
  cardEl.addEventListener('touchend', finish);
  cardEl.addEventListener('touchcancel', finish);

  cardEl.addEventListener('mousedown', (e) => {
    if(e.button !== 0) return;
    if(!begin(e.clientX, e.clientY, e.target)) return;
    const onMove = (ev) => move(ev.clientX, ev.clientY);
    const onUp = () => {
      finish();
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    };
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}
function openPhotoLightbox(src, filename){
  const wrap = document.createElement('div');
  wrap.className = 'photo-lightbox-wrap';
  wrap.innerHTML = `
    <div class="photo-lightbox-card">
      <button type="button" class="photo-lightbox-close" aria-label="${t('Close')}">&times;</button>
      <img src="${src}" alt="${escapeHtml(filename || 'Photo')}">
    </div>
  `;
  document.body.appendChild(wrap);
  const close = () => wrap.remove();
  // Only a tap that lands on the backdrop itself (outside the card) closes
  // the popup -- e.target === wrap is true for the space around the card,
  // since the card is a separate child element a tap on it wouldn't match.
  wrap.addEventListener('click', (e) => { if(e.target === wrap) close(); });
  wrap.querySelector('.photo-lightbox-close').addEventListener('click', close);
  // Drag the photo away in any direction to close it, same as tapping
  // outside or the close mark.
  enableDragToDismiss(wrap.querySelector('.photo-lightbox-card'), wrap, close, { freeDrag: true });
}
// Delegated globally (not re-attached per render) since photoLinkHtml's
// output gets inserted via innerHTML in many different card templates --
// this one listener catches every .photo-open-link regardless of which
// screen rendered it.
document.addEventListener('click', (e) => {
  const link = e.target.closest && e.target.closest('.photo-open-link');
  if(!link) return;
  e.preventDefault();
  e.stopPropagation();
  openPhotoLightbox(link.dataset.photoSrc, link.dataset.photoName);
});
function downloadPhoto(s){
  if(!s.photo) return;
  const a = document.createElement('a');
  a.href = s.photo;
  a.download = photoFilename(s);
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function downloadDataUrl(dataUrl, filename){
  if(!dataUrl) return;
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // iOS Safari often ignores the download attribute for data URLs and just
  // navigates instead -- opening it in a new tab too means there's always a
  // way to save it (long-press -> Save Image) even if the click above does
  // nothing visible.
  window.open(dataUrl, '_blank');
}

// Trip manifest export -- a self-contained HTML report of every cargo item
// on the trip, including each shipment's loading photo (a CSV can't embed
// images meaningfully, so HTML is used instead -- it opens in any browser
// or photo viewer and saves straight to the device). No external service
// involved, whoever marks the trip in transit (owner or manager) gets this
// on their own phone.
function buildTripManifestHTML(trip, shipments){
  const rows = shipments.map(s => {
    const items = (s.items||[]).map(i => `${i.qty}x ${escapeHtml(i.name)}`).join(', ');
    return `
      <tr>
        <td>${escapeHtml(s.id)}</td>
        <td>${escapeHtml(s.name)}<br><span class="muted">${escapeHtml(s.mobile||'')}</span></td>
        <td>${escapeHtml(s.receiverName||'\u2014')}<br><span class="muted">${escapeHtml(s.receiverMobile||'')}</span></td>
        <td>${escapeHtml(s.island||'')}</td>
        <td>${items}</td>
        <td>${fmtMoney(s.total||0)}</td>
        <td>${s.paid ? 'Paid' : 'Unpaid'}</td>
        <td>${s.photo ? `<img src="${s.photo}" alt="Loading photo for ${escapeHtml(s.id)}">` : '<span class="muted">No photo</span>'}</td>
      </tr>
    `;
  }).join('');
  return `<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Trip Manifest</title>
<style>
  body{font-family:-apple-system,Helvetica,Arial,sans-serif;margin:16px;color:#1a2e22;--en-scale:0.9;}
  h1{font-size:calc(20px * var(--en-scale));margin-bottom:2px;}

function downloadTripManifest(trip, shipments){
  if(!shipments.length) return;
  const html = buildTripManifestHTML(trip, shipments);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const rawName = `${trip.origin}-to-${(trip.destinations||[]).join('-')}-${trip.date}-manifest.html`;
  const filename = rawName.replace(/[^a-zA-Z0-9.\-]+/g, '_');
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// Builds a summary (revenue, counts, per-island breakdown, paid/unpaid
// split) for shipments logged within the chosen date range and shows it
// in a popup, with a Download button that exports the same summary as a
// plain-text file.
function openGeneratedReportPopup(from, to){
  const inRange = state.shipments.filter(s => s.loadedAt && !s.voided && new Date(s.loadedAt) >= from && new Date(s.loadedAt) <= to);
  const invoiced = inRange.filter(s => s.items && s.items.length);
  let totalRevenue = invoiced.reduce((sum,s) => sum + (s.total||0), 0);
  const paid = invoiced.filter(s => s.paid);
  const unpaid = invoiced.filter(s => !s.paid);
  let paidRevenue = paid.reduce((sum,s) => sum + (s.total||0), 0);
  const unpaidRevenue = unpaid.reduce((sum,s) => sum + (s.total||0), 0);
  const byIsland = {};
  invoiced.forEach(s => {
    byIsland[s.island] = byIsland[s.island] || {count:0, revenue:0};
    byIsland[s.island].count++;
    byIsland[s.island].revenue += (s.total||0);
  });
  let invoicedCount = invoiced.length;
  let paidCount = paid.length;

  // Delivered+paid shipments older than 12 hours get folded into a
  // per-month total and removed (see cleanupCompletedShipments) -- merge
  // those archived totals back in here for any month fully covered by
  // this date range, so a report covering past months doesn't silently
  // undercount once the individual records are gone. A month only
  // partially covered by the range is skipped, since the archived total
  // can't be split by day -- so a partial-month report may run slightly
  // low on already-archived data specifically.
  const monthlyReports = state.settings.monthlyReports || {};
  let includedArchivedMonth = false;
  Object.keys(monthlyReports).forEach(key => {
    const [y,m] = key.split('-').map(Number);
    const monthStart = new Date(y, m-1, 1, 0,0,0);
    const monthEnd = new Date(y, m, 0, 23,59,59);
    if(monthStart >= from && monthEnd <= to){
      const agg = monthlyReports[key];
      totalRevenue += agg.revenue || 0;
      paidRevenue += agg.revenue || 0; // archived shipments were paid by definition
      invoicedCount += agg.shipmentCount || 0;
      paidCount += agg.shipmentCount || 0;
      includedArchivedMonth = true;
      Object.keys(agg.byIsland||{}).forEach(isl => {
        byIsland[isl] = byIsland[isl] || {count:0, revenue:0};
        byIsland[isl].count += agg.byIsland[isl].count;
        byIsland[isl].revenue += agg.byIsland[isl].revenue;
      });
    }
  });
  const islandRows = Object.keys(byIsland).sort((a,b) => byIsland[b].revenue - byIsland[a].revenue);
  const rangeLabel = `${fmtDMY(from.toISOString())} \u2013 ${fmtDMY(to.toISOString())}`;

  closeGeneratedReportPopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'generated-report-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="generated-report-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;">
        <h3 style="margin-bottom:2px;">${t("Report")}</h3>
        <button type="button" class="btn btn-ghost" id="generated-report-popup-close-btn" style="padding:8px 14px;">\u2715</button>
      </div>
      <p class="sub" style="margin-bottom:14px;">${escapeHtml(rangeLabel)}</p>
      <div class="stat-grid">
        <div class="stat-card"><div class="slabel">Total Revenue</div><div class="sval">${fmtMoney(totalRevenue)}</div></div>
        <div class="stat-card"><div class="slabel">${t("Shipments")}</div><div class="sval">${invoicedCount}</div></div>
        <div class="stat-card"><div class="slabel">Paid</div><div class="sval" style="color:var(--green);">${fmtMoney(paidRevenue)}</div></div>
        <div class="stat-card"><div class="slabel">Unpaid</div><div class="sval" style="color:var(--red);">${fmtMoney(unpaidRevenue)}</div></div>
      </div>
      ${includedArchivedMonth ? `<p class="note" style="margin-top:10px;">Includes archived totals for fully-covered past months \u2014 individual delivered &amp; paid records older than 12 hours are summarized here rather than kept in full.</p>` : ''}
      <h3 style="margin-top:18px;margin-bottom:8px;">${t("By Island")}</h3>
      ${islandRows.length ? islandRows.map(isl => `
        <div class="rate-row">
          <div class="name">${escapeHtml(isl)}</div>
          <div class="price">${byIsland[isl].count} shipment${byIsland[isl].count===1?'':'s'}</div>
          <div class="amt">${fmtMoney(byIsland[isl].revenue)}</div>
        </div>
      `).join('') : `<div class="empty" style="padding:16px 0;">${t("No shipments in this period.")}</div>`}
      <button class="btn btn-primary" id="generated-report-download-btn" style="width:100%;margin-top:18px;">${t("Download Report")}</button>
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeGeneratedReportPopup(); });
  document.body.appendChild(overlay);
  document.getElementById('generated-report-popup-close-btn').addEventListener('click', closeGeneratedReportPopup);
  document.getElementById('generated-report-download-btn').addEventListener('click', async () => {
    const boatName = _boatNameCache[CURRENT_BOAT_ID] || await getCurrentBoatName();
    const lines = [
      `${boatName} -- Report`,
      rangeLabel,
      '',
      `Total Revenue: ${fmtMoney(totalRevenue)}`,
      `Shipments: ${invoicedCount}`,
      `Paid: ${fmtMoney(paidRevenue)} (${paidCount})`,
      `Unpaid: ${fmtMoney(unpaidRevenue)} (${unpaid.length})`,
      '',
      'By Island:',
      ...islandRows.map(isl => `  ${isl}: ${byIsland[isl].count} shipment(s), ${fmtMoney(byIsland[isl].revenue)}`),
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `report-${fromVal_(from)}-to-${fromVal_(to)}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  });
}
function fromVal_(d){ return d.toISOString().slice(0,10); }
function closeGeneratedReportPopup(){
  if(document.getElementById('generated-report-popup-overlay')) unlockBodyScroll();
  document.getElementById('generated-report-popup-overlay')?.remove();
}

function renderSettings(){
  const panel = document.getElementById('panel');
  const isManager = state.role === 'manager';
  const SETTINGS_SUBTABS = getSettingsSubtabs();
  const visibleSubtabs = isManager ? SETTINGS_SUBTABS.filter(t => MANAGER_SETTINGS_SUBTABS.includes(t.id)) : SETTINGS_SUBTABS;
  if(!visibleSubtabs.some(t => t.id === state.settingsTab)) state.settingsTab = visibleSubtabs[0].id;
  const subtabs = visibleSubtabs.map(t =>
    `<button class="${t.id===state.settingsTab?'active':''}" data-subtab="${t.id}">${t.label}</button>`
  ).join('');
  panel.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
      <div>
        <h2 style="margin-bottom:4px;">${t("Settings")}</h2>
        <p class="sub" style="margin-bottom:0;">${isManager ? 'Manager access. Staff and trip settings for this boat.' : 'Owner-only. Manage staff access, item prices, and app links.'}</p>
      </div>
      <div style="display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;">
        <button type="button" id="settings-lang-toggle-btn" class="btn btn-ghost" style="flex-shrink:0;"></button>
      </div>
    </div>
    <div class="sub-tabs" style="margin-top:18px;">${subtabs}</div>
    <div id="settings-body"></div>
  `;
  renderLangToggle();
  document.getElementById('settings-lang-toggle-btn').addEventListener('click', () => {
    const switchingToDhivehi = state.lang !== 'dv';
    // Switching back to English is always free -- only switching into
    // Dhivehi is the Pro-gated direction.
    if(switchingToDhivehi && !isProAccount()){
      openProFeatureRequiredPopup(t('Using the app in Dhivehi is a Pro feature. Upgrade to Pro to switch languages.'));
      return;
    }
    setLang(switchingToDhivehi ? 'dv' : 'en');
    // Belt-and-suspenders: setLang() already re-renders via handleHash(),
    // but calling renderSettings() directly here guarantees this screen
    // (sub-tabs, labels, and whichever settings section is open) is
    // rebuilt immediately with the new language, regardless of what hash
    // routing decides.
    renderSettings();
  });
  panel.querySelectorAll('[data-subtab]').forEach(b => b.addEventListener('click', () => {
    state.settingsTab = b.dataset.subtab;
    renderSettings();
  }));

  if(state.settingsTab === 'owner' && !isManager) renderOwnerSettings();
  else if(state.settingsTab === 'staff') renderStaffManagement();
  else if(state.settingsTab === 'trip') renderTripSettings();
  else if(state.settingsTab === 'customers' && !isManager) renderCustomerDirectory();
  else if(state.settingsTab === 'reports') renderReportsSettingsSection();
  else if(!isManager) renderRatesSetup();
}

function staffShareMessage(name, pin, staffUrl, username, boatName){
  return `Hi ${name}, here's your ${boatName} staff sign-in.${username ? `\nUsername: ${username}` : ''}\nPIN: ${pin}\nSign in here: ${staffUrl}`;
}

async function openStaffSharePanel(name, pin, staffUrl, username){
  const boatName = await getCurrentBoatName();
  const msg = staffShareMessage(name, pin, staffUrl, username, boatName);
  const encoded = encodeURIComponent(msg);
  const wrap = document.createElement('div');
  wrap.style.position = 'fixed';
  wrap.style.inset = '0';
  wrap.style.background = 'rgba(6,30,50,0.45)';
  wrap.style.display = 'flex';
  wrap.style.alignItems = 'center';
  wrap.style.justifyContent = 'center';
  wrap.style.padding = '20px';
  wrap.style.zIndex = '9999';
  wrap.innerHTML = `
    <div class="themed-modal-panel">
      <h3>Share PIN with ${escapeHtml(name)}</h3>
      <p class="sub" style="margin-bottom:14px;">${t("Choose how to send the sign-in PIN and staff link.")}</p>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button class="btn btn-primary" id="share-whatsapp-btn" style="background:#25D366;border-color:#25D366;">${t("Share via WhatsApp")}</button>
        <button class="btn btn-primary" id="share-viber-btn" style="background:#7360F2;border-color:#7360F2;">${t("Share via Viber")}</button>
        <button class="btn btn-ghost" id="share-close-btn" style="border-color:rgba(255,255,255,0.4);color:#F4F9FF;">${t("Cancel")}</button>
      </div>
    </div>
  `;
  document.body.appendChild(wrap);
  document.getElementById('share-whatsapp-btn').addEventListener('click', () => {
    window.open(`https://wa.me/?text=${encoded}`, '_blank');
    wrap.remove();
  });
  document.getElementById('share-viber-btn').addEventListener('click', () => {
    window.open(`viber://forward?text=${encoded}`, '_blank');
    wrap.remove();
  });
  document.getElementById('share-close-btn').addEventListener('click', () => wrap.remove());
  wrap.addEventListener('click', (e) => { if(e.target === wrap) wrap.remove(); });
}

  // freshly generated/reset PIN only exists here, in memory, for as long
  // as this Staff Management screen stays open -- leaving and coming back
  // loses it, same as reloading the page. That's intentional: it's the

        ${!state.settings.isPro ? `<button class="btn btn-amber" id="staff-section-upgrade-btn" style="width:100%;margin-top:8px;">${t('Upgrade to Pro')}</button>` : ''}
      ` : `
        <button class="btn btn-primary" id="open-invite-btn" style="margin-top:10px;">${t("+ Add Staff")}</button>
      `}
    </div>

    <div class="settings-block">
      <h3>${t("Staff Links")}</h3>
      <div class="url-box"><div><div class="tag-label">Staff sign-in / request-access link</div><div class="u">${escapeHtml(staffUrl)}</div></div></div>
      <div class="url-box"><div><div class="tag-label">Staff \u2014 for Add to Home Screen</div><div class="u">${escapeHtml(baseUrl() + 'staff/')}</div></div></div>
      <div class="note">${t("Share the sign-in link with staff. Use the \"Add to Home Screen\" link specifically when saving an icon on a phone — iOS doesn't reliably remember the # link for that.")}</div>

    ${!isManager ? `
    <div class="settings-block">
      <h3>${t("Manager Access")}</h3>
      <p class="sub" style="margin-bottom:14px;">${t("Give someone full run of this boat \u2014 Dashboard, Trips, Invoices, Reports, and Settings (Staff & Trip Settings only) \u2014 without letting them see or edit your account details or item prices. Only you can add or remove managers.")}</p>
      <div id="manager-list"></div>
      <button class="btn btn-primary" id="open-manager-invite-btn" style="margin-top:10px;">${t("+ Add Manager")}</button>
    </div>

    <div class="settings-block">
      <h3>${t("Manager Links")}</h3>
      <div class="url-box"><div><div class="tag-label">Manager sign-in link</div><div class="u">${escapeHtml(managerUrl)}</div></div></div>
      <div class="note">${t("Share this only with people you've personally added as a manager below — it's not a self-request link.")}</div>
    </div>
    ` : ''}
  `;

  const renderPendingList = () => {
    const list = state.settings.pendingStaff || [];
    const el = document.getElementById('pending-list');
    if(!list.length){ el.innerHTML = `<div class="staff-empty">No pending requests.</div>`; return; }
    el.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${list.map((r,idx) => `
          <div class="staff-row">
            <div class="staff-row-info">
              <span class="sname">${escapeHtml(r.name)}</span>
              <span class="tag-meta">${escapeHtml(r.email)}${r.mobile ? ' \u00b7 '+telLink(r.mobile) : ''}</span>
            </div>
            <div class="staff-row-actions">
              <button class="btn btn-primary" data-approve="${idx}">${t("Approve")}</button>

    el.querySelectorAll('[data-decline]').forEach(b => b.addEventListener('click', async () => {
      const idx = parseInt(b.dataset.decline,10);
      b.disabled = true;
      await withFreshSettings(fresh => {
        const list = fresh.pendingStaff || [];
        const target = (state.settings.pendingStaff||[])[idx];

      });

        await withFreshSettings(async fresh => {
          const pending = fresh.pendingStaff || [];
          const target = (state.settings.pendingStaff||[])[idx];
          if(!target) return;
          const pos = pending.findIndex(r => r.id === target.id);
          if(pos > -1) pending.splice(pos,1);
          const users = fresh.staffUsers || (fresh.staffUsers = []);
          // Existing users[].pin values are hashed at this point, so they no
          // longer help avoid collisions -- only PINs generated earlier in
          // this same screen-open (justSetPins) can be usefully checked here.
          const usedPins = new Set(Object.values(justSetPins));

      renderPendingList();
      renderStaffList();
      if(newPin) openStaffSharePanel(approvedName, newPin, staffUrl, newUsername);

            </div>
          </div>
        `).join('')}
      </div>
    `;
    el.querySelectorAll('[data-staff-share]').forEach(b => b.addEventListener('click', () => {
      const idx = parseInt(b.dataset.staffShare,10);
      const u = list[idx];
      if(u && justSetPins[u.id]) openStaffSharePanel(u.name, justSetPins[u.id], staffUrl, u.username);
    }));
    el.querySelectorAll('[data-staff-reset]').forEach(b => b.addEventListener('click', async () => {
      const idx = parseInt(b.dataset.staffReset,10);
      const target = list[idx];
      if(!target) return;
      b.disabled = true;
      let newPin = '';
      await withFreshSettings(fresh => {
        const users = fresh.staffUsers || (fresh.staffUsers = []);
        const pos = users.findIndex(u => u.id === target.id);
        if(pos === -1) return;
        // Collision-avoidance is best-effort only now: existing PINs are
        // hashed, so we can only steer clear of PINs generated earlier in
        // this same screen-open session (justSetPins), not ones from past
        // sessions. The server would reject a genuine duplicate at
        // sign-in time regardless (each hash is independently salted), so
        // this is purely to avoid handing out an obviously-repeated
        // 4-digit code back-to-back, not a hard uniqueness guarantee.
        const recentlyUsed = new Set(Object.values(justSetPins));
        do { newPin = String(Math.floor(1000 + Math.random()*9000)); } while(recentlyUsed.has(newPin));
        users[pos] = { ...users[pos], pin: newPin };
      });
      if(newPin) justSetPins[target.id] = newPin;

      if(newPin) openStaffSharePanel(target.name, newPin, staffUrl, target.username);

    });

// Owner-facing "delete this boat" confirmation -- same re-enter-your-
// password pattern as confirmAdminAction, but verifies this boat's own
// owner PIN (via /api/owner-pin-login, the same endpoint the sign-in
// gate uses) rather than an admin passkey, since the person doing this
// is the boat owner, not Super Admin. A deliberately heavy, hard-to-
// misclick action: red panel, explicit warning, and the PIN re-entry is
// the only thing that unlocks the Confirm button actually doing anything.
function openDeleteBoatPopup(){
  // A boat opened via the org dashboard ("Open App") is authenticated
  // with the org account's own password (state.orgPasskey), not the
  // legacy per-boat 4-6 digit "owner PIN" -- a boat added through that
  // newer flow may never have had a separate PIN set at all, so
  // verifying against /api/owner-pin-login would reject every attempt
  // regardless of what's typed. Use whichever credential this session
  // actually holds.
  const usingOrgPasskey = state.orgAuthed && !!state.orgPasskey;
  const overlay = document.createElement('div');
  overlay.id = 'delete-boat-popup-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2400;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" style="max-width:380px;width:100%;margin:0;border:1.5px solid var(--red);">
      <h3 style="margin-bottom:6px;color:var(--red);">${t("Delete This Boat?")}</h3>
      <p class="sub" style="margin-bottom:12px;">${t("This permanently deletes this boat and everything on it \u2014 trips, shipments, invoices, and staff/manager access. This cannot be undone.")}</p>
      <label>${usingOrgPasskey ? t("Enter your account password to confirm") : t("Enter your owner PIN to confirm")}</label>
      <input type="password" ${usingOrgPasskey ? '' : 'inputmode="numeric" maxlength="6"'} id="delete-boat-pin" placeholder="${usingOrgPasskey ? '' : '&bull;&bull;&bull;&bull;'}">
      <div class="pin-error" id="delete-boat-error"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button class="btn btn-ghost" id="delete-boat-cancel" style="flex:1;">${t("Cancel")}</button>
        <button class="btn btn-danger" id="delete-boat-confirm" style="flex:1;">${t("Delete Boat")}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const input = document.getElementById('delete-boat-pin');
  input.focus();
  const close = () => overlay.remove();
  document.getElementById('delete-boat-cancel').addEventListener('click', close);
  overlay.addEventListener('click', (e) => { if(e.target === overlay) close(); });
  const go = async () => {
    const errorEl = document.getElementById('delete-boat-error');
    const btn = document.getElementById('delete-boat-confirm');
    const entered = input.value;
    if(!entered){ errorEl.textContent = usingOrgPasskey ? t('Enter your account password.') : t('Enter your owner PIN.'); return; }
    errorEl.textContent = '';
    btn.disabled = true; btn.textContent = t('Verifying\u2026');
    try{
      if(usingOrgPasskey){
        // The org passkey is already held in state from org sign-in --
        // this session's own actions (add boat, boat requests, etc) all
        // resend it the same way and let the server be the actual judge,
        // so a local match against the value that got this session
        // authenticated in the first place is a legitimate check here.
        if(entered !== state.orgPasskey){
          errorEl.textContent = t('Incorrect password.');
          btn.disabled = false; btn.textContent = t('Delete Boat');
          return;
        }
      } else {
        // Legacy single-boat sign-in: the real owner PIN only ever lives
        // server-side (see the sign-in gate's /api/owner-pin-login call,
        // the same endpoint used here), never held in plain text on the
        // client, so it has to be verified the same way normal owner
        // sign-in verifies it rather than compared locally.
        const verifyRes = await fetch(`${API_BASE}/api/owner-pin-login/${CURRENT_BOAT_ID}`, {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ pin: entered })
        });
        const verifyData = await verifyRes.json().catch(() => ({}));
        if(!verifyRes.ok || !verifyData.ok){
          errorEl.textContent = (verifyData && verifyData.error) || t('Incorrect PIN.');
          btn.disabled = false; btn.textContent = t('Delete Boat');
          return;
        }
      }
      btn.textContent = t('Deleting\u2026');
      const res = await fetch(`${API_BASE}/api/boats/${CURRENT_BOAT_ID}`, {
        method: 'DELETE', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(usingOrgPasskey ? { passkey: entered, organizationId: state.orgData ? state.orgData.id : undefined } : { pin: entered })
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok || !data.ok){
        errorEl.textContent = (data && data.error) || t('Could not delete this boat. Try again.');
        btn.disabled = false; btn.textContent = t('Delete Boat');
        return;
      }
      close();
      if(usingOrgPasskey){
        // Came from the org dashboard's boat list -- drop straight back
        // to it with this boat already gone from state.orgBoats, instead
        // of a full logout. The dashboard re-fetches nothing here; the
        // deleted boat is removed from the in-memory list immediately so
        // it can't still be tapped while a fresh org-login round trip is
        // pending.
        state.orgBoats = (state.orgBoats || []).filter(b => b.id !== CURRENT_BOAT_ID);
        state.role = null; state.gateStage = 'pick'; state.tab = null; state.staffName = null;
        state.entryMode = 'org';
        history.replaceState(null, '', '#org');
        renderOrgArea();
        // Best-effort refresh in the background in case anything else
        // about the org (boat count vs Pro limits, etc) changed as a
        // result -- doesn't block the list from already looking right.
        fetch(`${API_BASE}/api/org-login`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ mobile: state.orgData.mobile, passkey: state.orgPasskey })
        }).then(r => r.json()).then(refreshed => {
          if(refreshed && refreshed.ok){ state.orgBoats = refreshed.boats || []; if(state.orgAuthed) renderOrgArea(); }
        }).catch(() => {});
      } else {
        // Legacy single-boat sign-in has no boat list to return to -- the
        // boat this session was pointed at no longer exists, so send the
        // owner back to the sign-in gate instead of leaving them sitting
        // on a now-deleted boat's dashboard.
        logoutInternal();
      }
    }catch(e){
      console.error('delete boat failed', e);
      errorEl.textContent = t('Something went wrong. Try again.');
      btn.disabled = false; btn.textContent = t('Delete Boat');
    }
  };
  document.getElementById('delete-boat-confirm').addEventListener('click', go);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
}

  body.innerHTML = `

      <h3>${t("Trip Defaults")}</h3>
      <p class="sub" style="margin-bottom:12px;">${t("Fixed details used on every trip announcement, since these rarely change. Set once here instead of retyping them each time you plan a trip.")}</p>
      ${tripField}
