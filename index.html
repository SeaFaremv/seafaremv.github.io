  html[lang="dv"] *{
    font-family:'Mv Elaaf Normal','Inter',sans-serif !important;
    /* Only the Regular weight is embedded above -- without this, browsers
       "faux-bold" any text styled with font-weight:600/700 (headings,
       buttons, tag codes, etc.) by drawing each glyph's outline twice at
       a slight offset, which is what shows up as doubled/ghosted strokes
       on Thaana letters like ސ and ނ. Disabling synthesis makes those
       elements render at the font's one real weight instead. */
    font-synthesis:none;
  }
  html[lang="dv"] .mono,
  html[lang="dv"] .brand span,
  html[lang="dv"] .tag-code,
  html[lang="dv"] .party-phone,
  html[lang="dv"] .balance,
  html[lang="dv"] .item-result-row .rprice,
  html[lang="dv"] .rate-row .price,
  html[lang="dv"] .stepper .qty,
  html[lang="dv"] .total-line .amt,
  html[lang="dv"] .confirm-code .big,
  html[lang="dv"] .tl-date,
  html[lang="dv"] .invoice td.num,
  html[lang="dv"] .invoice th.num,
  html[lang="dv"] .view-field .vf-value,
  html[lang="dv"] .url-box .u,
  html[lang="dv"] .pin-box input,
  html[lang="dv"] .stat-card .sval,
  html[lang="dv"] #invoice-share-image-node,
  html[lang="dv"] #invoice-share-image-node *,
  html[lang="dv"] .tp-item,
  html[lang="dv"] .dp-day{
    font-family:'JetBrains Mono',monospace !important;
  }
  /* The calendar/time-picker's own generated labels (month name, weekday
     letters) are always plain English regardless of app language --
     toLocaleString('en-US', ...) and hardcoded S/M/T/W/T/F/S -- so they
     stay in the app's normal Latin display font here too, rather than
     being forced into the Thaana font for text that never actually
     translates. Keeps the picker's look consistent between languages,
     only the surrounding app chrome (buttons, labels) actually switches. */
  html[lang="dv"] .dp-month,
  html[lang="dv"] .dp-weekdays span{
    font-family:'Oswald',sans-serif !important;
  }

/* =========================================================================
   SUPER ADMIN -- "Fleet Command Console" theme
   A distinct look from the rest of the app: deep-space navy with a faint
   radar-style grid, glowing status blips instead of flat pills, and heavier
   use of the mono face already loaded (JetBrains Mono) for IDs, amounts,
   and timestamps -- a control-room read on the same maritime identity the
   rest of the app already has, not a different app bolted on. Scoped to
   .admin-shell (wraps every admin screen) and .admin-popup-panel (the org
   detail / settings popups, appended to <body> rather than nested inside
   .admin-shell) so none of this reaches the boat/owner/customer UI.
   ========================================================================= */
:root{
  --adm-bg:#15324D;
  --adm-grid:rgba(15,23,42,0.05);
  --adm-panel:#FFFFFF;
  --adm-panel-raised:#F8FAFC;
  --adm-border:rgba(15,23,42,0.14);
  --adm-border-strong:#0E7490;
  --adm-text:#0F172A;
  --adm-text-soft:#64748B;
  --adm-cyan:#0891B2;
  --adm-violet:#7C3AED;
  --adm-amber:#B45309;
  --adm-rose:#E11D48;
  --adm-emerald:#059669;
}

/* .admin-shell's own dark grid background (below) only ever painted the
   #gate-area box itself -- which sits inside .shell (max-width:920px,
   centered), which in turn sits on <body>'s own blue wave background.
   On anything wider than ~920px that left the intended "distinct look
   from the rest of the app" console theme surrounded by strips of the
   ordinary blue app background on both sides (and above/below, for
   shorter screens) -- exactly the "grid behind the background" seam.
   body.admin-mode (toggled alongside #gate-area's own admin-shell class,
   see hideNormalShell()/renderAdmin()) repaints <body> itself with the
   same dark navy + grid, edge to edge, so there's no blue left showing
   anywhere behind the Super Admin screens.  Same grid tile size/position
   as .admin-shell below so the two backgrounds tile seamlessly. */
/* Grid AND the dark navy wash both removed -- .admin-shell no longer
   paints any background of its own, so the app's normal animated wave
   background (painted on body itself, see body{} above) shows straight
   through the whole admin console with nothing darkening it. Only the
   individual .panel cards below stay dark, for text contrast on top of
   the wave -- the space around/between them is now plain wave, not a
   dark box. */
.admin-shell{
  min-height:100vh;
  color:var(--adm-text);
}
/* Page background behind the Super Admin console -- a darker blue than
   the ordinary app's --navy-deep wave (see body{} above), keeping the
   same wave art/motion so the console still reads as part of the app

/* ---------------- API layer (Neon-backed, via your own serverless endpoint) ----------------
   EDIT THIS to your deployed API's base URL, e.g. "https://cargo-api.yourname.workers.dev"
   The API must implement:
     GET  /api/data/:key   -> { value: <any JSON> }   (404 or {value:null} if missing)
     PUT  /api/data/:key   body {value: <any JSON>}   -> upserts the row
   See neon-schema.sql and api-example/server.js for a ready-made reference implementation. */
const API_BASE = 'https://seafare.onrender.com';

// Phase 3: every shipments/rates/trips/settings read & write in this app
// (Dashboard, Trips, Invoices, Reports, Settings, Check-In, Track -- all of
// it) funnels through apiGet/apiSet below, so scoping just these two
// functions to a boat_id is enough to make the entire existing app
// boat-private without touching any of the dozens of screens that call them.
//
// !! REPLACE THIS after completing phase3-migration.sql Steps 1-2 !!
// This is the boat_id for GreenLine Cargo's migrated account.
// !! This is the default fallback (GreenLine Cargo's migrated boat), used
// when no boat is specified in the URL or session -- keeps old bookmarked
// #owner/#staff links working exactly as before. Owners of OTHER boats are
// routed in via #owner/<boatId> or #staff/<boatId> (see handleHash), which
// overrides this at runtime.
let CURRENT_BOAT_ID = '0385fa720a791a89';

function sleepMs(ms){ return new Promise(resolve => setTimeout(resolve, ms)); }

// Render's free tier puts the backend to sleep after inactivity -- the
// first request after that can take 30-50+ seconds to wake it up. A single
// short timeout treated that exactly like "the server has no data", which
// silently showed empty dashboards/trips instead of what was actually
// happening (the server was still waking up). Retrying with a real per-
// attempt timeout gives a cold start a genuine chance to finish, while
// still eventually giving up rather than hanging forever on a truly dead
// connection.
async function apiGet(key, fallback, opts){
  const timeoutMs = (opts && opts.timeoutMs) || 20000;
  const retries = (opts && opts.retries != null) ? opts.retries : 2;
  let lastError = null;
  for(let attempt = 0; attempt <= retries; attempt++){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try{
      const res = await fetch(`${API_BASE}/api/data/${CURRENT_BOAT_ID}/${key}`, { signal: controller.signal });
      clearTimeout(timer);
      if(!res.ok){ lastError = new Error(`HTTP ${res.status}`); if(attempt < retries){ await sleepMs(1500); continue; } return fallback; }
      const data = await res.json();
      return (data && data.value !== undefined && data.value !== null) ? data.value : fallback;
    }catch(e){
      clearTimeout(timer);
      lastError = e;
      if(attempt < retries){ await sleepMs(1500); continue; }
    }
  }
  console.error('apiGet failed for', key, 'after', retries + 1, 'attempts:', lastError);
  return fallback;
}
// Same reliability gap as apiGet had -- writes had no timeout at all, so a
// save could hang indefinitely on a slow connection or a sleeping Render
// instance, leaving buttons stuck on "Saving..." with no way to know if it
// actually went through. This is a full-document PUT, so it's safe to
// retry as many times as needed -- retrying just re-sends the same value.
async function apiSet(key, value, opts){
  const timeoutMs = (opts && opts.timeoutMs) || 20000;
  const retries = (opts && opts.retries != null) ? opts.retries : 2;
  let lastError = null;
  for(let attempt = 0; attempt <= retries; attempt++){
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try{
      const res = await fetch(`${API_BASE}/api/data/${CURRENT_BOAT_ID}/${key}`, {
        method: 'PUT',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ value }),
        signal: controller.signal
      });
      clearTimeout(timer);
      if(!res.ok){
        const err = await res.json().catch(() => ({}));
        lastError = new Error(err.error || `Save failed (HTTP ${res.status})`);
        if(attempt < retries){ await sleepMs(1500); continue; }
        throw lastError;
      }
      return;
    }catch(e){
      clearTimeout(timer);
      lastError = e;
      if(attempt < retries){ await sleepMs(1500); continue; }
      throw lastError;
    }
  }
}

// Used by the new #org starter dashboard, which manages a boat chosen at

    if(!res.ok) return fallback;

  }catch(e){ console.error('orgApiGet failed for', key, e); return fallback; }
}
async function orgApiSet(boatId, key, value){
  try{
    await fetch(`${API_BASE}/api/data/${boatId}/${key}`, {

      headers: {'Content-Type':'application/json'},

  }catch(e){ console.error('orgApiSet failed for', key, e); }
}

// shipment's embedded photo at the database query level (see server.js),
// so a routine "did anything change" check doesn't repeatedly
// re-transfer every photo ever taken, which is what was driving up data
// transfer against Neon's quota. NEVER use this for anything that saves
// data back (withFreshShipments, the initial full load, etc.) -- doing
// so would silently wipe every photo from the database on the next save.

// Always re-fetch the current settings from the database right before changing
// them, so a stale in-memory copy (e.g. an old tab, or a page left open) can
// never overwrite changes someone else made in the meantime.
async function withFreshSettings(mutate){
  const fresh = await loadSettings();
  await mutate(fresh);
  await saveSettings(fresh);
  state.settings = fresh;
  return fresh;
}

// right before every change instead of trusting whatever's sitting in local
// memory. Without this, two quick actions (e.g. adding a photo to one
// shipment right after another) can race with each other or with the
// 5-second background poll, and whichever save lands last silently wipes out
// the other's change.
async function withFreshShipments(mutate){
  const fresh = await loadShipments();
  mutate(fresh);
  await saveShipments(fresh);
  state.shipments = fresh;
  return fresh;
}

/* ---------------- Google Sheets trip logging ---------------- */
// All three of these are fire-and-forget from the caller's perspective --
// a slow or failing Google API call must never block or break the actual
// dispatch app, which works fine with zero Google connection at all.
function tripSheetTitle(trip){
  return `${trip.origin} \u2192 ${(trip.destinations||[]).join(', ')} \u00b7 ${fmtDMY(trip.date)}`;
}
async function createGoogleSheetForTrip(trip){
  try{
    const res = await fetch(`${API_BASE}/api/google/sheets/create`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ boatId: CURRENT_BOAT_ID, title: tripSheetTitle(trip) })
    });
    const data = await res.json().catch(() => ({}));
    if(data.ok && data.sheetId){
      await withFreshTrips(list => {
        const t = list.find(x => x.id === trip.id);
        if(t){ t.googleSheetId = data.sheetId; t.googleSheetUrl = data.sheetUrl; }
      });
      if(state.tab === 'dashboard') renderDashboard();
    }
  }catch(e){ console.error('createGoogleSheetForTrip failed', e); }
}
function syncShipmentToSheet(shipment){
  if(!shipment || !shipment.tripId) return;
  const trip = (state.trips||[]).find(t => t.id === shipment.tripId);
  if(!trip || !trip.googleSheetId) return;
  fetch(`${API_BASE}/api/google/sheets/sync-row`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ boatId: CURRENT_BOAT_ID, sheetId: trip.googleSheetId, shipment })
  }).catch(e => console.error('syncShipmentToSheet failed', e));
}
async function finalizeGoogleSheetForTrip(trip){
  if(!trip || !trip.googleSheetId) return;
  try{
    await fetch(`${API_BASE}/api/google/sheets/finalize`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ boatId: CURRENT_BOAT_ID, sheetId: trip.googleSheetId, tripTitle: tripSheetTitle(trip) })
    });
  }catch(e){ console.error('finalizeGoogleSheetForTrip failed', e); }
}

function trackingCode(){
  const d = new Date();
  const ymd = d.getFullYear().toString().slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return `CF-${ymd}-${rand}`;
}
function fmtMoney(n){ return '\u0783' + Number(n||0).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
// Suspended accounts/boats are permanently deleted 15 days after
// suspended_at if never reactivated. Returns a clear warning string, or
// null if there's no suspendedAt to measure from (shouldn't normally
// happen for a suspended record, but the deletion policy simply doesn't
// apply if the timestamp is missing rather than guessing).
const SUSPENSION_DELETE_WARNING_DAYS = 15;
function suspensionDeleteWarning(suspendedAt){
  if(!suspendedAt) return null;
  const deleteAt = new Date(suspendedAt).getTime() + SUSPENSION_DELETE_WARNING_DAYS*24*60*60*1000;
  const daysLeft = Math.ceil((deleteAt - Date.now()) / (24*60*60*1000));
  if(daysLeft <= 0) return 'This account is past its 15-day suspension window and is scheduled for permanent deletion very soon.';
  return `All data will be permanently deleted in ${daysLeft} day${daysLeft===1?'':'s'} if this isn't reactivated.`;
}
function fmtDate(iso){ if(!iso) return '\u2014'; const d = new Date(iso); return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'}); }
// html2canvas (invoice image sharing) and jsQR (QR scanning) are both
// sizeable libraries only needed for specific, occasional actions -- most
// page views, especially the public customer check-in/tracking pages,
// never touch either. Loading them lazily, only the first time they're
// actually needed, keeps them off every other page load entirely. Cached
// per URL so a second call while already loading (or already loaded)
// reuses the same promise/script instead of injecting a duplicate tag.
const _scriptLoadCache = {};
function loadScriptOnce(url){
  if(_scriptLoadCache[url]) return _scriptLoadCache[url];
  _scriptLoadCache[url] = new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = url;
    el.onload = () => resolve();
    el.onerror = () => { delete _scriptLoadCache[url]; reject(new Error('Failed to load ' + url)); };
    document.head.appendChild(el);
  });
  return _scriptLoadCache[url];
}

// Maldives mobile numbers are 7 digits, starting with 7 or 9 (landlines
// start with other digits and aren't valid here -- this app is
// specifically about reaching people on their mobile for cargo pickup).
function isValidMaldivesMobile(v){
  return /^[79]\d{6}$/.test(String(v||'').replace(/\D/g,''));
}
// Wires live inline validation onto a mobile <input> -- shows/hides a red
// error message right under the field as the person types or leaves it,
// and returns a checker function forms can call at submit time to block
// submission with the same message rather than silently failing later.
// extraCheck (optional) runs only once the format itself is valid, for
// checks like "this number is already registered" that need a lookup.
function wireMobileValidation(inputId, extraCheck){
  const input = document.getElementById(inputId);
  if(!input) return () => true;
  let errorEl = document.getElementById(inputId + '-error');
  if(!errorEl){
    errorEl = document.createElement('div');
    errorEl.id = inputId + '-error';
    errorEl.style.cssText = 'color:var(--red);font-size:calc(11.5px * var(--en-scale));margin-top:-8px;margin-bottom:8px;display:none;';
    input.insertAdjacentElement('afterend', errorEl);
  }
  const check = () => {
    const v = input.value.trim();
    if(!v){ errorEl.style.display = 'none'; return true; }
    if(!isValidMaldivesMobile(v)){
      errorEl.textContent = t('Invalid mobile number');
      errorEl.style.display = '';
      return false;
    }
    if(extraCheck){
      const extraMsg = extraCheck(v);
      if(extraMsg){
        errorEl.textContent = extraMsg;
        errorEl.style.display = '';
        return false;
      }
    }
    errorEl.style.display = 'none';
    return true;
  };
  input.addEventListener('blur', check);
  input.addEventListener('input', () => { if(errorEl.style.display !== 'none') check(); });
  return check;
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  "Every owner starts with one free boat. Fill in the basics below — everything else is optional and can be added later from Settings.": "ކޮންމެ ވެރިއަކަށްވެސް އެއް ދޯނި ހިލޭ ލިބޭނެއެވެ. ތިރީގައިވާ އަސާސީ މަޢުލޫމާތު ފުރިހަމަކުރައްވާ — އެހެން ހުރިހާ މަޢުލޫމާތަކީ އިޚްތިޔާރީ އަދި ފަހުން ސެޓިންގްސް އިން އިތުރުކުރެވިދާނެ މަޢުލޫމާތުތަކެކެވެ.",

  "Search all shipments — name, mobile, or tracking code": "ހުރިހާ ޝިޕްމަންޓެއް ހޯއްދަވާ — ނަން، މޯބައިލް ނުވަތަ ޓްރެކިންގ ކޯޑު",
  "Search by tracking code, sender mobile, or receiver mobile.": "ޓްރެކިންގ ކޯޑު، ފޮނުވާ ފަރާތުގެ މޯބައިލް، ނުވަތަ ލިބޭ ފަރާތުގެ މޯބައިލް ނަންބަރުން ހޯއްދަވާ.",
  "Select the text in the box and copy manually.": "ގޮޅީގައިވާ ލިޔުންކޮޅު ސިލެކްޓްކުރެއްވުމަށްފަހު އަމިއްލައަށް ކޮޕީކުރައްވާ.",
  "Sender mobile number": "ފޮނުވާ ފަރާތުގެ މޯބައިލް ނަންބަރު",

  "Share Invoice": "އިންވޮއިސް ޝެއަރ ކުރޭ",
  "Share the sign-in link with staff. Use the \"Add to Home Screen\" link specifically when saving an icon on a phone — iOS doesn't reliably remember the # link for that.": "ސްޓާފުންނާ ސައިން-އިން ލިންކް ހިއްސާކުރައްވާ. ފޯނުގައި އައިކަން ސޭވްކުރާއިރު ޚާއްޞަކޮށް \"އެޑް ޓު ހޯމް ސްކްރީން\" ލިންކް ބޭނުންކުރައްވާ — އައިއޯއެސް (އައިފޯން) އިން އެކަމަށްޓަކައި # ލިންކް ރަނގަޅަށް ހަނދާނެއް ނުބަހައްޓައެވެ.",
  "Share this only with people you've personally added as a manager below — it's not a self-request link.": "މިއީ އަމިއްލައަށް އެދެވޭ ލިންކެއް ނޫނެވެ، މިއީ ހަމައެކަނި ތިރީގައި ތިޔަބޭފުޅާ މެނޭޖަރެއްގެ ގޮތުގައި އިތުރުކޮށްފައިވާ ފަރާތްތަކާ އެކަނި ހިއްސާކުރަންވީ ލިންކެކެވެ.",

  "Shipments": "ޝިޕްމަންޓްތައް",
  "Shown on shared invoice images so customers know where to send bank transfers. Pre-filled from your account signup, but editable separately for this boat. Leave blank to hide this from invoices.": "ކަސްޓަމަރުން ބޭންކް ޓްރާންސްފަރ ހަދަންވީ އެކައުންޓް އެނގޭނޭހެން އިންވޮއިސް އިމޭޖުގައި ދައްކާނެއެވެ. މިއީ އެކައުންޓް ސައިންއަޕްއިން އޮޓޯއިން ނަގާފައިވާ މައުލޫމާތެކެވެ. ނަމަވެސް މި ދޯންޏަށް ވަކިން ބަދަލުކުރެވިދާނެއެވެ. އިންވޮއިސްތަކުގައި މި މައުލޫމާތު ނުދައްކަން ބޭނުންނަމަ ހުސްކޮށް ބާއްވާށެވެ.",
  "Sign In": "ސައިން އިން",
  "Sign in with your boat name (username) and PIN. Keep this link private to yourself.": "ތިބާގެ ދޯނީގެ ނަން (ޔޫޒަރނޭމް) އަދި ޕިން ނަންބަރު ޖައްސަވައިގެން ސައިން އިން ވެލައްވާ. މި ލިންކު އެހެން މީހުންނާ ހިއްސާނުކުރައްވާ ސިއްރެއްގެ ގޮތުގައި ބަހައްޓަވާ.",
  "Sign in, or request access if you're new": "ސައިން އިން ވެވަޑައިގަންނަވާ، ނުވަތަ އަލަށް ބޭނުންކުރައްވާނަމަ އެކްސެސް އަށް އެދިވަޑައިގަންނަވާ",
  "Sign Up": "ސައިން އަޕް",
  "Something went wrong adding this customer. Please try again.": "މި ކަސްޓަމަރު އިތުރުކުރުމުގައި މައްސަލައެއް ދިމާވެއްޖެ. އަލުން މަސައްކަތްކުރައްވާ.",
  "Staff Links": "ސްޓާފް ލިންކްތައް",

  "Tap a boat above to open its full dispatch app — Dashboard, Trips, Invoices, Reports, and Settings, private to that boat.": "މަތީގައިވާ ދޯންޏަކަށް ފިއްތާލުމުން އެ ދޯންޏެއްގެ ފުރިހަމަ ޑިސްޕެޗް އެޕް ހުޅުވޭނެއެވެ — ޑޭޝްބޯޑް، ދަތުރުތައް، އިންވޮއިސްތައް، ރިޕޯޓްތައް، އަދި ސެޓިންގްސް ހިމެނެނީ ހަމައެކަނި އެ ދޯންޏަށެވެ.",
  "The routes this boat mainly ferries. Once set, picking an origin on the New Trip form fills in destinations and the loading location automatically.": "މި ދޯނި މައިގަނޑު ގޮތެއްގައި ދަތުރުކުރާ ރޫޓުތައް. އެއްފަހަރު ސެޓްކުރުމުން، އާ ދަތުރު ފޯމުގައި ފުރާ ރަށް ނެގުމުން ދާނެ މަންޒިލްތަކާއި މުދާ އަރުވާ ތަން އޮޓޯއިން ފުރޭނެއެވެ.",
  "The start date is after the end date.": "ފެށޭ ތާރީޚު އުޅެނީ ނިމޭ ތާރީޚަށް ވުރެ ފަހުންނެވެ.",
  "This boat has been suspended and can't be opened right now.": "މި ދޯނި ވަނީ ސަސްޕެންޑްކޮށްފައެވެ، މިވަގުތު ހުޅުވައެއް ނުލެވޭނެއެވެ.",
  "This feature isn't set up on the server yet. Ask your developer to add Google API credentials.": "މި ފީޗަރ އަދި ސާވަރގައި ސެޓަޕް ކުރެވިފައެއް ނެތެވެ. ތިބާގެ ޑިވެލޮޕަރ ގާތު ގޫގުލް އޭޕީއައި (Google API) ކްރެޑެންޝަލްސް އަޅައިދިނުމަށް އެދޭށެވެ.",
  "This is what your senders and receivers use to check in cargo and track shipments for THIS boat specifically.": "މިއީ މުދާ ފޮނުވާ އަދި ލިބޭ ފަރާތްތަކުން ޚާއްޞަކޮށް މި ބޯޓަށް މުދާ ޗެކް-އިން ކުރުމަށާއި ޝިޕްމަންޓްތައް ޓްރެކްކުރުމަށް ބޭނުންކުރާ ލިންކެވެ.",
  "This Month": "މި މަސް",
  "This trip has already departed and is no longer accepting check-ins. Please check back once the next trip is announced.": "މި ދަތުރު މިހާރު ވަނީ ފުރާފައެވެ. އަދި މިހާރު ޗެކް-އިން އެއް ބަލައެއް ނުގަނެއެވެ. ދެން އޮންނަ ދަތުރު އިޢުލާންކުރުމުން ޗެކްކޮށްލައްވާށެވެ.",

  "Set island locations for this route in Trip Settings first, so GPS tracking knows what to check distance against.": "ޖީ.ޕީ.އެސް ޓްރެކިންގް އަށް ދުރުމިން ބަލާނެ ގޮތް އެނގޭނީ، ފުރަތަމަ 'ޓްރިޕް ސެޓިންގްސް' އިން މި ރޫޓުގެ ރަށްރަށުގެ ލޮކޭޝަން ކަނޑައެޅުމުންނެވެ.",
  "Share it with": "މިއާ ޙިއްޞާކުރައްވާ:",
  "shipment(s) updated.": "ޝިޕްމަންޓް(ތައް) އަޕްޑޭޓް ކުރެވިއްޖެ.",
  "so they can track it too.": "އެމީހުންނަށްވެސް ޓްރެކް ކުރެވޭނެ ގޮތް ހެދުމަށް.",
  "Something went wrong. Try again.": "ކޮންމެވެސް މައްސަލައެއް ދިމާވެއްޖެ. އަލުން މަސައްކަތްކޮށްލައްވާ.",
  "Start a new account instead": "އޭގެ ބަދަލުގައި އައު އެކައުންޓެއް ފަށާ",
  "Start GPS Tracking": "ޖީ.ޕީ.އެސް ޓްރެކިންގް ފަށާ",
  "Status": "ސްޓޭޓަސް",
  "Stop GPS Tracking": "ޖީ.ޕީ.އެސް ޓްރެކިންގް ހުއްޓާލާ",
  "Tap below to pay": "ފައިސާ ދެއްކެވުމަށް ތިރިއަށް ފިއްތާލައްވާ",
  "Tap below to pay ރ": "ފައިސާ ދެއްކެވުމަށް ތިރިއަށް ފިއްތާލައްވާ: ރ.",
  "Tap for trip details & actions": "ދަތުރުގެ ތަފްޞީލާއި ފިޔަވަޅުތަކަށް ފިތާލައްވާ",
  "Tap Open Google Maps, find the island and drop a pin on it, copy the coordinates there (tap the pin, then Copy), then paste them into the box below and tap Save. Once an island has a saved location, \"Start GPS Tracking\" on the Home screen can auto-mark a trip in transit when the boat moves 500m from its origin, and auto-detect which island it has arrived at.": "\"ގޫގުލް މެޕްސް ހުޅުވާ\" އަށް ފިއްތާލުމަށްފަހު، ރަށް ހޯދައި އެ ރަށަށް ޕިން ވައްޓާލާށެވެ. އަދި އެތަނުގެ ކޯޑިނޭޓްސް ކޮޕީކުރުމަށްފަހު (ޕިން އަށް ފިއްތާލުމަށްފަހު ކޮޕީ ކުރޭ)، ތިރީގައިވާ ގޮޅިއަށް ޕޭސްޓްކޮށް، \"ސޭވް\" އަށް ފިއްތާލާށެވެ. ރަށެއްގެ ލޮކޭޝަން ސޭވްކުރެވުމުން، ހޯމް ސްކްރީނުގައިވާ \"ޖީޕީއެސް ޓްރެކިންގ ފަށާ\" އިން، ދޯނި ފުރި ރަށާ 500 މީޓަރު ދުރަށް ދިއުމުން ދަތުރު ފެށިފައިވާ ކަމަށް އޮޓޮމެޓިކުން ފާހަގަކުރާނެއެވެ. އަދި ދޯނި ދެވުނީ ކޮން ރަށަކަށްކަންވެސް އަމިއްލައަށް ދެނެގަންނާނެއެވެ.",
  "Tap the account number to copy it. After transferring, tap \"I’ve Paid\" below so the Super Admin can confirm it.": "ކޮޕީ ކުރުމަށްޓަކައި އެކައުންޓް ނަންބަރަށް ފިއްތާލާށެވެ. ފައިސާ ޓްރާންސްފަރ ކުރުމަށްފަހު، ސުޕަރ އެޑްމިން އެކަން ކަށަވަރުކުރުމަށްޓަކައި ތިރީގައިވާ \"ފައިސާ ދައްކައިފިން\" އަށް ފިއްތާލާށެވެ.",
  "Tap the code to copy it": "ކޯޑު ކޮޕީކުރުމަށް ފިތާލައްވާ",
  "The amount on the slip doesn’t match the required amount.": "ސްލިޕްގައިވާ ޢަދަދު، ދައްކަންޖެހޭ ޢަދަދާ ދިމަލެއް ނުވެއެވެ.",
  "The date/time on the slip is outside the allowed 15-minute window.": "ސްލިޕްގައިވާ ތާރީޚް/ގަޑި އިނީ ހުއްދަކުރެވިފައިވާ 15 މިނެޓުގެ ވަގުތުން ބޭރުގައެވެ.",
  "The destination account number on the slip doesn’t match.": "ސްލިޕްގައިވާ ޖަމާކުރި އެކައުންޓް ނަންބަރު ދިމަލެއް ނުވެއެވެ.",
  "This device/browser can't get GPS location.": "މި ޑިވައިސް/ބްރައުޒާއަށް ޖީ.ޕީ.އެސް ލޮކޭޝަން ނުހޯދޭ.",
  "This doesn’t look like a supported transfer slip.": "މިއީ ބަލައިގަނެވޭ ފަދަ ޓްރާންސްފަރ ސްލިޕެއް ކަމަކަށް ނުފެނޭ.",
  "This list belongs to this boat only — other boats in your organization keep their own separate list and prices, even after you download/upload between them.": "މި ލިސްޓަކީ ހަމައެކަނި މި ދޯންޏަށް ޚާއްޞަ ލިސްޓެކެވެ — ތިޔަބޭފުޅުންގެ އޮގަނައިޒޭޝަންގެ އެހެން ދޯނިތަކުގައި ވަކި ލިސްޓުތަކާއި އަގުތައް ހުންނާނެއެވެ. އެއީ އެ ދޯނިތަކުގެ މެދުގައި ޑައުންލޯޑް/އަޕްލޯޑް ކުރި ކަމުގައި ވިޔަސްމެއެވެ.",
  "This package was just marked delivered — was payment collected as well?": "މި ޕެކޭޖް ދެންމެ ވަނީ ޑެލިވަރޑް ކަމަށް މާކްކުރެވިފައި — ފައިސާވެސް ބަލައިގަނެވިއްޖެތަ؟",
  "This slip isn’t a transfer into the correct account.": "މި ސްލިޕަކީ ރަނގަޅު އެކައުންޓަށް ފޮނުވާފައިވާ ޓްރާންސްފަރ އެއް ނޫނެވެ.",
  "To": "އަށް",
  "To Upgrade to pro version pay ރ500 by transfer or Swipe, or pay by crypto.": "ޕްރޯ ވާރޝަނަށް އަޕްގްރޭޑް ކުރުމަށް ޓްރާންސްފަރ ނުވަތަ ސްވައިޕް މެދުވެރިކޮށް 500ރ ދައްކަވާ، ނުވަތަ ކްރިޕްޓޯ އިން ފައިސާ ދައްކަވާ.",
  "Total Due": "ދައްކަންޖެހޭ ޖުމްލަ",
  "Trip ended": "ދަތުރު ނިމިއްޖެ",
  "Trip Ended": "ދަތުރު ނިމިއްޖެ",
  "Trip Settings": "ދަތުރުގެ ސެޓިންގްސް",
  "Unpaid": "ފައިސާ ނުދައްކާ",
  "Up to 2 staff": "2 މުވައްޒަފުންނާ ހަމައަށް",
  "Up to 500 shipments total": "ޖުމްލަ 500 މުދަލާ ހަމައަށް",
  "Upgrade": "އަޕްގްރޭޑް ކުރޭ",
  "Upgrade to Pro": "ޕްރޯ އަށް އަޕްގްރޭޑް ކުރޭ",
  "Upload List": "ލިސްޓް އަޕްލޯޑް ކުރޭ",
  "Using the app in Dhivehi is a Pro feature. Upgrade to Pro to switch languages.": "އެޕް ދިވެހިބަހުން ބޭނުންކުރުމަކީ ޕްރޯ ފީޗާއެކެވެ. ބަސް ބަދަލުކުރުމަށް ޕްރޯ އަށް އަޕްގްރޭޑް ކުރައްވާ.",
  "Verify": "ވެރިފައި ކުރޭ",
  "Verifying…": "ވެރިފައި ކުރަނީ…",
  "via the Swipe app. Pro activates automatically once payment is confirmed — no need to notify the Super Admin for this option.": "ސްވައިޕް އެޕް މެދުވެރިކޮށް. ފައިސާ ދެއްކުން ކަށަވަރުވުމާއެކު އޮޓޮމެޓިކުން ޕްރޯ އެކްޓިވޭޓް ވާނެއެވެ — މި ގޮތް އިޚްތިޔާރުކުރައްވާނަމަ ސުޕަރ އެޑްމިނަށް އެންގުމުގެ ބޭނުމެއް ނެތެވެ.",
  "View Items": "އައިޓަމްތައް ބައްލަވާ",
  "View photo": "ފޮޓޯ ބައްލަވާ",
  "Waiting for the boat to arrive at a destination island before this can be marked delivered.": "'ޑެލިވަރޑް' ކަމަށް މާކް ކުރެވޭނީ ބޯޓު މަންޒިލް ރަށަކަށް ލެފުމުންނެވެ.",
  "Working…": "ޕްރޮސެސްކުރަނީ…",
  "Yes, Mark Delivered": "އާނ، ޑެލިވަރޑް ކަމަށް މާކްކުރޭ",
  "You can upgrade to Pro anytime later from Settings.": "ފަހުން ކޮންމެ ވަގުތެއްގައިވެސް ސެޓިންގްސް އިން ޕްރޯ އަށް އަޕްގްރޭޑް ކުރެވިދާނެއެވެ.",
  "You're clear to sign up with these numbers now. Please submit the form again.": "މިހާރު މި ނަންބަރުތަކުން ސައިން އަޕް ކުރެވޭނެއެވެ. ފޯމު އަލުން ސަބްމިޓް ކުރައްވާ.",
  "You're on Pro — additional boats are granted instantly, no payment or approval needed.": "ތިޔަ ބޭނުންކުރައްވަނީ ޕްރޯ — އިތުރު ފައިސާއެއް ނުވަތަ ހުއްދައަކާ ނުލައި ވަގުތުން އިތުރު ބޯޓުތައް ލިބޭނެ.",
  "You've reached the 500-shipment limit on the Free plan. You can keep logging shipments, but upgrading to Pro removes this limit entirely.": "ހިލޭ ޕްލޭންގައި ދެވިފައިވާ 500 ޝިޕްމަންޓުގެ ލިމިޓް ހަމަވެއްޖެ. އިތުރަށް ޝިޕްމަންޓް އެންޓަރ ކުރެވޭނެ، ނަމަވެސް ޕްރޯ އަށް އަޕްގްރޭޑް ކުރުމުން މި ލިމިޓް އެއްކޮށް އުނިވާނެ.",
  "Your account is reactivated. Log in with your boat name and PIN.": "ތިޔަބޭފުޅާގެ އެކައުންޓް އަލުން އެކްޓިވޭޓް ކުރެވިއްޖެ. ދޯނީގެ ނަމާއި ޕިން ބޭނުންކުރައްވައިގެން ލޮގިންވެވަޑައިގަންނަވާ.",
  "Your Pro subscription has expired.": "ތިޔަބޭފުޅާގެ ޕްރޯ ސަބްސްކްރިޕްޝަންގެ މުއްދަތު ހަމަވެއްޖެ.",
  "You’ve reached the 10-staff limit for this boat on the Pro plan.": "މި ދޯންޏަށް ޕްރޯ ޕްލޭންގައި ދެވޭ 10 މުވައްޒަފުންގެ ލިމިޓް ހަމަވެއްޖެ.",
  "You’ve reached the 2-staff limit on the Free plan. Upgrade to Pro for up to 10 per boat.": "ހިލޭ ޕްލޭންގައި ދެވޭ 2 މުވައްޒަފުންގެ ލިމިޓް ހަމަވެއްޖެ. ކޮންމެ ދޯންޏަކަށް 10 މުވައްޒަފުންނާ ހަމައަށް އިތުރުކުރުމަށް ޕްރޯ އަށް އަޕްގްރޭޑް ކުރައްވާ.",

function t(s){
  return (state.lang === 'dv' && TR[s]) ? TR[s] : s;
}
function applyLangDirection(){
  document.documentElement.lang = state.lang === 'dv' ? 'dv' : 'en';
  document.documentElement.dir = state.lang === 'dv' ? 'rtl' : 'ltr';
}
// Dark theme is a Pro-only, per-boat display preference -- same persistence
// pattern as language (see setLang), just a separate settings field so a
// boat can be Pro + Dhivehi + dark all independently of each other.
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.darkTheme ? 'dark' : 'light');
  renderHeaderThemeToggle();
}
function setDarkTheme(on){
  state.darkTheme = !!on;
  applyTheme();
  if(INTERNAL_ROLES.includes(state.role)){
    withFreshSettings(s => { s.darkTheme = state.darkTheme; }).catch(e => console.error('Could not save theme preference', e));
  }
}
// Bare line-icon moon/sun -- no fill, no circle/backdrop behind either one,
// just the stroke, per how the header toggle button itself is styled
// (see .header-theme-toggle). Icon shown is always the theme that's
// *currently active* (moon while dark, sun while light); tapping it flips
// to the other, see wireHeaderThemeToggle().
const HEADER_THEME_MOON_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="#F4F9FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 019.8 3.5a8.5 8.5 0 1010.7 10.7z"/></svg>`;
const HEADER_THEME_SUN_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="#F4F9FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.2 4.2l1.85 1.85M17.95 17.95l1.85 1.85M2.5 12h2.6M18.9 12h2.6M4.2 19.8l1.85-1.85M17.95 6.05l1.85-1.85"/></svg>`;
// Sits in the header now (see header-theme-toggle-btn), not inside
// Settings -- shown/hidden together with the settings gear button so it
// only ever appears for roles that actually have a Settings tab, since
// dark theme is a per-boat Owner/Manager preference. See renderTabs().
function renderHeaderThemeToggle(){
  const btn = document.getElementById('header-theme-toggle-btn');
  if(!btn) return;
  const pro = isProAccount();
  btn.innerHTML = state.darkTheme ? HEADER_THEME_MOON_SVG : HEADER_THEME_SUN_SVG;
  btn.style.opacity = pro ? '1' : '0.4';
  btn.title = pro ? (state.darkTheme ? 'Dark Mode \u2014 tap for Light Mode' : 'Light Mode \u2014 tap for Dark Mode') : 'Dark Mode is a Pro feature';
}
let _headerThemeToggleWired = false;
function wireHeaderThemeToggle(){
  if(_headerThemeToggleWired) return;
  _headerThemeToggleWired = true;
  const btn = document.getElementById('header-theme-toggle-btn');
  btn.addEventListener('click', () => {
    if(!isProAccount()){
      openProFeatureRequiredPopup(t('Dark mode and light mode switching is a Pro feature. Upgrade to Pro to change your theme.'));
      return;
    }
    // Flip the icon face-down, swap it once it's edge-on (so the change
    // itself is hidden inside the flip rather than popping instantly),
    // then flip back up the rest of the way with the new icon showing.
    btn.classList.add('flip');
    setTimeout(() => {
      setDarkTheme(!state.darkTheme);
      btn.classList.remove('flip');
    }, 175);
  });
}
// ---------------- Glass theme + font size (device-level Preferences) ----
// Unlike darkTheme (Pro-only, per-boat, server-persisted -- see setDarkTheme
// above), the glass look and the font-size step are plain local device
// preferences: free for every role, including the customer portal and the
// pre-login gate screens, so they're just read from/written to
// localStorage rather than the boat's Settings record.
const GLASS_THEME_KEY = 'seafare_glass_theme';
const FONT_SCALE_KEY = 'seafare_font_scale';
function loadGlassPref(){
  try{ return localStorage.getItem(GLASS_THEME_KEY) !== 'off'; }catch(e){ return true; }
}
function applyGlassTheme(on){
  state.glassTheme = !!on;
  document.documentElement.setAttribute('data-glass', state.glassTheme ? 'on' : 'off');
}
function setGlassTheme(on){
  applyGlassTheme(on);
  try{ localStorage.setItem(GLASS_THEME_KEY, on ? 'on' : 'off'); }catch(e){}
}
const FONT_SCALE_STEPS = [
  { key:'small',  label:'Small',       value:0.88 },
  { key:'medium', label:'Medium',      value:1 },
  { key:'large',  label:'Large',       value:1.15 },
  { key:'xlarge', label:'Extra Large', value:1.3 },
];
function loadFontScalePref(){
  try{
    const step = FONT_SCALE_STEPS.find(s => s.key === localStorage.getItem(FONT_SCALE_KEY));
    return step ? step.value : 1;
  }catch(e){ return 1; }
}
function applyFontScale(value){
  state.fontScale = value;
  document.documentElement.style.setProperty('--font-scale', value);
}
function setFontScale(key){
  const step = FONT_SCALE_STEPS.find(s => s.key === key) || FONT_SCALE_STEPS[1];
  applyFontScale(step.value);
  try{ localStorage.setItem(FONT_SCALE_KEY, step.key); }catch(e){}
}
function currentFontScaleKey(){
  const step = FONT_SCALE_STEPS.find(s => Math.abs(s.value - (state.fontScale || 1)) < 0.001);
  return step ? step.key : 'medium';
}
// Small pill-style chip shared by every Light/Dark/Classic/Glass/font-size
// control in the Preferences popup -- plain inline styles rather than the
// app's .btn/.btn-ghost classes, since those assume a light card background
// (dark navy text) while this popup sits on the same dark translucent panel
// as the themed dropdowns (see .custom-select-menu).
function prefChipHtml(attr, value, label, active){
  const style = active
    ? 'background:var(--teal);color:#08202F;font-weight:700;border:none;'
    : 'background:rgba(255,255,255,0.08);color:#F4F9FF;border:1px solid rgba(255,255,255,0.18);';
  return `<button type="button" ${attr}="${value}" style="flex:1;padding:10px 4px;border-radius:8px;cursor:pointer;font-family:'Oswald',sans-serif;letter-spacing:0.03em;text-transform:uppercase;font-size:calc(10.5px * var(--en-scale));${style}">${label}</button>`;
}

/* ---------------- Hamburger app menu ---------------- */
// Opened from the single header-settings-btn (now a hamburger icon, see the
// header markup and renderTabs()) on every role. Surfaces what used to be
// three separate header items -- the role-pill (boat/role name + Log out)
// and the Settings shortcut -- plus the new Preferences entry, in one
// themed popup anchored under the button, reusing the same frosted-glass
// dropdown look as the app's other themed popups (.custom-select-menu).
function closeAppMenu(){
  document.getElementById('app-menu-overlay')?.remove();
  clearAnchoredDropdown();
}
function positionAppMenu(menu, btn){
  const r = btn.getBoundingClientRect();
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const width = Math.min(260, window.innerWidth - 16);
  menu.style.width = width + 'px';
  menu.style.left = Math.max(8, Math.min(r.right - width, window.innerWidth - width - 8)) + 'px';
  menu.style.top = (r.bottom + 8) + 'px';
  menu.style.maxHeight = Math.max(160, vh - (r.bottom + 8) - 10) + 'px';
}
function openAppMenu(){
  closeAppMenu();
  closePreferencesPopup();
  const btn = document.getElementById('header-settings-btn');
  if(!btn) return;
  const overlay = document.createElement('div');
  overlay.className = 'custom-select-overlay';
  overlay.id = 'app-menu-overlay';
  const menu = document.createElement('div');
  menu.className = 'custom-select-menu';
  overlay.appendChild(menu);
  document.body.appendChild(overlay);
  positionAppMenu(menu, btn);
  setAnchoredDropdown(menu, btn);
  overlay.addEventListener('mousedown', (e) => { if(e.target === overlay) closeAppMenu(); });

  const hasSettingsTab = (getRoleTabs()[state.role] || []).some(tb => tb.id === 'settings');
  const isInternal = state.entryMode === 'internal';
  let nameHtml = '';
  if(isInternal && getRoles()[state.role]){
    const roleText = getRoles()[state.role].name + (state.staffName ? ' \u00b7 ' + state.staffName : '');
    const boatName = _boatNameCache[CURRENT_BOAT_ID] || '';
    nameHtml = `<div class="custom-select-title" style="text-transform:none;letter-spacing:0;font-family:'Inter',sans-serif;font-size:calc(13.5px * var(--en-scale));color:#F4F9FF;padding:14px 18px 10px;">${escapeHtml([boatName, roleText].filter(Boolean).join(' \u00b7 '))}</div>`;
  }
  const items = [];
  if(hasSettingsTab){
    items.push(`<button type="button" class="custom-select-option" data-menu-action="settings"><span>${t('Settings')}</span></button>`);
  }
  items.push(`<button type="button" class="custom-select-option" data-menu-action="preferences"><span>${t('Preferences')}</span></button>`);
  if(isInternal){
    items.push(`<button type="button" class="custom-select-option" data-menu-action="logout" style="color:#FF8A80;"><span>${t('Log out')}</span></button>`);
  }
  menu.innerHTML = nameHtml + items.join('');
  menu.querySelector('[data-menu-action="settings"]')?.addEventListener('mousedown', (e) => {
    e.preventDefault();
    closeAppMenu();
    location.hash = 'settings';
  });
  menu.querySelector('[data-menu-action="preferences"]')?.addEventListener('mousedown', (e) => {
    e.preventDefault();
    closeAppMenu();
    openPreferencesPopup();
  });
  menu.querySelector('[data-menu-action="logout"]')?.addEventListener('mousedown', (e) => {
    e.preventDefault();
    closeAppMenu();
    logoutInternal();
  });
}

/* ---------------- Preferences popup (theme + font size) ---------------- */
// A centered themed modal rather than an anchored dropdown, since it holds
// several rows of controls -- opened from the app menu above, reachable
// from every role. Dark/Light stays the existing Pro-gated, per-boat
// setting (see setDarkTheme); Glass and Font Size are free, local, and
// apply immediately app-wide, including on the gate/login screens.
function closePreferencesPopup(){
  if(document.getElementById('preferences-popup-overlay')){ unlockBodyScroll(); }
  document.getElementById('preferences-popup-overlay')?.remove();
}
function openPreferencesPopup(){
  closePreferencesPopup();
  closeAppMenu();
  const overlay = document.createElement('div');
  overlay.className = 'custom-select-overlay';
  overlay.id = 'preferences-popup-overlay';
  overlay.style.display = 'flex';
  overlay.style.alignItems = 'center';
  overlay.style.justifyContent = 'center';
  overlay.style.padding = '16px';
  const menu = document.createElement('div');
  menu.className = 'custom-select-menu';
  menu.style.position = 'relative';
  menu.style.width = 'min(360px, 100%)';
  menu.style.maxHeight = '85vh';
  overlay.appendChild(menu);
  document.body.appendChild(overlay);
  lockBodyScroll();
  overlay.addEventListener('mousedown', (e) => { if(e.target === overlay) closePreferencesPopup(); });

  function draw(){
    const pro = isProAccount();
    const fsKey = currentFontScaleKey();
    menu.innerHTML = `
      <div class="custom-select-title" style="padding:16px 18px 2px;font-size:calc(13px * var(--en-scale));">${t('Preferences')}</div>
      <div style="padding:10px 18px 6px;">
        <div class="custom-select-title" style="padding:0 0 8px;">Appearance</div>
        <div style="display:flex;gap:8px;margin-bottom:18px;">
          ${prefChipHtml('data-pref-glass', 'off', 'Classic', !state.glassTheme)}
          ${prefChipHtml('data-pref-glass', 'on', 'Glass', !!state.glassTheme)}
        </div>
        <div class="custom-select-title" style="padding:0 0 8px;opacity:${pro?1:0.5};">${pro ? 'Theme' : 'Theme \u2014 Pro feature'}</div>
        <div style="display:flex;gap:8px;margin-bottom:18px;opacity:${pro?1:0.5};">
          ${prefChipHtml('data-pref-dark', '0', 'Light', !state.darkTheme)}
          ${prefChipHtml('data-pref-dark', '1', 'Dark', !!state.darkTheme)}
        </div>
        <div class="custom-select-title" style="padding:0 0 8px;">Font Size</div>
        <div style="display:flex;gap:6px;margin-bottom:4px;">
          ${FONT_SCALE_STEPS.map(s => prefChipHtml('data-pref-font', s.key, s.label, fsKey === s.key)).join('')}
        </div>
      </div>
      <button type="button" id="preferences-close-btn" style="margin:6px 18px 18px;width:calc(100% - 36px);background:rgba(255,255,255,0.1);color:#F4F9FF;border:1px solid rgba(255,255,255,0.25);border-radius:8px;padding:12px;cursor:pointer;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.04em;font-size:calc(12px * var(--en-scale));">${t('Close')}</button>
    `;
    menu.querySelectorAll('[data-pref-glass]').forEach(b => b.addEventListener('click', () => {
      setGlassTheme(b.getAttribute('data-pref-glass') === 'on');
      draw();
    }));
    menu.querySelectorAll('[data-pref-dark]').forEach(b => b.addEventListener('click', () => {
      if(!isProAccount()){
        closePreferencesPopup();
        openProFeatureRequiredPopup(t('Dark mode and light mode switching is a Pro feature. Upgrade to Pro to change your theme.'));
        return;
      }
      setDarkTheme(b.getAttribute('data-pref-dark') === '1');
      draw();
    }));
    menu.querySelectorAll('[data-pref-font]').forEach(b => b.addEventListener('click', () => {
      setFontScale(b.getAttribute('data-pref-font'));
      draw();
    }));
    document.getElementById('preferences-close-btn').addEventListener('click', closePreferencesPopup);
  }
  draw();
}

// Sets the icon name shown when someone taps "Add to Home Screen" (and,
// on Android/Chrome, the icon image too) based on which kind of link
// they're actually on -- owner, staff, manager, Super Admin, or a
// customer's tracking link. Called as early as possible (right where the
// hash first gets parsed in init(), and again on every in-app hash
// change) so both are already correct by the time someone taps "Add to
// Home Screen", whenever that happens to be.
//   iOS Safari/Chrome: reads apple-mobile-web-app-title + apple-touch-icon
//   from the live DOM at add-time -- no manifest.json involved at all.
//   Android/Chrome: reads whichever manifest.json is currently linked
//   for the name, short_name, and icons.
function applyHomeScreenBranding(rawHash){
  rawHash = (rawHash != null) ? rawHash : (location.hash || '').replace('#','');
  let suffix = '';
  let manifestFile = 'manifest.json';
  if(rawHash === 'admin' || rawHash.startsWith('admin/')){
    suffix = 'Super Admin'; manifestFile = 'manifest-admin.json';
  } else if(rawHash === OWNER_HASH || rawHash.startsWith(OWNER_HASH + '/')){
    suffix = 'Owner'; manifestFile = 'manifest-owner.json';
  } else if(rawHash === INTERNAL_HASH || rawHash.startsWith(INTERNAL_HASH + '/')){

  } else if(rawHash.startsWith('c/')){
    suffix = 'Customer'; manifestFile = 'manifest-customer.json';
  }
  const label = suffix ? `SeaFare ${suffix}` : 'SeaFare';

// Every full-screen popup (invoice, off-island delivery, load-items form)
// used to leave window.scrollY wherever the on-screen keyboard happened to
// push it while an input inside was focused. Since these are position:fixed
// overlays, the page underneath was still free to scroll/shift during that
// -- so once the popup closed, the app was left sitting a bit higher up
// than where it started. Locking the body in place while any of these are
// open (and explicitly restoring the original scroll position on close)
// fixes it for all of them at once. Counter-based so nested open/close
// calls (e.g. a popup re-opening itself) can't leave it stuck locked.
let _scrollLockCount = 0;
let _scrollLockY = 0;
// When iOS/Safari autofills a saved username+password pair (tapping the
// QuickType suggestion bar, or Face/Touch ID confirming a passkey), the
// field stays focused with the keyboard still up -- same as if the person
// had typed it themselves. Autofill injects the whole value in one shot,
// though, while normal typing changes the value by roughly one character
// per keystroke; using that difference lets us tell the two apart and
// dismiss the keyboard automatically only for the autofill case.
function autoBlurOnAutofill(input){
  if(!input) return;
  let prevLength = input.value.length;
  input.addEventListener('input', () => {
    const newLength = input.value.length;
    const delta = newLength - prevLength;
    prevLength = newLength;
    if(delta > 1){
      setTimeout(() => { if(document.activeElement === input) input.blur(); }, 60);
    }
  });
}

// On the phone-width fixed app-shell (see the ≤900px media query: .shell
// itself is position:fixed;inset:0 and html/body already get
// overflow:hidden), the page behind a dropdown/modal can't scroll in the
// first place -- there's nothing here for the iOS "lock body scroll by
// pinning it to position:fixed" trick to actually prevent. Applying that
// trick anyway was the cause of the bottom tab bar visibly jumping
// upward every time a dropdown (like the header hamburger menu) opened:
// toggling `body{position:fixed}` on top of an already-fixed, already
// non-scrolling shell forces a reflow that can make mobile Safari
// briefly re-show/hide its own URL bar, which changes the visual
// viewport height the fixed bottom nav sits against -- reads as the tab
// bar "coming up" over whatever just opened. Below 900px this now just
// tracks the lock count for balance and skips touching body's position
// entirely; the desktop/tablet layout (where .shell scrolls normally and
// this lock is actually needed to stop the page behind a modal from
// scrolling) is untouched.
function isMobileAppShell(){
  return window.matchMedia('(max-width:900px)').matches;
}
function lockBodyScroll(){
  if(_scrollLockCount === 0 && !isMobileAppShell()){
    _scrollLockY = window.scrollY || window.pageYOffset || 0;
    document.body.style.position = 'fixed';
    document.body.style.top = `-${_scrollLockY}px`;
    document.body.style.left = '0';
    document.body.style.right = '0';
    document.body.style.width = '100%';
  }
  _scrollLockCount++;
}
function unlockBodyScroll(){
  if(_scrollLockCount <= 0) return;
  _scrollLockCount--;
  if(_scrollLockCount === 0 && document.body.style.position === 'fixed'){
    document.body.style.position = '';
    document.body.style.top = '';
    document.body.style.left = '';
    document.body.style.right = '';
    document.body.style.width = '';
    window.scrollTo(0, _scrollLockY);
  }
}

// The most recent thing that happened to a shipment -- created, loaded,
// departed, delivered, or paid -- whichever is latest. Used to sort the
// Dashboard so anything just touched jumps back to the top, not just
// brand-new check-ins.
function lastActivityTime(s){
  const times = [s.createdAt, s.loadedAt, s.inTransitAt, s.deliveredAt, s.paidAt]
    .filter(Boolean).map(t => new Date(t).getTime()).filter(n => !isNaN(n));
  return times.length ? Math.max(...times) : 0;
}

// Used to auto-fill the receiver fields from whoever this sender last sent
// cargo to -- looked up by mobile number (the reliable unique identifier),
// most recent shipment first.
function findLatestShipmentBySenderMobile(mobile, island){
  if(!mobile) return null;
  let matches = (state.shipments||[]).filter(s => s.mobile === mobile && s.receiverName);
  if(island) matches = matches.filter(s => s.island === island);
  if(!matches.length) return null;
  return matches.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
}
// Re-runs the receiver auto-fill for whichever destination island is
// currently selected (dropdown or free-text "Other"), so switching the
// destination picks the sender's most recent receiver for THAT island
// specifically. Only overwrites fields that are empty or were themselves
// auto-filled -- never something the person actually typed in by hand.
function runReceiverAutofillForIsland(senderMobileId, islandSelectId, islandOtherId, rnameId, rmobileId){
  const rname = document.getElementById(rnameId);
  const rmobile = document.getElementById(rmobileId);
  if(!rname || !rmobile) return;
  if((rname.value.trim() || rmobile.value.trim()) && rname.dataset.autofilled !== '1') return;
  const senderMobile = (document.getElementById(senderMobileId)?.value || '').trim();
  const islandSelect = document.getElementById(islandSelectId);
  const islandOther = document.getElementById(islandOtherId);
  let island = '';
  if(islandSelect && islandSelect.value && islandSelect.value !== '__other') island = islandSelect.value;
  else if(islandOther) island = islandOther.value.trim();
  if(!senderMobile || !island) return;
  const last = findLatestShipmentBySenderMobile(senderMobile, island);
  if(last){
    rname.value = last.receiverName || ''; rmobile.value = last.receiverMobile || ''; rname.dataset.autofilled = '1';
  } else {
    rname.value = ''; rmobile.value = ''; rname.dataset.autofilled = '0';
  }
}
// Every distinct receiver this sender has sent to before, most recent first
// -- used for the "type a name, pick from past receivers" suggestions.
function getSenderReceiverHistory(mobile){
  if(!mobile) return [];
  const seen = new Map();
  (state.shipments||[]).filter(s => s.mobile === mobile && s.receiverName)
    .sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt))
    .forEach(s => {
      const key = (s.receiverMobile || '') + '|' + s.receiverName;
      if(!seen.has(key)) seen.set(key, { name: s.receiverName, mobile: s.receiverMobile || '' });
    });
  return Array.from(seen.values());
}
// Wires up two things on a receiver-name field: (1) tapping an auto-filled
// value clears both receiver fields so it's obvious you can type a fresh
// one, and (2) as you type, past receivers for this same sender that match
// show up as tappable suggestions.
function wireReceiverAutofill(senderMobileInputId, rnameId, rmobileId, suggestionsId){
  const rname = document.getElementById(rnameId);
  const rmobile = document.getElementById(rmobileId);
  const suggestionsEl = document.getElementById(suggestionsId);
  if(!rname || !rmobile || !suggestionsEl) return;

  rname.addEventListener('focus', () => {
    if(rname.value.trim() || rmobile.value.trim()){
      rname.value = ''; rmobile.value = ''; rname.dataset.autofilled = '0';
    }
  }, { once: false });
  rname.addEventListener('input', () => {
    rname.dataset.autofilled = '0';
    const senderMobile = (document.getElementById(senderMobileInputId).value||'').trim();
    const q = rname.value.trim().toLowerCase();
    if(!q || !senderMobile){ suggestionsEl.innerHTML = ''; return; }
    const history = getSenderReceiverHistory(senderMobile).filter(h => h.name.toLowerCase().includes(q));
    if(!history.length){ suggestionsEl.innerHTML = ''; return; }
    suggestionsEl.innerHTML = `
      <div style="margin-top:6px;display:flex;flex-direction:column;gap:4px;">
        ${history.map((h,i) => `<button type="button" class="item-result-row" data-pick-idx="${i}" style="width:100%;text-align:left;padding:8px 12px;">${escapeHtml(h.name)} \u2014 ${escapeHtml(h.mobile)}</button>`).join('')}
      </div>
    `;
    suggestionsEl.querySelectorAll('[data-pick-idx]').forEach(b => b.addEventListener('click', () => {
      const h = history[parseInt(b.dataset.pickIdx,10)];
      rname.value = h.name; rmobile.value = h.mobile; rname.dataset.autofilled = '0';
      suggestionsEl.innerHTML = '';
    }));
  });
  rname.addEventListener('blur', () => {
    setTimeout(() => { suggestionsEl.innerHTML = ''; }, 150); // let a suggestion click register first
  });
}

// Long links (Viber invites, tracking URLs, etc) render as ~1.5 lines with
// a "..." tail; tapping toggles the full text. Full text is kept in this
// map (not a data-attribute) to avoid any HTML-escaping edge cases.
const _truncateLinkText = {};
function renderTruncatableLink(id, text, maxLen){
  maxLen = maxLen || 60;
  if(!text) return '\u2014';
  if(text.length <= maxLen) return escapeHtml(text);
  _truncateLinkText[id] = text;
  return `<span class="truncate-link" id="${id}" data-expanded="0">${escapeHtml(text.slice(0, maxLen))}<span class="truncate-dots">\u2026</span></span>`;
}
function wireTruncatableLinks(ids){
  ids.forEach(id => {
    const el = document.getElementById(id);
    if(!el || !_truncateLinkText[id]) return;
    el.addEventListener('click', () => {
      const full = _truncateLinkText[id];
      if(el.dataset.expanded === '1'){
        el.dataset.expanded = '0';
        el.innerHTML = `${escapeHtml(full.slice(0, 60))}<span class="truncate-dots">\u2026</span>`;
      } else {
        el.dataset.expanded = '1';
        el.textContent = full;
      }
    });
  });
}

// Slugifies the LAST word of a name -- e.g. "Ahmed Bassam" -> "bassam" --
// since usernames are now built from the person's last name rather than
// their first name (too many staff/managers across boats share common
// Maldivian first names, which caused collisions/confusion; a last name
// paired with the person's own mobile number is far more likely to be
// unique on its own, and the mobile number tiebreaker below still covers
// the rest).
function slugify(s){
  const parts = String(s||'').toLowerCase().trim().split(/\s+/).filter(Boolean);
  return (parts.length ? parts[parts.length - 1] : '').replace(/[^a-z0-9]/g, '') || 'user';
}
let _boatNameCache = {};
async function getCurrentBoatName(){

  try{

    if(res.ok){
      const data = await res.json();
      _boatNameCache[CURRENT_BOAT_ID] = data.name || 'boat';
      return _boatNameCache[CURRENT_BOAT_ID];
    }
  }catch(e){ console.error('getCurrentBoatName failed', e); }
  return 'boat';
}
// Username = <last name>-<mobile number>, e.g. "bassam-7712345" -- not
// first name, and not tied to the boat name (a boat can have many staff
// with otherwise-identical first names, but each has their own mobile
// number). Falls back to a numbered suffix in the rare case the same
// last name + mobile combination already exists (e.g. a family member
// added twice, or a placeholder/missing mobile shared across entries).
function generateStaffUsername(fullName, mobile, existingUsernames){
  const lastName = slugify(fullName);
  const digits = String(mobile||'').replace(/\D/g,'') || 'nomobile';
  const base = `${lastName}-${digits}`;
  if(!existingUsernames || !existingUsernames.includes(base)) return base;
  let n = 2;
  while(existingUsernames.includes(`${base}${n}`)) n++;
  return `${base}${n}`;
}

// Keeps Owner/Staff/Manager signed in across a page refresh. Without this,
// reloading while on any tab (which changes the URL hash away from
// #owner/#staff/#manager to e.g. #dashboard) has no way to know a session
// was active, and falls back to the public customer view. localStorage
// survives reloads; sessionStorage would also work but wouldn't survive
// closing the tab, which is worse UX for something like a staff member's
// phone left logged in.
//
// Each internal role gets its own storage key -- Owner, Staff, and Manager
// sessions never share one slot, so logging in as one role can never
// overwrite or silently resume as another. This matters on a boat where
// the owner sometimes uses the same device as staff: previously, opening
// the staff link (#staff/<boatId>) while an owner session for that same
// boat was saved would resume as Owner instead of showing the staff PIN
// gate -- the URL you actually opened was being ignored in favor of
// whatever role happened to be saved. Each hash now only ever checks its
// own role's session.
const SESSION_KEYS = { owner: 'cfl_session_owner_v1', staff: 'cfl_session_staff_v1', manager: 'cfl_session_manager_v1' };
// Used only to disambiguate a refresh on a hash that doesn't itself name a
// role (e.g. #dashboard, #settings) -- direct role links/hashes never
// consult this, they always check their own role's session only.
const LAST_ACTIVE_ROLE_KEY = 'cfl_last_active_role_v1';
function saveSession(gateRole, role, staffName, boatId){
  const key = SESSION_KEYS[gateRole] || SESSION_KEYS[role];
  if(!key) return;
  try{
    localStorage.setItem(key, JSON.stringify({ gateRole, role, staffName, boatId: boatId || CURRENT_BOAT_ID }));
    localStorage.setItem(LAST_ACTIVE_ROLE_KEY, gateRole || role);
  }catch(e){ /* localStorage unavailable (private mode etc) -- session just won't persist */ }
}
// forRole is required -- there is no "just give me whatever's saved"
// lookup anymore, since that's exactly the cross-role bleed this was
// changed to prevent. Pass the specific role the current hash implies.
function loadSession(forRole){
  const key = SESSION_KEYS[forRole];
  if(!key) return null;
  try{
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function loadLastActiveRole(){
  try{ return localStorage.getItem(LAST_ACTIVE_ROLE_KEY); }catch(e){ return null; }
}
// With no argument, clears every internal role's session (used at logout
// when we want a full, unambiguous sign-out) -- but callers switching
// boats on one specific role's link (see handleHash) pass that role so
// only that one session is invalidated, leaving any other role's saved
// session for a different boat untouched.
function clearSession(forRole){
  const keys = forRole ? [SESSION_KEYS[forRole]] : Object.values(SESSION_KEYS);
  keys.forEach(k => { if(k){ try{ localStorage.removeItem(k); }catch(e){} } });
  try{ localStorage.removeItem(LAST_ACTIVE_ROLE_KEY); }catch(e){}
}

const ADMIN_SESSION_KEY = 'cfl_admin_session_v1';
function saveAdminSession(username, passkey){
  try{ localStorage.setItem(ADMIN_SESSION_KEY, JSON.stringify({ username, passkey })); }
  catch(e){ /* localStorage unavailable -- session just won't persist */ }
}
function loadAdminSession(){
  try{
    const raw = localStorage.getItem(ADMIN_SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearAdminSession(){
  try{ localStorage.removeItem(ADMIN_SESSION_KEY); }catch(e){}
}

// Invoice popup -- opens right over whatever screen you're on (no
// navigation), with a fast pop-in animation. Tapping outside closes it and
// leaves you exactly where you were.
function openInvoicePopup(shipmentId){
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  closeInvoicePopup();
  lockBodyScroll();
  const overlay = document.createElement('div');
  overlay.id = 'invoice-popup-overlay';
  overlay.dataset.shipmentId = shipmentId;
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:2100;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = `
    <div class="panel" id="invoice-popup-panel" style="max-height:88vh;overflow-y:auto;width:100%;max-width:440px;margin:0;animation:invoice-pop-in 0.18s ease-out;">
      ${renderInvoicePopupContent(s)}
    </div>
  `;
  overlay.addEventListener('click', (e) => { if(e.target === overlay) closeInvoicePopup(); });
  document.body.appendChild(overlay);
  wireInvoicePopupButtons(shipmentId);
  // Swipe the invoice card down (from the top of its scroll) to close it,
  // same as tapping outside or its own close mark.
  enableDragToDismiss(document.getElementById('invoice-popup-panel'), overlay, closeInvoicePopup);
}

// Wires up every button inside the invoice popup's current content --
// pulled out of openInvoicePopup so it can be re-run after refreshing the
// popup's content in place (e.g. right after collecting payment, so it
// flips from Unpaid to Paid without having to close and reopen it).
function wireInvoicePopupButtons(shipmentId){
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  document.getElementById('invoice-popup-close-btn').addEventListener('click', closeInvoicePopup);
  document.querySelectorAll('#invoice-popup-overlay [data-copy-number]').forEach(el => el.addEventListener('click', async (e) => {
    e.stopPropagation();
    const number = el.dataset.copyNumber;
    if(!number) return;
    const original = el.textContent;
    try{
      await navigator.clipboard.writeText(number);
      el.textContent = t('Copied!');
    }catch(err){
      el.textContent = t('Could not copy');
    }
    setTimeout(() => { el.textContent = original; }, 1200);
  }));

  const markDeliveredBtn = document.getElementById('invoice-popup-mark-delivered-btn');
  if(markDeliveredBtn) markDeliveredBtn.addEventListener('click', async () => {
    markDeliveredBtn.disabled = true; markDeliveredBtn.textContent = t('Marking\u2026');
    await withFreshShipments(list => {
      const t = list.find(x => x.id === shipmentId);
      if(t){ t.status = 'delivered'; t.deliveredAt = new Date().toISOString(); }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    navigateToTabAfterPopup('shipments');
  });

  const keepUndeliveredBtn = document.getElementById('invoice-popup-keep-undelivered-btn');
  if(keepUndeliveredBtn) keepUndeliveredBtn.addEventListener('click', () => {
    document.getElementById('invoice-popup-undelivered-banner')?.remove();
  });

  const markUndeliveredBtn = document.getElementById('invoice-popup-mark-undelivered-btn');
  if(markUndeliveredBtn) markUndeliveredBtn.addEventListener('click', async () => {
    if(!confirm(t('Mark this shipment as not yet delivered? Use this if it was marked delivered by mistake.'))) return;
    markUndeliveredBtn.disabled = true; markUndeliveredBtn.textContent = t('Undoing\u2026');
    await withFreshShipments(list => {
      const t = list.find(x => x.id === shipmentId);
      // Back to 'loaded' (not 'in_transit') -- delivery is always the last
      // step regardless of which state came right before it, and 'loaded'
      // is the safe, always-valid predecessor. Clearing deliveredAt also
      // cancels the 3-hour photo cleanup timer for this shipment, since
      // it's no longer actually delivered.
      if(t){ t.status = 'loaded'; t.deliveredAt = null; t.deliveredIsland = null; t.actualReceiverName = null; }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    refreshInvoicePopupInPlace(shipmentId);
    refreshAfterCashPopup();
  });

  const markUnpaidBtn = document.getElementById('invoice-popup-mark-unpaid-btn');
  if(markUnpaidBtn) markUnpaidBtn.addEventListener('click', async () => {
    if(!confirm(t('Mark this invoice as unpaid? Use this if a payment was collected by mistake or needs correcting.'))) return;
    markUnpaidBtn.disabled = true; markUnpaidBtn.textContent = t('Undoing\u2026');
    await withFreshShipments(list => {
      const t = list.find(x => x.id === shipmentId);
      if(t){ t.paid = false; t.paymentMethod = null; t.paidAt = null; }
    });
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    refreshInvoicePopupInPlace(shipmentId);
    refreshAfterCashPopup();
  });

  const cashBtn = document.getElementById('invoice-popup-cash-btn');
  if(cashBtn) cashBtn.addEventListener('click', () => openCashPopup(shipmentId));

  const transferBtn = document.getElementById('invoice-popup-transfer-btn');
  if(transferBtn) transferBtn.addEventListener('click', async () => {
    transferBtn.disabled = true; transferBtn.textContent = t('Confirming\u2026');
    await withFreshShipments(list => {
      const t = list.find(x => x.id === shipmentId);
      if(t){ t.paid = true; t.paymentMethod = 'transfer'; t.paidAt = new Date().toISOString(); }
    });
    state.expandedShipmentIds.delete(shipmentId);
    syncShipmentToSheet(state.shipments.find(x => x.id === shipmentId));
    refreshAfterCashPopup();
    maybePromptMarkDeliveredAfterPayment(shipmentId);
  });

  // Start building the shareable image the moment the popup opens, in the
  // background -- iOS requires navigator.share() to be called synchronously
  // inside the actual tap, with nothing awaited first. By the time "Share
  // Invoice" is tapped, the file is (usually) already sitting ready to go.
  let shareFile = null;
  let shareFilePromise = prepareInvoiceShareFile(s).then(f => { shareFile = f; return f; });

  document.getElementById('invoice-popup-share-btn').addEventListener('click', async () => {
    if(shareFile){ shareFileNow(shareFile, s); return; }
    // Still generating (rare -- only if tapped within the first instant) --
    // wait for it, then share immediately once ready. This retry itself
    // still counts as inside the same tap's activation window on most
    // browsers as long as it's not an excessive delay.
    const btn = document.getElementById('invoice-popup-share-btn');
    btn.disabled = true; btn.textContent = t('Preparing\u2026');
    const f = await shareFilePromise;
    btn.disabled = false; btn.textContent = t('Share Invoice');
    if(f) shareFileNow(f, s);
    else alert(t('Could not generate the invoice image. Check your connection and try again.'));
  });
}

// Re-renders the invoice popup's content in place (e.g. after collecting
// payment) without closing/reopening it, so the person sees it flip to
// Paid immediately. No-ops if the popup isn't open for this shipment.
function refreshInvoicePopupInPlace(shipmentId){
  const overlay = document.getElementById('invoice-popup-overlay');
  if(!overlay || overlay.dataset.shipmentId !== shipmentId) return;
  const s = state.shipments.find(x => x.id === shipmentId);
  if(!s) return;
  document.getElementById('invoice-popup-panel').innerHTML = renderInvoicePopupContent(s);
  wireInvoicePopupButtons(shipmentId);
}
function closeInvoicePopup(){
  if(document.getElementById('invoice-popup-overlay')) unlockBodyScroll();
  document.getElementById('invoice-popup-overlay')?.remove();
}
// Closes the invoice popup (and any list popup that might be open behind
// it) and navigates to the given tab -- used after an action that's
// "done" from the person's point of view (payment collected, delivery
// confirmed) so they land back on the relevant list instead of staring at
// a now-stale popup. Setting location.hash to its current value doesn't
// fire a hashchange event, so that case is handled with a direct
// re-render instead of relying on the hash to do it.
function navigateToTabAfterPopup(tabId){
  closeInvoicePopup();
  closeInvoiceListPopup();
  if(location.hash.replace('#','').split('/')[0] === tabId){
    state.tab = tabId;
    render();
  } else {
    location.hash = tabId;
  }
}

// Renders the invoice to an image and resolves to a File, or null on
// failure. Pure background work -- no gesture-gated APIs called here.
async function prepareInvoiceShareFile(s){
  try{ await loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js'); }
  catch(e){ console.error('html2canvas failed to load', e); return null; }
  if(typeof html2canvas === 'undefined') return null;
  if(!_boatNameCache[CURRENT_BOAT_ID]) await getCurrentBoatName();
  const node = buildInvoiceImageNode(s);
  let canvas;
  try{
    canvas = await html2canvas(node, { scale: 2, backgroundColor: '#ffffff' });
  } catch(e){
    node.remove();
    console.error('invoice image generation failed', e);
    return null;
  }
  node.remove();
  return new Promise(resolve => {
    canvas.toBlob(blob => {
      if(!blob){ resolve(null); return; }
      const filename = `invoice-${(s.invoiceId||s.id).replace(/[^a-z0-9-]/gi,'')}.png`;
      resolve(new File([blob], filename, { type: 'image/png' }));
    }, 'image/png');
  });
}

// Called synchronously (or as close to it as possible) from inside a real
// tap -- this is the only place navigator.share() is actually invoked.
function shareFileNow(file, s){
  if(navigator.canShare && navigator.canShare({ files: [file] })){
    const bankBits = [];
    if(state.settings.bankAccountName) bankBits.push(`Acc. Name: ${state.settings.bankAccountName}`);
    if(state.settings.bankAccountNumber) bankBits.push(`Acc. No : ${state.settings.bankAccountNumber}`);
    const caption = (!s.paid && bankBits.length) ? `- BML Account -\n${bankBits.join('\n')}` : '';
    navigator.share(caption ? { files: [file], text: caption } : { files: [file] }).catch(e => {
      // Some browsers reject a files+text share together -- fall back to
      // file-only rather than silently dropping the whole share.
      if(caption && e && e.name !== 'AbortError'){
        navigator.share({ files: [file] }).catch(() => { /* user cancelled */ });
      }
    });
  } else {
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url; a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    alert('Your browser can\'t open the share sheet directly, so the invoice image downloaded instead \u2014 attach it manually in WhatsApp or Viber.');
  }
}

async function shareInvoiceImage(s){
  const file = await prepareInvoiceShareFile(s);
  if(!file){ alert(t('Could not generate the invoice image. Try again.')); return; }
  shareFileNow(file, s);
}

function fmtDMY(dateStr){
  if(!dateStr) return '--/--/2026';
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}/${y}`;
}
function activeTrip(list){
  return (list||[]).find(t => t.active) || null;
}
// The island the boat has actually arrived at, per the active trip's
// "Boat arrived at" selection in the Trips tab. Used to keep the Dashboard
// pinned to that island by default.
function activeTripArrivedIsland(){
  const t = activeTrip(state.trips);
  return (t && !t.finished && t.arrivedIsland) || null;
}
// The single gate every "mark delivered" path checks: a shipment can't be
// handed over until its own trip has arrived at ANY of its destinations
// (not necessarily the exact island this shipment is bound for -- that
// mismatch case is what the off-island delivery popup handles). Before
// that, trip.arrivedIsland is empty and nothing should be deliverable yet,
// no matter which button or popup someone taps. Once the trip itself is
// finished, though, there's nothing left to wait on -- any shipment still
// sitting undelivered on a finished trip should be markable delivered at
// any time, even if arrivedIsland was never set (or the arrival got
// recorded, then the trip finished without every shipment being handled).
function shipmentTripHasArrived(s){
  if(!s || !s.tripId) return true; // no trip on record (legacy data) -- don't block on something we can't check
  const trip = (state.trips||[]).find(x => x.id === s.tripId);
  if(!trip) return true; // trip data missing -- don't block on something we can't check
  return trip.finished || !!trip.arrivedIsland;
}

Thankyou \ud83d\ude0a${boatName ? `\n~${boatName}~` : ''}`;
}

  // four separate round trips stacked in series before anything can render.
  // Running them together cuts startup time roughly to the slowest single
  // request instead of the sum of all four.
  const [shipments, rates, trips, settings] = await Promise.all([

  state.darkTheme = !!settings.darkTheme && isProAccount();
  applyTheme();
}
